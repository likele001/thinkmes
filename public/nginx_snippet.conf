# 伪静态整段（宝塔 → 伪静态，整段粘贴；74 改成你的 PHP 版本如 80）
# 后台为路径式入口：http://域名/随机路径/index/login，无需单独 .php 文件，全部走 index.php
location ~* (runtime|application)/ {
    return 403;
}
location ~ \.php$ {
    fastcgi_pass unix:/tmp/php-cgi-74.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
    # 长耗时接口（如 AI 文生视频）防 502；若用反代 proxy_pass 则改用 proxy_read_timeout 300;
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;
}
location / {
    if (!-e $request_filename) {
        rewrite ^(.*)$ /index.php?s=$1&$args last;
    }
}
