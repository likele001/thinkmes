<div class="card mb-3">
  <div class="card-header"><i class="fas fa-shield-alt me-2"></i>发起检测</div>
  <div class="card-body">
    <div class="mb-2">
      <label class="form-label">待检测文案</label>
      <textarea id="compliance-text" class="form-control" rows="4" placeholder="输入文案内容进行合规检测"></textarea>
    </div>
    <button type="button" id="compliance-check-btn" class="btn btn-primary"><i class="fas fa-check me-1"></i>检测</button>
    <div id="compliance-result" class="mt-3 small" style="display:none;"></div>
  </div>
</div>
<div class="card">
  <div class="card-header">检测记录</div>
  <div class="card-body">
    <table class="table table-bordered table-hover">
      <thead>
        <tr>
          <th width="50">ID</th>
          <th>内容预览</th>
          <th width="80">结果</th>
          <th width="160">检测时间</th>
          <th width="100">操作</th>
        </tr>
      </thead>
      <tbody id="compliance-tbody"></tbody>
    </table>
    <div id="compliance-pager" class="mt-2 small text-muted"></div>
  </div>
</div>
<script src="/assets/js/wemedia/compliance.js"></script>
