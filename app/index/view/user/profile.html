<div class="card">
  <div class="card-header">{:lang('profile')}</div>
  <div class="card-body">
    <form id="form-profile" class="form-horizontal" style="max-width:640px;">
      <div class="form-group">
        <label class="control-label">{:lang('label_username')}</label>
        <input type="text" class="form-control" id="username" disabled>
      </div>
      <div class="form-group">
        <label class="control-label">{:lang('label_tenant')}</label>
        <input type="text" class="form-control" id="tenant-name" disabled>
      </div>
      <div class="form-group">
        <label class="control-label">{:lang('label_nickname')}</label>
        <input type="text" class="form-control" name="nickname" id="nickname">
      </div>
      <div class="form-group">
        <label class="control-label">{:lang('label_introduction')}</label>
        <textarea class="form-control" name="introduction" id="introduction" rows="3"></textarea>
      </div>
      <div class="form-group">
        <button type="submit" class="btn btn-primary">{:lang('btn_save')}</button>
      </div>
    </form>
  </div>
</div>
<script>
var __L = { save_ok: {:json_encode(lang('msg_save_ok'))}, save_fail: {:json_encode(lang('msg_save_fail'))} };
</script>
<script>
$(function(){
  var tk=localStorage.getItem('token')||'';
  if(!tk){location.href='/index/user/login';return;}
  $.ajax({
    url:'/api/user/profile',
    headers:{'Authorization':'Bearer '+tk},
    success:function(r){
      if(r.code===1){
        var u=r.data||{};
        $('#username').val(u.username||'');
        $('#tenant-name').val(u.tenant_company_name||u.tenant_name||'-');
        $('#nickname').val(u.nickname||'');
        $('#introduction').val(u.introduction||'');
      }else{
        location.href='/index/user/login';
      }
    }
  });
  $('#form-profile').on('submit', function(e){
    e.preventDefault();
    var data=$(this).serialize();
    $.ajax({
      url:'/api/user/updateProfile',
      type:'POST',
      headers:{'Authorization':'Bearer '+tk},
      data:data,
      success:function(r){
        alert(r.msg|| (r.code===1?(typeof __L!=='undefined'&&__L.save_ok?__L.save_ok:'保存成功'):(typeof __L!=='undefined'&&__L.save_fail?__L.save_fail:'保存失败')));
        if(r.code===1){location.href='/index/user/index';}
      }
    });
  });
});
</script>
