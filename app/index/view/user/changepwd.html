<div class="card" style="max-width:520px;margin:20px auto;">
  <div class="card-header">{:lang('change_pwd')}</div>
  <div class="card-body">
    <form id="form-changepwd">
      <div class="form-group">
        <label>{:lang('label_new_password')}</label>
        <input type="password" class="form-control" name="newpassword" placeholder="{:lang('placeholder_new_password')}">
      </div>
      <button type="submit" class="btn btn-primary btn-block">{:lang('btn_save')}</button>
    </form>
  </div>
</div>
<script>
var __L = { change_ok: {:json_encode(lang('msg_change_ok'))}, change_fail: {:json_encode(lang('msg_change_fail'))} };
</script>
<script>
$(function(){
  var tk=localStorage.getItem('token')||'';
  if(!tk){location.href='/index/user/login';return;}
  $('#form-changepwd').on('submit', function(e){
    e.preventDefault();
    var data=$(this).serialize();
    $.ajax({
      url:'/api/user/changePassword',
      type:'POST',
      headers:{'Authorization':'Bearer '+tk},
      data:data,
      success:function(r){
        alert(r.msg|| (r.code===1?(typeof __L!=='undefined'&&__L.change_ok?__L.change_ok:'修改成功'):(typeof __L!=='undefined'&&__L.change_fail?__L.change_fail:'修改失败')));
        if(r.code===1){location.href='/index/user/index';}
      }
    });
  });
});
</script>
