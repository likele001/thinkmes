<div class="card">
  <div class="card-body">
    <div class="d-flex flex-wrap align-items-center gap-2">
      <div class="input-group" style="max-width: 520px;">
        <span class="input-group-text"><i class="fa fa-search"></i></span>
        <input type="text" class="form-control" id="keyword" placeholder="搜索应用名称、描述、关键词">
        <button class="btn btn-primary" type="button" id="btnSearch">搜索</button>
      </div>
      <select class="form-select" id="category" style="max-width: 220px;">
        <option value="">全部分类</option>
        <option value="plugin">插件</option>
        <option value="tool">工具</option>
        <option value="template">模板</option>
        <option value="theme">主题</option>
        <option value="other">其它</option>
      </select>
      <select class="form-select" id="sort" style="max-width: 220px;">
        <option value="default">默认排序</option>
        <option value="downloads">按下载</option>
        <option value="rating">按评分</option>
        <option value="new">按最新</option>
      </select>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a class="btn btn-outline-primary btn-sm" href="/index/store/publish">发布应用</a>
        <a class="btn btn-outline-secondary btn-sm" href="/index/store/my">我的</a>
        <div class="small text-muted" id="meta"></div>
      </div>
    </div>
  </div>
</div>

<div class="row mt-3" id="grid"></div>

<div class="d-flex align-items-center justify-content-between mt-3">
  <div class="small text-muted" id="pageInfo"></div>
  <nav>
    <ul class="pagination mb-0" id="pager"></ul>
  </nav>
</div>

<div class="modal fade" id="buyModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">购买提示</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-info mb-2" id="buyMsg">正在创建订单...</div>
        <div class="small text-muted" id="buyMeta"></div>
        <div class="mt-3" id="payBox" style="display:none;">
          <label class="form-label mb-1">支付方式</label>
          <select class="form-select" id="payMethod"></select>
        </div>
      </div>
      <div class="modal-footer">
        <a class="btn btn-outline-secondary" href="/admin/market/index" target="_blank">打开后台安装</a>
        <button type="button" class="btn btn-primary" id="btnPay">去支付</button>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    var state = { page: 1, limit: 12, keyword: '', category: '', sort: 'default', total: 0, last_page: 1 };
    var currentOrderNo = '';
    var currentAmount = 0;
    var currentPluginTitle = '';

    function esc(s) {
      s = (s == null) ? '' : String(s);
      return s.replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function renderStars(rating) {
      rating = Number(rating || 0);
      var full = Math.round(rating);
      var html = '';
      for (var i = 1; i <= 5; i++) {
        html += '<i class="fa ' + (i <= full ? 'fa-star text-warning' : 'fa-star text-muted') + '"></i>';
      }
      return html;
    }

    function money(v) {
      v = Number(v || 0);
      if (!isFinite(v) || v <= 0) return '免费';
      return '￥' + v.toFixed(2);
    }

    function card(it) {
      var img = it.screenshot ? ('<img src="' + esc(it.screenshot) + '" class="card-img-top" style="height:160px;object-fit:cover;" alt="">') : '';
      var price = money(it.price);
      var badgeCls = price === '免费' ? 'bg-success' : 'bg-primary';
      return ''
        + '<div class="col-12 col-md-6 col-lg-4 col-xl-3 mb-3">'
        + '  <div class="card h-100 shadow-sm">'
        + img
        + '    <div class="card-body d-flex flex-column">'
        + '      <div class="d-flex align-items-start justify-content-between gap-2">'
        + '        <div class="fw-bold text-truncate" title="' + esc(it.title || it.name || '') + '">' + esc(it.title || it.name || '') + '</div>'
        + '        <span class="badge ' + badgeCls + '">' + esc(price) + '</span>'
        + '      </div>'
        + '      <div class="text-muted small mt-1" style="min-height: 36px;overflow:hidden;">' + esc(it.description || '') + '</div>'
        + '      <div class="d-flex align-items-center justify-content-between mt-2">'
        + '        <div class="small">' + renderStars(it.rating) + ' <span class="text-muted">(' + esc(it.rating_count || 0) + ')</span></div>'
        + '        <div class="small text-muted"><i class="fa fa-download me-1"></i>' + esc(it.downloads || 0) + '</div>'
        + '      </div>'
        + '      <div class="mt-3 d-flex gap-2">'
        + '        <a class="btn btn-outline-primary btn-sm flex-fill" href="/index/store/detail?id=' + esc(it.id) + '">查看</a>'
        + '        <button class="btn btn-primary btn-sm flex-fill btn-buy" data-id="' + esc(it.id) + '" data-title="' + esc(it.title || it.name || '') + '">购买</button>'
        + '      </div>'
        + '    </div>'
        + '  </div>'
        + '</div>';
    }

    function renderPager() {
      var pager = $('#pager');
      pager.empty();
      var lp = Number(state.last_page || 1);
      var p = Number(state.page || 1);
      function li(label, target, disabled, active) {
        var cls = 'page-item' + (disabled ? ' disabled' : '') + (active ? ' active' : '');
        var href = disabled ? 'javascript:;' : ('javascript:window.__gotoPage(' + target + ');');
        pager.append('<li class="' + cls + '"><a class="page-link" href="' + href + '">' + label + '</a></li>');
      }
      li('&laquo;', 1, p <= 1, false);
      li('&lsaquo;', Math.max(1, p - 1), p <= 1, false);
      var start = Math.max(1, p - 2);
      var end = Math.min(lp, p + 2);
      for (var i = start; i <= end; i++) {
        li(String(i), i, false, i === p);
      }
      li('&rsaquo;', Math.min(lp, p + 1), p >= lp, false);
      li('&raquo;', lp, p >= lp, false);
    }

    window.__gotoPage = function (p) {
      state.page = Math.max(1, p);
      load();
    };

    function load() {
      $('#grid').html('<div class="col-12"><div class="alert alert-info">加载中...</div></div>');
      $.get('/api/store/plugins', {
        keyword: state.keyword,
        category: state.category,
        sort: state.sort,
        page: state.page,
        limit: state.limit
      }, function (r) {
        if (!r || r.code !== 1 || !r.data) {
          $('#grid').html('<div class="col-12"><div class="alert alert-danger">' + esc((r && r.msg) ? r.msg : '加载失败') + '</div></div>');
          return;
        }
        var d = r.data;
        var list = d.data || [];
        state.total = Number(d.total || 0);
        state.last_page = Number(d.last_page || 1);
        $('#meta').text('共 ' + state.total + ' 个应用');
        $('#pageInfo').text('第 ' + state.page + ' / ' + state.last_page + ' 页');
        renderPager();
        $('#grid').html(list.length ? list.map(card).join('') : '<div class="col-12"><div class="alert alert-secondary">暂无数据</div></div>');
      }, 'json').fail(function () {
        $('#grid').html('<div class="col-12"><div class="alert alert-danger">接口请求失败或返回非 JSON</div></div>');
      });
    }

    function showBuyModal(msg, meta, showPay) {
      $('#buyMsg').text(msg || '');
      $('#buyMeta').text(meta || '');
      $('#btnPay').toggle(!!showPay);
      $('#payBox').toggle(!!showPay);
      var m = new bootstrap.Modal(document.getElementById('buyModal'));
      m.show();
    }

    function loadPayMethods(cb) {
      $.get('/api/store/payment_methods', function (r) {
        if (!r || r.code !== 1 || !r.data) {
          cb('获取支付方式失败');
          return;
        }
        var list = (r.data.list || []);
        if (!list.length) {
          cb('未配置支付通道，请先在后台配置支付');
          return;
        }
        var html = list.map(function (m) {
          return '<option value="' + esc(m.id) + '">' + esc(m.name || m.code || ('通道' + m.id)) + '</option>';
        }).join('');
        $('#payMethod').html(html);
        cb('');
      }, 'json').fail(function () {
        cb('获取支付方式失败');
      });
    }

    function createOrder(pluginId, title) {
      currentOrderNo = '';
      currentAmount = 0;
      currentPluginTitle = title || '';
      showBuyModal('正在创建订单...', '', false);
      $.post('/api/store/order/create', { plugin_id: pluginId }, function (r) {
        if (!r || r.code !== 1 || !r.data) {
          var msg = (r && r.msg) ? r.msg : '创建订单失败';
          if (msg.indexOf('登录') !== -1) {
            window.location.href = '/index/user/login?redirect=' + encodeURIComponent(window.location.href);
            return;
          }
          showBuyModal(msg, '', false);
          return;
        }
        currentOrderNo = r.data.order_no || '';
        var amount = Number(r.data.amount || 0);
        currentAmount = amount;
        if (amount <= 0 || Number(r.data.status || 0) === 1) {
          showBuyModal('购买成功：' + currentPluginTitle, '订单号：' + currentOrderNo + '（免费）', false);
          return;
        }
        loadPayMethods(function (err) {
          if (err) {
            showBuyModal(err, '', false);
            return;
          }
          showBuyModal('订单创建成功：' + currentPluginTitle, '订单号：' + currentOrderNo + '，金额：￥' + amount.toFixed(2), true);
        });
      }, 'json').fail(function () {
        showBuyModal('接口请求失败或返回非 JSON', '', false);
      });
    }

    function pay() {
      if (!currentOrderNo) return;
      var gatewayId = Number($('#payMethod').val() || 0);
      if (!gatewayId) {
        alert('请选择支付方式');
        return;
      }
      $('#btnPay').prop('disabled', true).text('拉起支付...');
      $.post('/api/store/pay', { order_no: currentOrderNo, gateway_id: gatewayId }, function (r) {
        $('#btnPay').prop('disabled', false).text('去支付');
        if (!r || r.code !== 1) {
          showBuyModal((r && r.msg) ? r.msg : '发起支付失败', '', true);
          return;
        }
        var d = r.data || {};
        if (d.pay_url) {
          window.open(d.pay_url, '_blank');
          showBuyModal('已拉起支付：' + currentPluginTitle, '订单号：' + currentOrderNo + '，请在支付完成后返回查询订单状态', true);
          return;
        }
        if (d.form_html) {
          var w = window.open('', '_blank');
          if (w) {
            w.document.write(d.form_html);
            w.document.close();
            showBuyModal('已拉起支付：' + currentPluginTitle, '订单号：' + currentOrderNo + '，请在支付完成后返回查询订单状态', true);
            return;
          }
          showBuyModal('支付表单弹出失败，请允许弹窗', '', true);
          return;
        }
        showBuyModal('发起支付成功', '订单号：' + currentOrderNo, true);
      }, 'json').fail(function () {
        $('#btnPay').prop('disabled', false).text('去支付');
        showBuyModal('支付接口请求失败', '', true);
      });
    }

    $('#btnSearch').on('click', function () {
      state.keyword = $.trim($('#keyword').val() || '');
      state.category = $('#category').val() || '';
      state.sort = $('#sort').val() || 'default';
      state.page = 1;
      load();
    });

    $('#category,#sort').on('change', function () {
      state.category = $('#category').val() || '';
      state.sort = $('#sort').val() || 'default';
      state.page = 1;
      load();
    });

    $(document).on('click', '.btn-buy', function () {
      var id = $(this).data('id');
      var title = $(this).data('title');
      createOrder(id, title);
    });

    $('#btnPay').on('click', pay);

    load();
  })();
</script>
