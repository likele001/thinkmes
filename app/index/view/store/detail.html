<div class="card">
  <div class="card-body">
    <a class="btn btn-outline-secondary btn-sm" href="/index/store"><i class="fa fa-arrow-left me-1"></i>返回应用商店</a>
    <div class="row mt-3">
      <div class="col-12 col-lg-4">
        <div class="border rounded bg-light" style="height:240px;overflow:hidden;">
          <img id="shot" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
          <div id="shotEmpty" class="h-100 d-flex align-items-center justify-content-center text-muted">暂无截图</div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-2" id="shotThumbs"></div>
      </div>
      <div class="col-12 col-lg-8">
        <h3 class="mb-1" id="title">-</h3>
        <div class="text-muted mb-2" id="desc">-</div>
        <div class="d-flex flex-wrap gap-2 mb-3">
          <span class="badge bg-secondary" id="category">-</span>
          <span class="badge bg-info" id="version">-</span>
          <span class="badge bg-success" id="php">PHP -</span>
          <span class="badge bg-primary" id="price">-</span>
        </div>
        <div class="small text-muted mb-3" id="meta">-</div>
        <div class="d-flex flex-wrap gap-2">
          <a class="btn btn-outline-primary" id="home" href="#" target="_blank" style="display:none;"><i class="fa fa-link me-1"></i>主页</a>
          <a class="btn btn-outline-secondary" href="/admin/market/index" target="_blank"><i class="fa fa-tools me-1"></i>后台下载安装</a>
          <button class="btn btn-primary" id="btnBuy">购买</button>
          <a class="btn btn-success" id="btnDownload" href="#" style="display:none;">下载</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card mt-3">
  <div class="card-body">
    <div class="h5 mb-3">详细介绍</div>
    <div id="detail" class="text-muted">暂无</div>
  </div>
</div>

<div class="modal fade" id="buyModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">购买提示</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-info mb-2" id="buyMsg">正在创建订单...</div>
        <div class="small text-muted" id="buyMeta"></div>
        <div class="mt-3" id="payBox" style="display:none;">
          <label class="form-label mb-1">支付方式</label>
          <select class="form-select" id="payMethod"></select>
        </div>
      </div>
      <div class="modal-footer">
        <a class="btn btn-outline-secondary" href="/admin/market/index" target="_blank">打开后台安装</a>
        <button type="button" class="btn btn-primary" id="btnPay">去支付</button>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    var pluginId = Number('{$pluginId|default=0}') || 0;
    var currentOrderNo = '';
    var currentAmount = 0;
    var currentTitle = '';

    function esc(s) {
      s = (s == null) ? '' : String(s);
      return s.replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function money(v) {
      v = Number(v || 0);
      if (!isFinite(v) || v <= 0) return '免费';
      return '￥' + v.toFixed(2);
    }

    function nl2brSafe(text) {
      var t = esc(text || '');
      t = t.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      return t.replace(/\n/g, '<br>');
    }

    function renderShots(shots, cover) {
      shots = (shots && shots.length) ? shots.slice(0) : [];
      if (cover) {
        if (shots.indexOf(cover) === -1) shots.unshift(cover);
      }
      shots = shots.filter(function (u) { return !!u; });
      if (!shots.length) {
        $('#shot').hide().attr('src', '');
        $('#shotEmpty').show();
        $('#shotThumbs').empty();
        return;
      }
      $('#shot').attr('src', shots[0]).show();
      $('#shotEmpty').hide();
      if (shots.length <= 1) {
        $('#shotThumbs').empty();
        return;
      }
      $('#shotThumbs').html(shots.map(function (u, idx) {
        return '<a href="javascript:;" class="border rounded" data-idx="' + idx + '" style="display:inline-block;width:58px;height:58px;overflow:hidden;">'
          + '<img src="' + esc(u) + '" style="width:58px;height:58px;object-fit:cover;" alt="">'
          + '</a>';
      }).join(''));
      $('#shotThumbs').off('click').on('click', 'a', function () {
        var idx = Number($(this).data('idx'));
        if (!isFinite(idx) || idx < 0 || idx >= shots.length) return;
        $('#shot').attr('src', shots[idx]).show();
      });
    }

    function showBuyModal(msg, meta, showPay) {
      $('#buyMsg').text(msg || '');
      $('#buyMeta').text(meta || '');
      $('#btnPay').toggle(!!showPay);
      $('#payBox').toggle(!!showPay);
      var m = new bootstrap.Modal(document.getElementById('buyModal'));
      m.show();
    }

    function loadPayMethods(cb) {
      $.get('/api/store/payment_methods', function (r) {
        if (!r || r.code !== 1 || !r.data) {
          cb('获取支付方式失败');
          return;
        }
        var list = (r.data.list || []);
        if (!list.length) {
          cb('未配置支付通道，请先在后台配置支付');
          return;
        }
        var html = list.map(function (m) {
          return '<option value="' + esc(m.id) + '">' + esc(m.name || m.code || ('通道' + m.id)) + '</option>';
        }).join('');
        $('#payMethod').html(html);
        cb('');
      }, 'json').fail(function () {
        cb('获取支付方式失败');
      });
    }

    function load() {
      if (!pluginId) {
        $('.card-body').prepend('<div class="alert alert-danger">参数错误</div>');
        return;
      }
      $.get('/api/store/detail', { id: pluginId }, function (r) {
        if (!r || r.code !== 1 || !r.data || !r.data.plugin) {
          $('.card-body').prepend('<div class="alert alert-danger">' + esc((r && r.msg) ? r.msg : '加载失败') + '</div>');
          return;
        }
        var p = r.data.plugin;
        currentTitle = p.title || p.name || '';
        $('#title').text(currentTitle);
        $('#desc').text(p.description || '');
        $('#category').text(p.category || 'other');
        $('#version').text('v' + (p.version || ''));
        $('#php').text('PHP ' + (p.require_php || '-'));
        $('#price').text(money(p.price));
        $('#meta').html(
          '作者：' + esc(p.author || '-') + '　|　下载：' + esc(p.downloads || 0) + '　|　评分：' + esc(p.rating || 0) + '（' + esc(p.rating_count || 0) + '）'
        );
        $('#detail').html((p.detail && String(p.detail).trim() !== '') ? nl2brSafe(p.detail) : '暂无');
        if (p.homepage) {
          $('#home').attr('href', p.homepage).show();
        }
        var shots = p.screenshots || [];
        if (typeof shots === 'string' && shots) {
          try { shots = JSON.parse(shots) || []; } catch (e) { shots = []; }
        }
        if (!Array.isArray(shots)) shots = [];
        renderShots(shots, p.screenshot || '');
        if (p.version) {
          $('#btnDownload').attr('href', '/api/store/download?plugin_id=' + pluginId + '&version=' + encodeURIComponent(p.version)).show();
        }
      }, 'json').fail(function () {
        $('.card-body').prepend('<div class="alert alert-danger">接口请求失败或返回非 JSON</div>');
      });
    }

    function createOrder() {
      currentOrderNo = '';
      currentAmount = 0;
      showBuyModal('正在创建订单...', '', false);
      $.post('/api/store/order/create', { plugin_id: pluginId }, function (r) {
        if (!r || r.code !== 1 || !r.data) {
          var msg = (r && r.msg) ? r.msg : '创建订单失败';
          if (msg.indexOf('登录') !== -1) {
            window.location.href = '/index/user/login?redirect=' + encodeURIComponent(window.location.href);
            return;
          }
          showBuyModal(msg, '', false);
          return;
        }
        currentOrderNo = r.data.order_no || '';
        var amount = Number(r.data.amount || 0);
        currentAmount = amount;
        if (amount <= 0 || Number(r.data.status || 0) === 1) {
          showBuyModal('购买成功：' + currentTitle, '订单号：' + currentOrderNo + '（免费）', false);
          return;
        }
        loadPayMethods(function (err) {
          if (err) {
            showBuyModal(err, '', false);
            return;
          }
          showBuyModal('订单创建成功：' + currentTitle, '订单号：' + currentOrderNo + '，金额：￥' + amount.toFixed(2), true);
        });
      }, 'json').fail(function () {
        showBuyModal('接口请求失败或返回非 JSON', '', false);
      });
    }

    function pay() {
      if (!currentOrderNo) return;
      var gatewayId = Number($('#payMethod').val() || 0);
      if (!gatewayId) {
        alert('请选择支付方式');
        return;
      }
      $('#btnPay').prop('disabled', true).text('拉起支付...');
      $.post('/api/store/pay', { order_no: currentOrderNo, gateway_id: gatewayId }, function (r) {
        $('#btnPay').prop('disabled', false).text('去支付');
        if (!r || r.code !== 1) {
          showBuyModal((r && r.msg) ? r.msg : '发起支付失败', '', true);
          return;
        }
        var d = r.data || {};
        if (d.pay_url) {
          window.open(d.pay_url, '_blank');
          showBuyModal('已拉起支付：' + currentTitle, '订单号：' + currentOrderNo + '，请在支付完成后返回查询订单状态', true);
          return;
        }
        if (d.form_html) {
          var w = window.open('', '_blank');
          if (w) {
            w.document.write(d.form_html);
            w.document.close();
            showBuyModal('已拉起支付：' + currentTitle, '订单号：' + currentOrderNo + '，请在支付完成后返回查询订单状态', true);
            return;
          }
          showBuyModal('支付表单弹出失败，请允许弹窗', '', true);
          return;
        }
        showBuyModal('发起支付成功', '订单号：' + currentOrderNo, true);
      }, 'json').fail(function () {
        $('#btnPay').prop('disabled', false).text('去支付');
        showBuyModal('支付接口请求失败', '', true);
      });
    }

    $('#btnBuy').on('click', createOrder);
    $('#btnPay').on('click', pay);

    load();
  })();
</script>
