<!-- 页面标题 -->
<div class="ai-page-header">
  <h1 class="ai-page-title"><i class="fas fa-th-large me-2" style="-webkit-text-fill-color:#7c5cfc;"></i>模板广场</h1>
  <p class="ai-page-desc">42+ 专业文案模板，覆盖电商、短视频、社交媒体、直播等场景</p>
</div>

<!-- 搜索栏 -->
<div class="ai-action-bar">
  <div class="ai-input-group">
    <input type="text" id="tpl-keyword" class="ai-input" placeholder="搜索模板..." style="max-width:280px;">
    <button type="button" id="tpl-search" class="ai-btn ai-btn-primary ai-btn-sm"><i class="fas fa-search"></i></button>
  </div>
  <div style="font-size:12px; color:var(--ai-text-muted);" id="tpl-count"></div>
</div>

<!-- 分类标签 -->
<div class="ai-cat-bar" id="cat-bar"></div>

<!-- 模板网格 -->
<div class="ai-tpl-grid" id="tpl-grid"></div>

<script>
(function(){
  var currentCat = 0, page = 1, limit = 20;

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function loadCategories(){
    $.get('/api/prompt/template/categories', function(r){
      if (r.code !== 1) return;
      var list = r.data.list || [];
      var html = '<button class="ai-cat-btn active" data-id="0">全部</button>';
      list.forEach(function(c){
        html += '<button class="ai-cat-btn" data-id="' + c.id + '"><i class="' + esc(c.icon||'fas fa-tag') + '"></i> ' + esc(c.name) + '</button>';
      });
      $('#cat-bar').html(html);
    }, 'json');
  }

  function loadTemplates(){
    $('#tpl-grid').html('<div class="ai-empty"><i class="fas fa-spinner fa-spin"></i><p>加载中…</p></div>');
    $.get('/api/prompt/template/index', { page: page, limit: limit, category_id: currentCat, keyword: $('#tpl-keyword').val() }, function(r){
      if (r.code !== 1) {
        $('#tpl-grid').html('<div class="ai-empty"><p>' + (r.msg||'加载失败') + '</p></div>');
        return;
      }
      var list = r.data.list || [];
      var total = r.data.total || 0;
      $('#tpl-count').text('共 ' + total + ' 个模板');
      if (list.length === 0) {
        $('#tpl-grid').html('<div class="ai-empty"><i class="fas fa-inbox"></i><p>暂无匹配的模板</p></div>');
        return;
      }
      var html = '';
      list.forEach(function(t){
        html += '<a href="/index/prompt/template/detail?id=' + t.id + '" class="ai-tpl-card">';
        html += '<div class="ai-tpl-icon"><i class="' + esc(t.icon||'fas fa-file-alt') + '"></i></div>';
        html += '<div class="ai-tpl-title">' + esc(t.title) + '</div>';
        html += '<div class="ai-tpl-desc">' + esc(t.description||'') + '</div>';
        html += '<div class="ai-tpl-uses"><i class="fas fa-fire me-1" style="color:#fbbf24;"></i>' + (t.use_count||0) + ' 次使用</div>';
        html += '</a>';
      });
      $('#tpl-grid').html(html);
    }, 'json');
  }

  $(document).on('click', '.ai-cat-btn', function(){
    $('.ai-cat-btn').removeClass('active');
    $(this).addClass('active');
    currentCat = parseInt($(this).data('id'), 10) || 0;
    page = 1; loadTemplates();
  });

  $('#tpl-search').on('click', function(){ page = 1; loadTemplates(); });
  $('#tpl-keyword').on('keydown', function(e){ if (e.key === 'Enter') { page = 1; loadTemplates(); } });

  loadCategories();
  loadTemplates();
})();
</script>
