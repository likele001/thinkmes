<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填写购买信息 - KeleAdmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
        }
        .package-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .form-label {
            font-weight: bold;
            color: #333;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ddd;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 12px 40px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .payment-method {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .payment-method:hover {
            border-color: #667eea;
        }
        .payment-method.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-container">
                    <h2 class="text-center mb-4">填写购买信息</h2>

                    <!-- 套餐摘要 -->
                    <div class="package-summary">
                        <h4 class="mb-2">{$package.name}</h4>
                        <p class="mb-0">
                            价格：<strong>¥{$package.price}</strong> |
                            有效期：{$package.expire_days_text}
                        </p>
                    </div>

                    <form id="purchaseForm">
                        <!-- 企业信息 -->
                        <h5 class="mb-3">企业信息</h5>
                        <div class="mb-3">
                            <label class="form-label">企业名称 *</label>
                            <input type="text" class="form-control" name="company_name" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">联系人 *</label>
                                <input type="text" class="form-control" name="contact_name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">联系电话 *</label>
                                <input type="text" class="form-control" name="contact_phone" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">联系邮箱 *</label>
                            <input type="email" class="form-control" name="contact_email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">绑定域名 *</label>
                            <input type="text" class="form-control" name="domain" placeholder="example.com" required>
                            <small class="text-muted">填写后用于访问您的系统</small>
                        </div>

                        <!-- 管理员账号 -->
                        <h5 class="mb-3 mt-4">管理员账号</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">登录账号 *</label>
                                <input type="text" class="form-control" name="login_account" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">登录密码 *</label>
                                <input type="password" class="form-control" name="login_password" required>
                            </div>
                        </div>

                        <!-- 支付方式 -->
                        <h5 class="mb-3 mt-4">选择支付方式</h5>
                        <div class="mb-3" id="paymentMethods">
                            <p class="text-muted">加载中...</p>
                        </div>

                        <input type="hidden" name="package_id" value="{$package.id}">
                        <input type="hidden" name="gateway_id" id="gatewayId" required>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-submit btn-lg">
                                立即支付 ¥{$package.price}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 加载支付方式
        fetch('/api/tenant_purchase/payment_methods')
            .then(res => res.json())
            .then(data => {
                if (data.code === 1) {
                    const container = document.getElementById('paymentMethods');
                    container.innerHTML = data.data.map(gateway => `
                        <div class="payment-method" data-gateway-id="${gateway.id}">
                            <div class="d-flex align-items-center">
                                <input type="radio" name="payment_method" value="${gateway.id}" class="me-3">
                                <div>
                                    <strong>${gateway.name}</strong>
                                    <small class="text-muted d-block">${gateway.code}</small>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    // 绑定选择事件
                    document.querySelectorAll('.payment-method').forEach(el => {
                        el.addEventListener('click', function() {
                            document.querySelectorAll('.payment-method').forEach(e => e.classList.remove('selected'));
                            this.classList.add('selected');
                            document.getElementById('gatewayId').value = this.dataset.gatewayId;
                            this.querySelector('input[type="radio"]').checked = true;
                        });
                    });
                }
            });

        // 表单提交
        document.getElementById('purchaseForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const gatewayId = document.getElementById('gatewayId').value;

            if (!gatewayId) {
                alert('请选择支付方式');
                return;
            }

            // 第一步：创建订单
            const orderData = {
                package_id: formData.get('package_id'),
                company_name: formData.get('company_name'),
                contact_name: formData.get('contact_name'),
                contact_phone: formData.get('contact_phone'),
                contact_email: formData.get('contact_email'),
                domain: formData.get('domain'),
                login_account: formData.get('login_account'),
                login_password: formData.get('login_password')
            };

            fetch('/api/tenant_purchase/create_order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(orderData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 1) {
                    // 第二步：发起支付
                    const payData = {
                        order_no: data.data.order_no,
                        gateway_id: gatewayId
                    };

                    return fetch('/api/tenant_purchase/pay', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams(payData)
                    });
                } else {
                    throw new Error(data.msg || '创建订单失败');
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 1) {
                    // 跳转到支付页面或显示支付二维码
                    if (data.data.pay_url) {
                        window.location.href = data.data.pay_url;
                    } else if (data.data.form_html) {
                        document.body.innerHTML = data.data.form_html;
                    } else {
                        alert('支付发起成功');
                    }
                } else {
                    throw new Error(data.msg || '发起支付失败');
                }
            })
            .catch(error => {
                alert(error.message);
            });
        });
    </script>
</body>
</html>
