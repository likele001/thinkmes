<div class="card" style="max-width:520px;margin:40px auto;">
  <div class="card-header">开发者注册</div>
  <div class="card-body">
    <form id="form-dev-register">
      <div class="form-group">
        <label>账号</label>
        <input type="text" class="form-control" name="account" placeholder="账号（字母/数字开头，可包含 . _ - ）">
      </div>
      <div class="form-group">
        <label>显示名称</label>
        <input type="text" class="form-control" name="name" placeholder="显示名称（可选）">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" class="form-control" name="password" placeholder="密码（至少6位）">
      </div>
      <input type="hidden" name="redirect" value="{:isset($redirect)?htmlspecialchars((string)$redirect):''}">
      <button type="submit" class="btn btn-primary btn-block">注册</button>
      <div style="margin-top:10px;">
        已有开发者账号？<a href="/index/developer/login?redirect={:urlencode(isset($redirect)?(string)$redirect:'/index/developer/center')}">去登录</a>
      </div>
    </form>
  </div>
</div>
<script>
$(function(){
  function getRedirect(){
    var r = $('input[name="redirect"]').val() || '';
    if (!r) {
      var sp = new URLSearchParams(window.location.search || '');
      r = sp.get('redirect') || '';
    }
    return r || '/index/developer/center';
  }

  $('#form-dev-register').on('submit', function(e){
    e.preventDefault();
    var data = $(this).serialize();
    $.post('/api/developer/register', data, function(r){
      if(r && r.code===1){
        var to = getRedirect();
        location.href = to;
      }else{
        alert((r && r.msg) ? r.msg : '注册失败');
      }
    }, 'json').fail(function(){
      alert('接口请求失败或返回非 JSON');
    });
  });
});
</script>
