<div class="card">
  <div class="card-body">
    <div class="d-flex flex-wrap align-items-center justify-content-between">
      <div>
        <div class="h5 mb-1">开发者中心</div>
        <div class="text-muted small">管理开发者账号与发布应用。</div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-primary" href="/index/store">返回商店</a>
        <a class="btn btn-outline-secondary" href="/index/store/my">我的应用</a>
        <a class="btn btn-primary" href="/index/store/publish">发布应用</a>
      </div>
    </div>
    <hr>

    <div id="devInfo" class="alert alert-info d-none"></div>
    <div id="devErr" class="alert alert-danger d-none"></div>

    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="card">
          <div class="card-body">
            <div class="h6 mb-2">账号信息</div>
            <div class="small text-muted" id="devProfile">加载中...</div>
            <div class="mt-3 d-flex gap-2">
              <a class="btn btn-outline-primary btn-sm" href="/index/developer/profile">查看资料</a>
              <button class="btn btn-outline-danger btn-sm" id="btnDevLogout">退出登录</button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="card">
          <div class="card-body">
            <div class="h6 mb-2">快捷入口</div>
            <div class="d-grid gap-2">
              <a class="btn btn-primary" href="/index/store/publish">发布应用</a>
              <a class="btn btn-outline-secondary" href="/index/store/my">管理我的应用</a>
              <a class="btn btn-outline-secondary" href="/index/store">浏览应用商店</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    function show(el, text) {
      el.removeClass('d-none').text(text || '');
    }
    function hide(el) {
      el.addClass('d-none').text('');
    }

    var $err = $('#devErr');
    var $info = $('#devInfo');
    var $profile = $('#devProfile');

    function loadProfile() {
      hide($err);
      hide($info);
      $.get('/api/developer/profile', function (r) {
        if (!r || r.code !== 1 || !r.data) {
          var msg = (r && r.msg) ? r.msg : '加载失败';
          show($err, msg);
          if (msg.indexOf('登录') !== -1 || msg.indexOf('过期') !== -1) {
            location.href = '/index/developer/login?redirect=' + encodeURIComponent(location.href);
          }
          return;
        }
        var d = r.data || {};
        var text = '账号：' + (d.account || '') + '；名称：' + (d.name || '') + '；ID：' + (d.developer_id || '');
        $profile.text(text);
      }, 'json').fail(function () {
        show($err, '接口请求失败或返回非 JSON');
      });
    }

    $('#btnDevLogout').on('click', function () {
      $.post('/api/developer/logout', {}, function (r) {
        if (r && r.code === 1) {
          location.href = '/index/developer/login';
          return;
        }
        show($err, (r && r.msg) ? r.msg : '退出失败');
      }, 'json').fail(function () {
        show($err, '接口请求失败或返回非 JSON');
      });
    });

    loadProfile();
  })();
</script>
