<div class="container-main">
  <div class="member-layout">
    <div class="member-left">
      <div class="card">
        <div class="card-body">
          <ul class="nav nav-pills flex-column">
            <li class="nav-item"><a class="nav-link active" href="/index/customer/index"><i class="fa fa-shopping-cart mr-2"></i>{:lang('nav_place_order')}</a></li>
            <li class="nav-item"><a class="nav-link" href="/index/customer/orders"><i class="fa fa-list mr-2"></i>{:lang('nav_orders')}</a></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="member-right">
      <div class="card">
        <div class="card-body">
          <div class="profile-row" style="display:flex;align-items:center;gap:16px;">
            <div class="avatar-circle" id="avatar">C</div>
            <div style="flex:1;">
              <div style="display:flex;align-items:center;gap:8px;">
                <strong id="customer-name">-</strong>
                <span id="customer-code" style="color:#666;"></span>
              </div>
              <div style="color:#666;margin-top:6px;">{:lang('label_tenant')}<span id="tenant-name">-</span></div>
              <div style="color:#666;margin-top:6px;">{:lang('label_contact')}<span id="contact-name">-</span> ｜ 电话 <span id="contact-phone">-</span></div>
            </div>
            <div>
              <a class="btn btn-outline-secondary" href="/index/customer/orders"><i class="fa fa-list"></i> {:lang('btn_view_orders')}</a>
            </div>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:10px;">
        <div class="card-header">
          <h5 class="card-title">{:lang('title_products')}</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>{:lang('th_product')}</th>
                  <th>{:lang('th_price')}</th>
                  <th>{:lang('th_currency')}</th>
                  <th>{:lang('th_min_qty')}</th>
                  <th>{:lang('th_quantity')}</th>
                </tr>
              </thead>
              <tbody id="product-list">
              </tbody>
            </table>
          </div>
          <div class="form-group" style="margin-top:10px;">
            <label>{:lang('label_order_remark')}</label>
            <input type="text" class="form-control" id="order-remark" maxlength="255" placeholder="{:lang('placeholder_remark')}">
          </div>
          <div style="text-align:right;margin-top:10px;">
            <button class="btn btn-primary" id="btn-submit-order"><i class="fa fa-check"></i> {:lang('btn_submit_order')}</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
var __L = { msg_load_fail: {:json_encode(lang('msg_load_fail'))}, msg_no_products: {:json_encode(lang('msg_no_products'))}, msg_select_product: {:json_encode(lang('msg_select_product'))}, msg_order_fail: {:json_encode(lang('msg_order_fail'))} };
</script>
<script>
$(function(){
  var tokenKey = 'customer_token';
  var tk = localStorage.getItem(tokenKey) || '';
  if(!tk){
    location.href = '/index/customer/login';
    return;
  }
  function loadProfile(){
    $.ajax({
      url:'/api/customer/profile',
      headers:{'Authorization':'Bearer '+tk},
      success:function(r){
        if(r.code !== 1){
          location.href = '/index/customer/login';
          return;
        }
        var c = r.data || {};
        var name = c.customer_name || c.name || '-';
        $('#customer-name').text(name);
        $('#customer-code').text(c.customer_code || '');
        $('#tenant-name').text(c.tenant_company_name || c.tenant_name || '-');
        $('#contact-name').text(c.contact_name || '-');
        $('#contact-phone').text(c.contact_phone || '-');
        var avatar = (name || 'C').substr(0,1).toUpperCase();
        $('#avatar').text(avatar);
      }
    });
  }
  function loadProducts(){
    $.ajax({
      url:'/api/customer/products',
      headers:{'Authorization':'Bearer '+tk},
      success:function(r){
        if(r.code !== 1){
          $('#product-list').html('<tr><td colspan="5" class="text-center">'+(typeof __L!=='undefined'&&__L.msg_load_fail?__L.msg_load_fail:'加载失败')+'</td></tr>');
          return;
        }
        var list = (r.data && r.data.list) ? r.data.list : [];
        if(!list.length){
          $('#product-list').html('<tr><td colspan="5" class="text-center">'+(typeof __L!=='undefined'&&__L.msg_no_products?__L.msg_no_products:'暂无可下单产品')+'</td></tr>');
          return;
        }
        var html = '';
        list.forEach(function(it){
          html += '<tr data-id="'+it.id+'">'
            + '<td>'+(it.name||'')+'</td>'
            + '<td>'+(it.price||0)+'</td>'
            + '<td>'+(it.currency||'')+'</td>'
            + '<td>'+(it.min_qty||1)+'</td>'
            + '<td><input type="number" class="form-control input-qty" min="'+(it.min_qty||1)+'" placeholder="'+(it.min_qty||1)+'"></td>'
            + '</tr>';
        });
        $('#product-list').html(html);
      },
      error:function(){
        $('#product-list').html('<tr><td colspan="5" class="text-center">'+(typeof __L!=='undefined'&&__L.msg_load_fail?__L.msg_load_fail:'加载失败')+'</td></tr>');
      }
    });
  }
  $('#btn-submit-order').on('click', function(){
    var items = [];
    $('#product-list tr').each(function(){
      var id = parseInt($(this).data('id') || 0, 10);
      var qty = parseInt($(this).find('.input-qty').val() || 0, 10);
      if(id && qty > 0){
        items.push({customer_product_id:id, quantity:qty});
      }
    });
    if(!items.length){
      alert(typeof __L!=='undefined'&&__L.msg_select_product?__L.msg_select_product:'请至少选择一个产品并填写数量');
      return;
    }
    var payload = {
      items_json: JSON.stringify(items),
      remark: $('#order-remark').val() || ''
    };
    $.post({
      url:'/api/customer/createOrder',
      headers:{'Authorization':'Bearer '+tk},
      data:payload,
      success:function(r){
        if(r.msg){
          alert(r.msg);
        }
        if(r.code === 1){
          location.href = '/index/customer/orders';
        }
      },
      error:function(){
        alert(typeof __L!=='undefined'&&__L.msg_order_fail?__L.msg_order_fail:'下单失败，请稍后重试');
      }
    });
  });
  loadProfile();
  loadProducts();
});
</script>
