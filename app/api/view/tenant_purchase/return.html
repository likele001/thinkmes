<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付结果 - KeleAdmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .result-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .result-icon {
            font-size: 80px;
            margin-bottom: 30px;
        }
        .result-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .result-info {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .result-info p {
            margin: 10px 0;
        }
        .result-info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <div id="loading" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-3">正在查询支付结果...</p>
        </div>

        <div id="result" style="display: none;">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-title" id="resultTitle"></div>
            <div class="result-info" id="resultInfo"></div>
            <div id="actionButtons"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const orderNo = '{$order_no}';

        // 查询订单状态
        function checkOrderStatus() {
            fetch(`/api/tenant_purchase/order_status?order_no=${orderNo}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('result').style.display = 'block';

                    if (data.code === 1) {
                        const order = data.data;
                        const status = order.status;

                        if (status === 1) {
                            // 支付成功
                            document.getElementById('resultIcon').innerHTML = '✅';
                            document.getElementById('resultTitle').innerHTML = '支付成功！';
                            document.getElementById('resultTitle').style.color = '#28a745';

                            let infoHtml = `
                                <p><strong>订单号：</strong>${order.order_no}</p>
                                <p><strong>支付金额：</strong>¥${order.amount}</p>
                            `;

                            if (order.tenant) {
                                infoHtml += `
                                    <hr>
                                    <p class="mb-2"><strong>您的租户已开通：</strong></p>
                                    <p><strong>企业名称：</strong>${order.tenant.company_name}</p>
                                    <p><strong>登录账号：</strong>${order.tenant.login_account}</p>
                                `;
                            }

                            document.getElementById('resultInfo').innerHTML = infoHtml;
                            document.getElementById('actionButtons').innerHTML = `
                                <a href="/admin/login" class="btn btn-primary btn-lg">立即登录</a>
                            `;
                        } else if (status === 0) {
                            // 待支付
                            document.getElementById('resultIcon').innerHTML = '⏳';
                            document.getElementById('resultTitle').innerHTML = '等待支付...';
                            document.getElementById('resultTitle').style.color = '#ffc107';
                            document.getElementById('resultInfo').innerHTML = `
                                <p>订单正在支付中，请稍后...</p>
                            `;
                            document.getElementById('actionButtons').innerHTML = `
                                <button onclick="location.reload()" class="btn btn-primary">刷新状态</button>
                            `;
                        } else {
                            // 其他状态
                            document.getElementById('resultIcon').innerHTML = '❌';
                            document.getElementById('resultTitle').innerHTML = '支付失败';
                            document.getElementById('resultTitle').style.color = '#dc3545';
                            document.getElementById('resultInfo').innerHTML = `
                                <p><strong>订单号：</strong>${order.order_no}</p>
                                <p><strong>状态：</strong>${order.status_text}</p>
                            `;
                        }
                    } else {
                        // 查询失败
                        document.getElementById('resultIcon').innerHTML = '❌';
                        document.getElementById('resultTitle').innerHTML = '查询失败';
                        document.getElementById('resultTitle').style.color = '#dc3545';
                    }
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('resultIcon').innerHTML = '❌';
                    document.getElementById('resultTitle').innerHTML = '查询失败';
                    document.getElementById('resultTitle').style.color = '#dc3545';
                });
        }

        // 立即查询一次
        checkOrderStatus();

        // 如果是待支付状态，每3秒轮询一次
        setTimeout(() => {
            const title = document.getElementById('resultTitle');
            if (title && title.textContent.includes('等待支付')) {
                setInterval(checkOrderStatus, 3000);
            }
        }, 3000);
    </script>
</body>
</html>
