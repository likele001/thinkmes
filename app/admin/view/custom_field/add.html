{include file='common/meta' /}
<form id="form-add" class="form-horizontal" role="form" data-url="custom_field/add" data-back="custom_field">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">字段名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="" data-rule="required;alphaNum" placeholder="字段英文名（如：customer_name）">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">字段标题<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[title]" value="" data-rule="required" placeholder="字段显示名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">所属分组<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[group_id]" data-rule="required">
                <option value="">请选择分组</option>
                {volist name="groupList" id="group"}
                <option value="{$group.id}">{$group.name}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">字段类型<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[type]" data-rule="required" id="fieldType">
                <option value="text">单行文本</option>
                <option value="number">数字</option>
                <option value="textarea">多行文本</option>
                <option value="select">下拉选择</option>
                <option value="radio">单选框</option>
                <option value="checkbox">多选框</option>
                <option value="date">日期</option>
                <option value="datetime">日期时间</option>
                <option value="switch">开关</option>
                <option value="image">图片</option>
                <option value="file">文件</option>
                <option value="editor">富文本</option>
            </select>
        </div>
    </div>
    <div class="form-group" id="optionsGroup" style="display:none;">
        <label class="control-label col-xs-12 col-sm-2">选项配置</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[options]" rows="4" placeholder="每行一个选项，格式：选项值|选项文本（如：1|男）"></textarea>
            <span class="help-block">仅对select、radio、checkbox类型有效</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">默认值</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[default_value]" value="" placeholder="默认值">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">验证规则</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[validation_rules]" value="" placeholder="如：required|email|max:100">
            <span class="help-block">多个规则用|分隔，如：required|min:5|max:100</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">列表显示</label>
        <div class="col-xs-12 col-sm-8">
            <div class="checkbox">
                <label><input type="checkbox" name="row[is_list]" value="1"> 在列表中显示</label>
                <label><input type="checkbox" name="row[is_search]" value="1"> 支持搜索</label>
                <label><input type="checkbox" name="row[is_sort]" value="1"> 支持排序</label>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">列宽度</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="row[width]" value="" placeholder="如：150（留空自动）">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="row[sort]" value="0" placeholder="数值越小越靠前">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">必填</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label><input type="radio" name="row[required]" value="1"> 是</label>
                <label><input type="radio" name="row[required]" value="0" checked> 否</label>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]">
                <option value="1">启用</option>
                <option value="0">禁用</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[remark]" rows="2" placeholder="字段说明"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
<script>
$(function() {
    $('#fieldType').on('change', function() {
        var type = $(this).val();
        if (['select', 'radio', 'checkbox'].includes(type)) {
            $('#optionsGroup').show();
        } else {
            $('#optionsGroup').hide();
        }
    });
});
</script>
{include file='common/script-iframe' /}
