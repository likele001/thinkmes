{include file='common/meta' /}
<form id="form-edit-group" class="form-horizontal" role="form" data-url="custom_field/editGroup" data-back="custom_field/groups">
    <input type="hidden" name="row[id]" value="{$row.id}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">分组名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="{$row.name}" data-rule="required" placeholder="分组名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联表<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[table_name]" value="{$row.table_name}" data-rule="required" placeholder="如：fa_user">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="row[sort]" value="{$row.sort}" placeholder="数值越小越靠前">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]">
                <option value="1" {$row.status ? 'selected' : ''}>启用</option>
                <option value="0" {$row.status ? '' : 'selected'}>禁用</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[remark]" rows="2" placeholder="分组说明">{$row.remark}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
            <button type="button" class="btn btn-default btn-embossed btn-back">返回</button>
        </div>
    </div>
</form>
<script>
$(function() {
    $('.btn-back').on('click', function() {
        location.href = Config.moduleurl + '/custom_field/groups';
    });
});
</script>
{include file='common/script-iframe' /}
