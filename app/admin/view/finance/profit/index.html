<div class="card">
    <div class="card-header"><h3 class="card-title"><i class="fas fa-chart-line"></i> 利润统计</h3></div>
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-auto"><label>开始</label><input type="date" id="start_date" class="form-control" value="{:date('Y-m-01')}"></div>
            <div class="col-auto"><label>结束</label><input type="date" id="end_date" class="form-control" value="{:date('Y-m-d')}"></div>
            <div class="col-auto d-flex align-items-end"><button type="button" id="btn-query" class="btn btn-primary">查询</button></div>
        </div>
        <div class="row mb-3">
            <div class="col-md-4"><div class="small-box bg-info"><div class="inner"><h3 id="total_amount">0</h3><p>收入合计</p></div></div></div>
            <div class="col-md-4"><div class="small-box bg-warning"><div class="inner"><h3 id="total_cost">0</h3><p>成本合计</p></div></div></div>
            <div class="col-md-4"><div class="small-box bg-success"><div class="inner"><h3 id="total_profit">0</h3><p>利润合计</p></div></div></div>
        </div>
        <table id="profit-table" class="table table-bordered"><thead><tr><th>订单ID</th><th>金额</th><th>成本</th></tr></thead><tbody></tbody></table>
    </div>
</div>
<script>
(function() {
    if (typeof jQuery === 'undefined') { setTimeout(arguments.callee, 50); return; }
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    function load() {
        $.get(base + '/finance/profit/index', { start_date: $('#start_date').val(), end_date: $('#end_date').val() }, function(r) {
            if (r.code != 1 || !r.data) return;
            $('#total_amount').text(r.data.total_amount || 0);
            $('#total_cost').text(r.data.total_cost || 0);
            $('#total_profit').text(r.data.total_profit || 0);
            var list = r.data.list || [], html = '';
            list.forEach(function(row) {
                html += '<tr><td>' + (row.id || '') + '</td><td>' + (row.total_amount || row.amount || 0) + '</td><td>' + (row.cost_amount || 0) + '</td></tr>';
            });
            $('#profit-table tbody').html(html || '<tr><td colspan="3" class="text-center">暂无数据</td></tr>');
        }, 'json');
    }
    $('#btn-query').on('click', load);
    load();
})();
</script>
