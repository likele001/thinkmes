<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">付款登记</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="finance/pay/add" data-back="finance/pay">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">应付单</label>
                <div class="col-sm-6">
                    <select name="payable_id" class="form-control" required>
                        <option value="">请选择未结清应付单</option>
                        {volist name="payableList" id="p"}
                        <option value="{$p.id}">#{$p.id} {$p.title} - 应付{$p.amount} 已付{$p.paid}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">付款金额</label>
                <div class="col-sm-6"><input type="number" name="amount" class="form-control" step="0.01" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">付款时间</label>
                <div class="col-sm-6"><input type="datetime-local" name="pay_time" class="form-control" value="{:date('Y-m-d\TH:i')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">备注</label>
                <div class="col-sm-6"><textarea name="remark" class="form-control" rows="2"></textarea></div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定登记</button>
        <a href="{$config.moduleurl}/finance/pay/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
