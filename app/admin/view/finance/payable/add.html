<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加应付</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">摘要</label>
                <div class="col-sm-6"><input type="text" name="row[title]" class="form-control" required placeholder="摘要"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">供应商</label>
                <div class="col-sm-6">
                    <select name="row[supplier_id]" class="form-control">
                        <option value="">请选择</option>
                        {volist name="supplierList" id="s"}
                        <option value="{$s.id}">{$s.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">应付金额</label>
                <div class="col-sm-6"><input type="number" name="row[amount]" class="form-control" step="0.01" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">已付金额</label>
                <div class="col-sm-6"><input type="number" name="row[paid]" class="form-control" step="0.01" value="0"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">到期日</label>
                <div class="col-sm-6"><input type="date" name="row[due_date]" class="form-control"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">备注</label>
                <div class="col-sm-6"><textarea name="row[remark]" class="form-control" rows="2"></textarea></div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/finance/payable/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
<script>
(function() {
    if (typeof jQuery === 'undefined') { setTimeout(arguments.callee, 50); return; }
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    $('#form-add').on('submit', function(e) {
        e.preventDefault();
        $.post(base + '/finance/payable/add', $(this).serialize(), function(r) {
            if (r.code == 1) { alert(r.msg || '添加成功'); location.href = base + '/finance/payable/index'; }
            else alert(r.msg || '添加失败');
        }, 'json');
    });
})();
</script>
