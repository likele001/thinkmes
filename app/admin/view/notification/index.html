<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>消息通知</em> 支持查看、标记已读与删除</div>
    </div>
    <div class="card-body">
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary" id="btn-refresh"><i class="fas fa-sync"></i> 刷新</a>
            <a href="javascript:;" class="btn btn-success" id="btn-read"><i class="fas fa-check"></i> 标记已读</a>
            <a href="javascript:;" class="btn btn-danger" id="btn-del"><i class="fas fa-trash"></i> 删除</a>
            <a href="javascript:;" class="btn btn-info" id="btn-test"><i class="fas fa-paper-plane"></i> 发送测试</a>
            <select id="filter-read" class="form-control d-inline-block" style="width:120px;vertical-align:middle;">
                <option value="">全部</option>
                <option value="0">未读</option>
                <option value="1">已读</option>
            </select>
            <select id="filter-level" class="form-control d-inline-block" style="width:120px;vertical-align:middle;">
                <option value="">全部级别</option>
                <option value="info">info</option>
                <option value="warning">warning</option>
                <option value="error">error</option>
            </select>
            <input type="text" id="filter-kw" class="form-control d-inline-block" placeholder="搜索标题/内容" style="width:200px;vertical-align:middle;">
            <a href="javascript:;" class="btn btn-default" id="btn-search"><i class="fas fa-search"></i> 搜索</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
