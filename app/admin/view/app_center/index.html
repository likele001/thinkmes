<section class="content">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">应用中心 <span id="app-count" class="text-muted small font-weight-normal ml-2"></span></h3>
            <div class="card-tools">
                <span class="text-muted small mr-2">在此安装或卸载内置应用，安装后左侧将显示对应菜单。</span>
                <button type="button" class="btn btn-sm btn-primary" id="btn-pack-base">
                    <i class="fas fa-box mr-1"></i>打包基础框架
                </button>
                <button type="button" class="btn btn-sm btn-success" id="btn-upload">
                    <i class="fas fa-upload mr-1"></i>上传应用包
                </button>
                <input type="file" id="input-upload" accept=".zip" style="display:none;">
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive app-center-table-wrap" style="min-height:280px;max-height:75vh;overflow-y:auto;">
                <table id="table-app" class="table table-striped table-bordered mb-0"></table>
            </div>
        </div>
    </div>
</section>
<script>
$(function(){
    if (typeof jQuery === 'undefined' || typeof jQuery.fn.bootstrapTable !== 'function') {
        console.error('bootstrapTable 未加载，请刷新页面');
        return;
    }
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    var indexUrl = base + '/app_center/index';
    var installUrl = base + '/app_center/install';
    var uninstallUrl = base + '/app_center/uninstall';
    var uploadUrl = base + '/app_center/upload';
    var packUrl = base + '/app_center/pack';
    function postAction(url, data, onSuccess) {
        var payload = typeof data === 'string' ? { app: data } : (data || {});
        $.post(url, payload, function(ret){
            var ok = ret && ret.code === 1;
            alert((ret && ret.msg) || (ok ? '操作成功' : '操作失败'));
            if (ok && typeof onSuccess === 'function') onSuccess();
        }, 'json').fail(function(){ alert('请求失败'); });
    }

    function doPack(appKey, title) {
        if (!appKey) return;
        var v = prompt('请输入版本号（如 1.0 / 1.0.1 / 20260409）', '1.0');
        if (v === null) return;
        v = $.trim(v);
        if (!v) { alert('版本号不能为空'); return; }
        var tip = '确定打包「' + (title || appKey) + '」版本 ' + v + ' 吗？\n\n打包完成后会生成 zip，可用于安装或发布。';
        if (!confirm(tip)) return;
        $.post(packUrl, { app: appKey, version: v }, function(ret){
            var ok = ret && ret.code === 1;
            if (!ok) {
                alert((ret && ret.msg) || '打包失败');
                return;
            }
            var d = ret.data || {};
            var msg = '打包完成：' + (d.name || '') + (d.log ? ('\n\n' + d.log) : '');
            if (d.download_url) {
                if (confirm(msg + '\n\n是否立即下载？')) {
                    window.open(d.download_url, '_blank');
                } else {
                    alert(msg + '\n\n下载地址：' + d.download_url);
                }
            } else {
                alert(msg);
            }
        }, 'json').fail(function(){
            alert('请求失败');
        });
    }
    var $table = $('#table-app');
    if ($table.length) {
        $table.bootstrapTable({
            url: indexUrl,
            method: 'get',
            pagination: false,
            sidePagination: 'client',
            dataField: 'list',
            responseHandler: function(res) {
                var data = (res && res.data) ? res.data : { total: 0, list: [] };
                var total = (data.list && data.list.length) ? data.list.length : (data.total || 0);
                $('#app-count').text('共 ' + total + ' 个应用');
                return data;
            },
            columns: [
                { field: 'title', title: '应用名称' },
                { field: 'description', title: '说明' },
                {
                    field: 'available',
                    title: '可用',
                    formatter: function(v) {
                        return v ? '<span class="badge badge-success">是</span>' : '<span class="badge badge-secondary">需完整版</span>';
                    }
                },
                {
                    field: 'installed',
                    title: '状态',
                    formatter: function(v, row) {
                        if (row.available && v) return '<span class="badge badge-primary">已安装</span>';
                        if (!row.available && v) return '<span class="badge badge-secondary">数据库残留</span>';
                        return '<span class="badge badge-light">未安装</span>';
                    }
                },
                {
                    field: 'operate',
                    title: '操作',
                    formatter: function(v, row) {
                        var html = [];
                        if (!row.available) {
                            return row.installed
                                ? '<span class="text-muted small">上传应用包后可激活</span>'
                                : '<span class="text-muted">—</span>';
                        }
                        html.push('<button type="button" class="btn btn-xs btn-info btn-app-pack" data-app="' + row.key + '" data-title="' + row.title + '">打包</button>');
                        if (row.installed) {
                            html.push('<button type="button" class="btn btn-xs btn-warning btn-app-uninstall" data-app="' + row.key + '">卸载</button>');
                        } else {
                            html.push('<button type="button" class="btn btn-xs btn-primary btn-app-install" data-app="' + row.key + '">安装</button>');
                        }
                        return html.join(' ');
                    },
                    events: {
                        'click .btn-app-pack': function(e, value, row) {
                            e.preventDefault();
                            doPack(row.key, row.title);
                        },
                        'click .btn-app-install': function(e, value, row) {
                            e.preventDefault();
                            if (!confirm('确定要安装「' + row.title + '」吗？将执行数据库迁移并添加菜单。')) return;
                            postAction(installUrl, { app: row.key }, function() { $table.bootstrapTable('refresh'); });
                        },
                        'click .btn-app-uninstall': function(e, value, row) {
                            e.preventDefault();
                            if (!confirm('确定卸载「' + row.title + '」吗？')) return;
                            var delTables = confirm('是否同时删除该应用的数据表？\n\n删除后数据无法恢复。\n\n【确定】= 卸载并删除数据表\n【取消】= 仅移除菜单，保留数据');
                            postAction(uninstallUrl, { app: row.key, delete_tables: delTables ? 1 : 0 }, function() { $table.bootstrapTable('refresh'); });
                        }
                    }
                }
            ]
        });
    }
    $('#btn-pack-base').on('click', function(){
        doPack('base', '基础框架');
    });
    $('#btn-upload').on('click', function(){ $('#input-upload').click(); });
    $('#input-upload').on('change', function(){
        var file = this.files && this.files[0];
        if (!file) return;
        if (!/\.zip$/i.test(file.name)) { alert('请选择 .zip 格式的应用包'); return; }
        if (!confirm('确定上传并安装「' + file.name + '」吗？将解压合并到项目并执行数据库安装。')) { this.value = ''; return; }
        var fd = new FormData();
        fd.append('file', file);
        $.ajax({
            url: uploadUrl,
            type: 'POST',
            data: fd,
            processData: false,
            contentType: false,
            success: function(ret){
                var ok = ret && ret.code === 1;
                alert((ret && ret.msg) || (ok ? '安装成功' : '安装失败'));
                if (ok && $('#table-app').length) $('#table-app').bootstrapTable('refresh');
            },
            error: function(){ alert('请求失败'); }
        }).always(function(){ $('#input-upload').val(''); });
    });
});
</script>
