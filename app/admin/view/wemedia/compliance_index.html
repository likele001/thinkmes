<div class="card panel-intro">
  <div class="card-header"><div class="panel-lead"><em>合规记录</em> 查看全部用户合规检测记录（框架级，与租户无关）</div></div>
  <div class="card-body">
    <div id="toolbar" class="toolbar mb-2">
      <a href="javascript:;" class="btn btn-primary btn-refresh"><i class="fas fa-sync-alt"></i> 刷新</a>
      <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled"><i class="fas fa-trash-alt"></i> 删除</a>
    </div>
    <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
  </div>
</div>
<script>
(function(){
  var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
  var $table = $('#table');
  if ($table.data('bootstrap.table')) return;
  $table.bootstrapTable({
    url: base + '/wemedia_compliance/index',
    method: 'get',
    sidePagination: 'server',
    pagination: true,
    pageSize: 20,
    sortName: 'id',
    sortOrder: 'desc',
    responseHandler: function(res){ var d = res.data || {}; return { total: d.total || 0, rows: d.list || [] }; },
    columns: [
      { checkbox: true },
      { field: 'id', title: 'ID', width: 70 },
      { field: 'tenant_id', title: '租户ID', width: 80 },
      { field: 'user_id', title: '用户ID', width: 80 },
      { field: 'content_text', title: '检测内容', align: 'left', formatter: function(v){ return v ? (v.length > 50 ? v.substring(0,50)+'...' : v) : '-'; }},
      { field: 'result_text', title: '结果', width: 80 },
      { field: 'suggestion', title: '建议', align: 'left', formatter: function(v){ return v ? (v.length > 40 ? v.substring(0,40)+'...' : v) : '-'; }},
      { field: 'create_time', title: '检测时间', width: 160, formatter: function(v){ return v ? new Date(v*1000).toLocaleString() : '-'; }},
      { field: 'operate', title: '操作', width: 80, formatter: function(v, row){
        return '<a href="javascript:;" class="btn btn-xs btn-danger btn-del-one" data-id="'+row.id+'">删除</a>';
      }}
    ]
  });
  $('#toolbar .btn-refresh').on('click', function(){ $table.bootstrapTable('refresh'); });
  $(document).on('click', '.btn-del-one', function(){
    if (!confirm('确定删除？')) return;
    $.post(base + '/wemedia_compliance/del', { ids: $(this).data('id') }, function(r){
      if (r.code == 1) { $table.bootstrapTable('refresh'); alert(r.msg || '删除成功'); } else alert(r.msg || '删除失败');
    }, 'json');
  });
  $('#toolbar .btn-del').on('click', function(){
    var rows = $table.bootstrapTable('getSelections');
    if (rows.length === 0) { alert('请选择记录'); return; }
    if (!confirm('确定删除选中的 ' + rows.length + ' 条？')) return;
    $.post(base + '/wemedia_compliance/del', { ids: rows.map(function(r){ return r.id; }) }, function(r){
      if (r.code == 1) { $table.bootstrapTable('refresh'); alert(r.msg || '删除成功'); } else alert(r.msg || '删除失败');
    }, 'json');
  });
  $table.on('check.bs.table uncheck.bs.table check-all.bs.table uncheck-all.bs.table', function(){
    $('#toolbar .btn-del').toggleClass('disabled btn-disabled', $table.bootstrapTable('getSelections').length === 0);
  });
})();
</script>
