<div class="panel panel-default knowledge">
    <div class="panel-heading">
        <div class="row">
            <div class="col-md-6">
                <h4>知识库管理</h4>
            </div>
            <div class="col-md-6 text-right">
                <div class="btn-group">
                    <a href="{:url('CustomerService/articleEdit')}" class="btn btn-success">
                        <i class="fa fa-plus"></i> 添加文章
                    </a>
                    <a href="{:url('CustomerService/categories')}" class="btn btn-primary">
                        <i class="fa fa-folder"></i> 分类管理
                    </a>
                    <button type="button" class="btn btn-primary btn-refresh">
                        <i class="fa fa-refresh"></i> 刷新
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="panel-body">
        <div class="navbar navbar-default">
            <form id="search-form" class="form-inline" role="form">
                <div class="form-group">
                    <select name="category_id" id="search-category_id" class="form-control">
                        <option value="0">全部分类</option>
                    </select>
                </div>
                <div class="form-group">
                    <select name="status" id="search-status" class="form-control">
                        <option value="">全部状态</option>
                        <option value="0">草稿</option>
                        <option value="1">已发布</option>
                        <option value="2">已下线</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" name="keyword" id="search-keyword" class="form-control" placeholder="搜索标题或内容">
                </div>
                <button type="submit" class="btn btn-success">
                    <i class="fa fa-search"></i> 搜索
                </button>
                <button type="button" class="btn btn-default btn-reset">
                    <i class="fa fa-reset"></i> 重置
                </button>
            </form>
        </div>

        <table id="table" class="table table-striped table-bordered table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>标题</th>
                    <th>分类</th>
                    <th>状态</th>
                    <th>浏览</th>
                    <th>点赞</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
