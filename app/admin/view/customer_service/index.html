<script>
$(function() {
    // 加载统计数据
    $.ajax({
        url: '{:url("CustomerService/index")}',
        type: 'GET',
        dataType: 'json',
        success: function(res) {
            if (res.code === 1) {
                var stats = res.data;
                $('.stat-today-sessions').text(stats.today_sessions || 0);
                $('.stat-today-tickets').text(stats.today_tickets || 0);
                $('.stat-pending-tickets').text(stats.pending_tickets || 0);
                $('.stat-today-ai').text(stats.today_ai_chats || 0);
            }
        }
    });
});
</script>

    </div>
    <div class="panel-body">
        <div class="row">
            <div class="col-md-3">
                <div class="panel panel-default">
                    <div class="panel-body text-center">
                        <h2 class="no-margin stat-today-sessions">-</h2>
                        <p class="text-muted">今日会话</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="panel panel-default">

                        <h2 class="no-margin stat-today-tickets">-</h2>

                    </div>

            </div>

                </div>
            </div>
            <div class="col-md-3">
