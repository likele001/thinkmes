<script>
$(function() {
    var table = $('#table');
    
    table.bootstrapTable({
        url: '{:url("CustomerService/getTicketList")}',
        responseHandler: function(res) {
            return {
                total: res.data.total || 0,
                rows: res.data.list || []
            };
        },
        columns: [
            {field: 'ticket_no', title: '工单编号', width: 150},
            {field: 'title', title: '标题'},
            {field: 'category', title: '分类', width: 100},
            {
                field: 'priority',
                title: '优先级',
                width: 80,
                formatter: function(value) {
                    var map = {1: '低', 2: '中', 3: '高', 4: '紧急'};
                    var color = {1: 'success', 2: 'info', 3: 'warning', 4: 'danger'};
                    return '<span class="badge bg-' + color[value] + '">' + map[value] + '</span>';
                }
            },
            {
                field: 'status',
                title: '状态',
                width: 100,
                formatter: function(value) {
                    var map = {0: '待处理', 1: '处理中', 2: '等待回复', 3: '已解决', 4: '已关闭'};
                    var color = {0: 'warning', 1: 'info', 2: 'primary', 3: 'success', 4: 'secondary'};
                    return '<span class="badge bg-' + color[value] + '">' + map[value] + '</span>';
                }
            },
            {
                field: 'create_time',
                title: '创建时间',
                width: 180,
                formatter: function(value) {
                    return value > 0 ? new Date(value * 1000).toLocaleString('zh-CN') : '-';
                }
            },
            {
                field: 'operate',
                title: '操作',
                width: 120,
                formatter: function(value, row) {
                    return '<a href="{:url("CustomerService/ticketDetail")}?ticket_no=' + row.ticket_no + '" class="btn btn-xs btn-primary">查看</a>';
                }
            }
        ]
    });

    // 搜索和重置
    $('#search-form').on('submit', function(e) {
        e.preventDefault();
        table.bootstrapTable('refresh', {
            query: $(this).serializeObject()
        });
    });

    $('.btn-reset').on('click', function() {
        $('#search-form')[0].reset();
        table.bootstrapTable('refresh');
    });

    // 刷新
    $('.btn-refresh').on('click', function() {
        table.bootstrapTable('refresh');
    });
});
</script>

<div class="panel panel-default tickets">
    <div class="panel-heading">
        <div class="row">
            <div class="col-md-6">
                <h4>工单管理</h4>
            </div>
            <div class="col-md-6 text-right">
                <button type="button" class="btn btn-primary btn-refresh">
                    <i class="fa fa-refresh"></i> 刷新
                </button>
            </div>
        </div>
    </div>
    <div class="panel-body">
        <div class="navbar navbar-default">
            <form id="search-form" class="form-inline" role="form">
                <div class="form-group">
                    <select name="status" class="form-control">
                        <option value="">全部状态</option>
                        <option value="0">待处理</option>
                        <option value="1">处理中</option>
                        <option value="2">等待回复</option>
                        <option value="3">已解决</option>
                        <option value="4">已关闭</option>
                    </select>
                </div>
                <div class="form-group">
                    <select name="category" class="form-control">
                        <option value="">全部分类</option>
                        <option value="技术问题">技术问题</option>
                        <option value="功能咨询">功能咨询</option>
                        <option value="账号问题">账号问题</option>
                        <option value="支付问题">支付问题</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" name="keyword" class="form-control" placeholder="搜索工单编号或标题">
                </div>
                <button type="submit" class="btn btn-success">
                    <i class="fa fa-search"></i> 搜索
                </button>
                <button type="button" class="btn btn-default btn-reset">
                    <i class="fa fa-reset"></i> 重置
                </button>
            </form>
        </div>

        <table id="table" class="table table-striped table-bordered table-hover"></table>
    </div>
</div>
