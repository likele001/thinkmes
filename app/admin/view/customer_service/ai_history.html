<div class="panel panel-default ai_history">
    <div class="panel-heading">
        <div class="row">
            <div class="col-md-6">
                <h4>AI对话历史</h4>
            </div>
            <div class="col-md-6 text-right">
                <button type="button" class="btn btn-primary btn-refresh">
                    <i class="fa fa-refresh"></i> 刷新
                </button>
            </div>
        </div>
    </div>
    <div class="panel-body">
        <div class="navbar navbar-default">
            <form id="search-form" class="form-inline" role="form">
                <div class="form-group">
                    <input type="text" name="keyword" id="search-keyword" class="form-control" placeholder="搜索对话内容">
                </div>
                <button type="submit" class="btn btn-success">
                    <i class="fa fa-search"></i> 搜索
                </button>
                <button type="button" class="btn btn-default btn-reset">
                    <i class="fa fa-reset"></i> 重置
                </button>
            </form>
        </div>

        <table id="table" class="table table-striped table-bordered table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>会话ID</th>
                    <th>租户ID</th>
                    <th>用户ID</th>
                    <th>用户问题</th>
                    <th>AI回复</th>
                    <th>模型</th>
                    <th>Token数</th>
                    <th>创建时间</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
