<div class="panel panel-default sessions">
    <div class="panel-heading">
        <div class="row">
            <div class="col-md-6">
                <h4>会话管理</h4>
            </div>
            <div class="col-md-6 text-right">
                <button type="button" class="btn btn-primary btn-refresh">
                    <i class="fa fa-refresh"></i> 刷新
                </button>
            </div>
        </div>
    </div>
    <div class="panel-body">
        <div class="navbar navbar-default">
            <form id="search-form" class="form-inline" role="form">
                <div class="form-group">
                    <select name="status" id="search-status" class="form-control">
                        <option value="">全部状态</option>
                        <option value="0">待接待</option>
                        <option value="1">进行中</option>
                        <option value="2">已关闭</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" name="keyword" id="search-keyword" class="form-control" placeholder="搜索访客信息">
                </div>
                <button type="submit" class="btn btn-success">
                    <i class="fa fa-search"></i> 搜索
                </button>
                <button type="button" class="btn btn-default btn-reset">
                    <i class="fa fa-reset"></i> 重置
                </button>
            </form>
        </div>

        <table id="table" class="table table-striped table-bordered table-hover">
            <thead>
                <tr>
                    <th>会话ID</th>
                    <th>访客名称</th>
                    <th>访客邮箱</th>
                    <th>状态</th>
                    <th>消息数</th>
                    <th>开始时间</th>
                    <th>最后消息时间</th>
                    <th>操作</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
