<div class="card panel-intro">
    <div class="card-header"><div class="panel-lead"><em>打印模板</em> 配置后，在销售订单/发货单等列表点「打印」即可按模板输出</div></div>
    <div class="card-body">
        <div class="alert alert-info mb-3">
            <strong>使用说明：</strong>① 添加模板并选择类型（销售订单、发货单、合同等）；② 在 HTML 内容中使用变量，如 <code>{order_no}</code>、<code>{customer_name}</code>、<code>{total_amount}</code>、<code>{create_time}</code>（销售订单），<code>{shipment_no}</code>、<code>{order_no}</code>（发货单）；③ 在对应业务列表每行的「打印」按钮即可按模板预览并打印。
        </div>
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary btn-refresh"><i class="fas fa-sync-alt"></i> 刷新</a>
            <a href="{$config.moduleurl}/print_template/add" class="btn btn-success"><i class="fas fa-plus"></i> 添加</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled"><i class="fas fa-edit"></i> 编辑</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled"><i class="fas fa-trash-alt"></i> 删除</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
<script>
(function init() {
    if (typeof window.jQuery === 'undefined' || !window.jQuery.fn.bootstrapTable) { setTimeout(init, 50); return; }
    var $ = window.jQuery, base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '', $table = $('#table');
    if ($table.data('bootstrap.table')) return;
    $table.bootstrapTable({
        url: base + '/print_template/index', pk: 'id', sortName: 'id', sortOrder: 'desc',
        pagination: true, sidePagination: 'server', pageSize: 20, pageList: [10, 20, 50],
        responseHandler: function (res) { var d = res.data || {}; return { total: d.total || 0, rows: d.list || [] }; },
        columns: [
            {field: 'id', title: 'ID', width: 70},
            {field: 'name', title: '模板名称', align: 'left'},
            {field: 'type_text', title: '类型', width: 100},
            {field: 'content', title: '内容预览', align: 'left', formatter: function(v) {
                return v ? (v.length > 50 ? v.substring(0, 50) + '...' : v) : '-';
            }},
            {field: 'operate', title: '操作', width: 120, formatter: function(v, row) {
                return '<a href="' + base + '/print_template/edit?id=' + row.id + '" class="btn btn-xs btn-success">编辑</a> <a href="javascript:;" class="btn btn-xs btn-danger btn-del-one">删除</a>';
            }, events: {
                'click .btn-del-one': function(e, v, row) {
                    if (confirm('确定删除？')) $.post(base + '/print_template/del', {ids: row.id}, function(r) {
                        if (r.code == 1) { $table.bootstrapTable('refresh'); alert(r.msg || '删除成功'); } else alert(r.msg || '删除失败');
                    }, 'json');
                }
            }}
        ]
    });
    $('#toolbar .btn-refresh').on('click', function() { $table.bootstrapTable('refresh'); });
    $('#toolbar .btn-edit').on('click', function() {
        var rows = $table.bootstrapTable('getSelections');
        if (rows.length !== 1) { alert('请选择一条记录'); return; }
        location.href = base + '/print_template/edit?id=' + rows[0].id;
    });
    $('#toolbar .btn-del').on('click', function() {
        var rows = $table.bootstrapTable('getSelections');
        if (rows.length === 0) { alert('请选择记录'); return; }
        if (!confirm('确定删除选中的 ' + rows.length + ' 条？')) return;
        $.post(base + '/print_template/del', {ids: rows.map(function(r){return r.id;})}, function(r) {
            if (r.code == 1) { $table.bootstrapTable('refresh'); alert(r.msg || '删除成功'); } else alert(r.msg || '删除失败');
        }, 'json');
    });
})();
</script>
