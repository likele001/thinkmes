<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>插件详情</em> 查看插件详细信息</div>
    </div>
    <div class="card-body">
        <div class="mb-3">
            <a href="javascript:;" class="btn btn-default btn-back"><i class="fas fa-arrow-left"></i> 返回市场</a>
        </div>
        
        <div class="panel panel-default">
            <div class="panel-body">
                <div class="row">
                    <div class="col-md-8">
                        <h3 id="plugin-name">插件名称</h3>
                        <p id="plugin-description" class="text-muted">插件描述</p>
                        
                        <div class="plugin-info mt-3">
                            <dl class="dl-horizontal">
                                <dt>作者：</dt>
                                <dd id="plugin-author">作者名称</dd>
                                
                                <dt>分类：</dt>
                                <dd id="plugin-category">分类</dd>
                                
                                <dt>版本：</dt>
                                <dd id="plugin-version">1.0.0</dd>
                                
                                <dt>下载量：</dt>
                                <dd id="plugin-downloads">0</dd>
                                
                                <dt>评分：</dt>
                                <dd id="plugin-rating">0.0</dd>
                                
                                <dt>更新时间：</dt>
                                <dd id="plugin-updated_at">2024-01-01</dd>
                            </dl>
                        </div>
                        
                        <div class="mt-3">
                            <h4>版本历史</h4>
                            <div id="version-list"></div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="panel panel-info">
                            <div class="panel-heading">操作</div>
                            <div class="panel-body text-center">
                                <button type="button" class="btn btn-lg btn-primary btn-install" id="btn-install">安装插件</button>
                                <button type="button" class="btn btn-lg btn-danger btn-uninstall" id="btn-uninstall" style="display:none;">卸载插件</button>
                                <button type="button" class="btn btn-lg btn-warning btn-update" id="btn-update" style="display:none;">更新插件</button>
                            </div>
                        </div>
                        
                        <div class="panel panel-default mt-3">
                            <div class="panel-heading">评分</div>
                            <div class="panel-body">
                                <div class="rating-stars" id="rating-stars">
                                    <i class="far fa-star" data-rating="1"></i>
                                    <i class="far fa-star" data-rating="2"></i>
                                    <i class="far fa-star" data-rating="3"></i>
                                    <i class="far fa-star" data-rating="4"></i>
                                    <i class="far fa-star" data-rating="5"></i>
                                </div>
                                <textarea class="form-control mt-2" id="review-content" rows="3" placeholder="写下您的评价..."></textarea>
                                <button type="button" class="btn btn-primary btn-submit-review mt-2">提交评价</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="panel panel-default mt-3">
            <div class="panel-heading">用户评价</div>
            <div class="panel-body" id="review-list"></div>
        </div>
    </div>
</div>
