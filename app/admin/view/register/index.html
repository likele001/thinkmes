<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租户注册 - MES系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; }
        .container { max-width: 700px; margin: 40px auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #fff; font-size: 32px; margin-bottom: 10px; }
        .header p { color: #ccc; font-size: 14px; }
        .form-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .form-title { font-size: 22px; color: #333; margin-bottom: 25px; font-weight: bold; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #555; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: #4CAF50; }
        .form-group select { background: white; }
        .form-group .help { font-size: 12px; color: #999; margin-top: 5px; }
        .package-list { margin-bottom: 15px; }
        .package-item { padding: 12px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s; position: relative; }
        .package-item:hover { background: #f9f9f9; }
        .package-item.active { border-color: #4CAF50; background: #f0f7ff; }
        .package-item h4 { margin: 0 0 8px; color: #333; font-size: 16px; }
        .package-item p { margin: 0; color: #666; font-size: 13px; }
        .package-item .price { position: absolute; top: 12px; right: 12px; color: #f44336; font-weight: bold; font-size: 18px; }
        .payment-option { padding: 12px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s; }
        .payment-option:hover { background: #f9f9f9; }
        .payment-option.active { border-color: #4CAF50; background: #f0f7ff; }
        .register-type { display: flex; gap: 15px; margin-bottom: 20px; }
        .type-option { flex: 1; padding: 15px; border: 2px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .type-option:hover { border-color: #4CAF50; }
        .type-option.active { border-color: #4CAF50; background: #f0f7ff; }
        .type-option h3 { font-size: 18px; margin-bottom: 5px; color: #333; }
        .type-option p { font-size: 12px; color: #666; }
        .type-option .highlight { color: #f44336; font-weight: bold; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .btn:hover { background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .hint { margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 4px; font-size: 13px; color: #333; }
        .hint strong { color: #4CAF50; }
        .error-msg { color: #f44336; font-size: 14px; margin-top: 10px; }
        .hidden { display: none; }
        .summary-box { background: #f9f9f9; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        .summary-box p { margin: 5px 0; color: #333; }
        .summary-box strong { color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MES制造执行系统</h1>
            <p>租户注册</p>
        </div>

        <div class="form-box">
            <form id="registerForm" method="post" action="">
                <input type="hidden" name="__token__" value="{:token()}">
                <input type="hidden" name="register_type" id="registerType" value="free">
                <input type="hidden" name="package_id" id="packageId" value="1" required>
                <input type="hidden" name="gateway_id" id="gatewayId" value="">

                <div class="form-title">注册方式</div>
                <div class="register-type">
                    <div class="type-option active" onclick="selectRegisterType('free', this)">
                        <h3>免费试用</h3>
                        <p>7天免费体验</p>
                        <p class="highlight">¥0</p>
                    </div>
                    <div class="type-option" onclick="selectRegisterType('paid', this)">
                        <h3>立即购买</h3>
                        <p>正式开通服务</p>
                        <p class="highlight" id="paidPrice">¥299</p>
                    </div>
                </div>

                <div class="form-title">选择套餐</div>
                <div class="package-list" id="packageList">
                    <p class="text-muted">加载中...</p>
                </div>

                <div id="paymentSection" class="hidden">
                    <div class="form-title">选择支付方式</div>
                    <div id="paymentMethods">
                        <p class="text-muted">请先选择套餐</p>
                    </div>
                </div>

                <div id="orderSummary" class="hidden">
                    <div class="summary-box">
                        <p><strong>订单摘要：</strong></p>
                        <p>套餐：<span id="summaryPackage">-</span></p>
                        <p>金额：<strong id="summaryAmount">-</strong></p>
                    </div>
                </div>

                <div class="form-title">基本信息</div>

                <div class="form-group">
                    <label>租户名称 *</label>
                    <input type="text" name="tenant_name" required placeholder="请输入租户名称（1-100字符）" maxlength="100">
                </div>

                <div class="form-group">
                    <label>登录账号 *</label>
                    <input type="text" name="username" required placeholder="请输入登录账号（3-30字符，字母数字下划线）" maxlength="30" pattern="[a-zA-Z0-9_]+">
                    <div class="help">用于登录后台系统</div>
                </div>

                <div class="form-group">
                    <label>登录密码 *</label>
                    <input type="password" name="password" required placeholder="请输入登录密码（6-30字符）" minlength="6" maxlength="30">
                    <div class="help">请妥善保管密码</div>
                </div>

                <div class="form-group">
                    <label>昵称 *</label>
                    <input type="text" name="nickname" required placeholder="请输入显示名称（1-50字符）" maxlength="50">
                    <div class="help">在系统中显示的名称</div>
                </div>

                <div class="form-group">
                    <label>联系邮箱 *</label>
                    <input type="email" name="email" required placeholder="请输入联系邮箱">
                </div>

                <div class="form-group">
                    <label>联系电话</label>
                    <input type="tel" name="mobile" placeholder="请输入联系电话（选填）">
                </div>

                <button type="submit" class="btn" id="submitBtn">立即注册</button>

                <div class="hint" id="registerHint">
                    <strong>免费试用说明：</strong><br>
                    1. 注册成功后系统将自动创建租户和管理员账号<br>
                    2. 免费试用期7天，到期后请联系客服续费<br>
                    3. 租户编码将自动生成，用于标识您的企业<br>
                    4. 请牢记您的登录账号和密码
                </div>
            </form>
        </div>
    </div>

    <script>
        let selectedPackage = null;
        let packages = [];

        // 加载套餐列表
        function loadPackages() {
            fetch('/api/tenant_purchase/package_list')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 1) {
                        packages = data.data;
                        const container = document.getElementById('packageList');
                        container.innerHTML = packages.map(pkg => `
                            <div class="package-item ${pkg.id === 1 ? 'active' : ''}" data-package-id="${pkg.id}" onclick="selectPackage(${pkg.id}, this)">
                                <h4>${pkg.name}</h4>
                                <p>有效期：${pkg.expire_days_text}</p>
                                <div class="price">¥${pkg.price_text}</div>
                            </div>
                        `).join('');

                        // 默认选择第一个套餐
                        if (packages.length > 0) {
                            selectPackage(packages[0].id, container.querySelector('.package-item'));
                        }
                    }
                });
        }

        // 选择套餐
        function selectPackage(id, element) {
            document.getElementById('packageId').value = id;
            document.querySelectorAll('.package-item').forEach(item => {
                item.classList.remove('active');
            });
            if (element) {
                element.classList.add('active');
            }

            selectedPackage = packages.find(p => p.id === id);
            if (selectedPackage) {
                document.getElementById('paidPrice').textContent = '¥' + selectedPackage.price_text;
                document.getElementById('summaryPackage').textContent = selectedPackage.name;
                document.getElementById('summaryAmount').textContent = '¥' + selectedPackage.price_text;

                // 如果是付费模式，加载支付方式
                if (document.getElementById('registerType').value === 'paid') {
                    loadPaymentMethods();
                }
            }
        }

        // 选择注册类型
        function selectRegisterType(type, element) {
            document.getElementById('registerType').value = type;
            document.querySelectorAll('.type-option').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');

            const paymentSection = document.getElementById('paymentSection');
            const orderSummary = document.getElementById('orderSummary');
            const submitBtn = document.getElementById('submitBtn');
            const hint = document.getElementById('registerHint');

            if (type === 'paid') {
                paymentSection.classList.remove('hidden');
                orderSummary.classList.remove('hidden');
                submitBtn.textContent = '提交并支付';
                hint.innerHTML = '<strong>付费购买说明：</strong><br>1. 提交后创建订单，请完成支付<br>2. 支付成功后系统将自动开通服务<br>3. 请牢记您的登录账号和密码';
                loadPaymentMethods();
            } else {
                paymentSection.classList.add('hidden');
                orderSummary.classList.add('hidden');
                submitBtn.textContent = '立即注册';
                hint.innerHTML = '<strong>免费试用说明：</strong><br>1. 注册成功后系统将自动创建租户和管理员账号<br>2. 免费试用期7天，到期后请联系客服续费<br>3. 租户编码将自动生成，用于标识您的企业<br>4. 请牢记您的登录账号和密码';
            }
        }

        // 加载支付方式
        function loadPaymentMethods() {
            fetch('/api/tenant_purchase/payment_methods')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('paymentMethods');
                    if (data.code === 1) {
                        if (data.data.length === 0) {
                            container.innerHTML = '<p class="error-msg">暂无可用的支付方式，请联系管理员配置</p>';
                            return;
                        }
                        container.innerHTML = data.data.map(gateway => `
                            <div class="payment-option" data-gateway-id="${gateway.id}" onclick="selectPaymentMethod(${gateway.id}, this)">
                                <strong>${gateway.name}</strong>
                            </div>
                        `).join('');

                        // 默认选择第一个支付方式
                        if (data.data.length > 0) {
                            selectPaymentMethod(data.data[0].id, container.querySelector('.payment-option'));
                        }
                    }
                });
        }

        // 选择支付方式
        function selectPaymentMethod(id, element) {
            document.getElementById('gatewayId').value = id;
            document.querySelectorAll('.payment-option').forEach(item => {
                item.classList.remove('active');
            });
            if (element) {
                element.classList.add('active');
            }
        }

        // 表单提交
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const registerType = document.getElementById('registerType').value;
            const formData = new FormData(this);

            if (registerType === 'paid') {
                // 付费模式：创建订单 -> 支付
                const gatewayId = document.getElementById('gatewayId').value;
                if (!gatewayId) {
                    alert('请选择支付方式');
                    return;
                }

                // 提交注册并创建订单
                fetch('/admin/register/save', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 1) {
                        // 创建租户成功，创建支付订单
                        const payData = new URLSearchParams();
                        payData.append('package_id', document.getElementById('packageId').value);
                        payData.append('company_name', formData.get('tenant_name'));
                        payData.append('contact_name', formData.get('nickname'));
                        payData.append('contact_phone', formData.get('mobile') || '');
                        payData.append('contact_email', formData.get('email'));
                        payData.append('domain', '');
                        payData.append('login_account', formData.get('username'));
                        payData.append('login_password', formData.get('password'));

                        return fetch('/api/tenant_purchase/create_order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: payData
                        });
                    } else {
                        alert(data.msg || '注册失败');
                        throw new Error(data.msg);
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 1) {
                        // 订单创建成功，发起支付
                        const payData2 = new URLSearchParams();
                        payData2.append('order_no', data.data.order_no);
                        payData2.append('gateway_id', document.getElementById('gatewayId').value);

                        return fetch('/api/tenant_purchase/pay', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: payData2
                        });
                    } else {
                        alert(data.msg || '创建订单失败');
                        throw new Error(data.msg);
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 1) {
                        if (data.data.pay_url) {
                            window.location.href = data.data.pay_url;
                        } else if (data.data.form_html) {
                            document.body.innerHTML = data.data.form_html;
                        } else {
                            alert('注册成功！请登录查看');
                            setTimeout(() => {
                                window.location.href = '/admin/index/login';
                            }, 1500);
                        }
                    } else {
                        alert(data.msg || '发起支付失败');
                    }
                })
                .catch(error => {
                    alert('提交失败：' + error.message);
                });
            } else {
                // 免费模式：直接注册
                fetch('/admin/register/save', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 1) {
                        alert(data.msg);
                        setTimeout(() => {
                            window.location.href = '/admin/index/login';
                        }, 1500);
                    } else {
                        alert(data.msg || '注册失败');
                    }
                })
                .catch(error => {
                    alert('提交失败：' + error);
                });
            }
        });

        // 页面加载时执行
        loadPackages();
    </script>
</body>
</html>
