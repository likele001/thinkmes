<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">{:__('add_title')}</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('username')}</label>
                <div class="col-sm-6"><input type="text" name="username" class="form-control" required placeholder="{:__('placeholder_username')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('password')}</label>
                <div class="col-sm-6"><input type="password" name="password" class="form-control" required placeholder="{:__('placeholder_password')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('nickname')}</label>
                <div class="col-sm-6"><input type="text" name="nickname" class="form-control" placeholder="{:__('optional_placeholder')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('mobile')}</label>
                <div class="col-sm-6"><input type="text" name="mobile" class="form-control" placeholder="{:__('optional_placeholder')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('email')}</label>
                <div class="col-sm-6"><input type="text" name="email" class="form-control" placeholder="{:__('optional_placeholder')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('status')}</label>
                <div class="col-sm-6">
                    <select name="status" class="form-control">
                        <option value="1">{:__('status_normal')}</option>
                        <option value="0">{:__('status_disabled')}</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-sm-6 offset-sm-2">
                    <button type="submit" class="btn btn-primary">{:__('submit')}</button>
                    <a href="{:url('member/index')}" class="btn btn-default ml-2">{:__('back')}</a>
                </div>
            </div>
        </form>
    </div>
</div>
<script>
$(function () {
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    $('#form-add').attr('action', base + '/member/add');
    $('#form-add').on('submit', function (e) {
        e.preventDefault();
        $.post($(this).attr('action'), $(this).serialize(), function (r) {
            alert(r.msg);
            if (r.code === 1) location.href = base + '/member/index';
        }, 'json');
    });
});
</script>
