<div class="card panel-intro">

        <div class="panel-lead"><em>API接口访问</em> 提供系统 API 文档入口与调用说明</div>
    </div>
    <div class="card-body">
        <div class="alert alert-info">
            <div>API 基地址：<code>{$api_base}</code></div>
