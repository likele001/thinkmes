<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {include file="common/meta" /}
    <script src="/assets/lib/jquery/jquery.min.js?v={:time()}"></script>
    <script>
    (function() {
        if (window.self === window.top) {
            try {
                var url = new URL(window.location.href);
                var changed = false;
                if (url.searchParams.has('iframe')) { url.searchParams.delete('iframe'); changed = true; }
                if (url.searchParams.has('addtabs')) { url.searchParams.delete('addtabs'); changed = true; }
                if (changed) {
                    window.location.replace(url.toString());
                    return;
                }
            } catch(e) {
                var h = window.location.href;
                if (h.indexOf('iframe=1') !== -1 || h.indexOf('addtabs=1') !== -1) {
                    h = h.replace(/[?&]iframe=1(&|$)/g, '$1').replace(/[?&]addtabs=1(&|$)/g, '$1').replace(/[?&]$/, '').replace(/\?&/, '?');
                    if (h.indexOf('iframe=1') === -1 && h.indexOf('addtabs=1') === -1) window.location.replace(h);
                    return;
                }
            }
        }
    })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; min-height: 100%; overflow: auto; background: #f5f5f5; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
        .content-header { margin-bottom: 15px; }
        .content { background: #fff; padding: 18px 20px; border-radius: 8px; min-height: 200px; overflow-x: auto; box-sizing: border-box; }
        .content .card-body, .content .table-responsive { overflow-x: auto; }
    </style>
</head>
<body class="iframe-body">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6"><h1>{$title|default=''}</h1></div>
                <div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item active">{$title|default=''}</li></ol></div>
            </div>
        </div>
    </section>
    <section class="content">
        <div class="container-fluid">
            {$__CONTENT__|default=''|raw}
        </div>
    </section>
    {include file="common/script-iframe" /}
</body>
</html>
