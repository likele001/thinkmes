<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {include file="common/meta" /}
    <script src="/assets/lib/jquery/jquery.min.js"></script>
    <script>
    (function() {
        if (window.self === window.top) {
            try {
                var url = new URL(window.location.href);
                if (url.searchParams.has('iframe')) { url.searchParams.delete('iframe'); window.location.replace(url.toString()); return; }
            } catch(e) {
                if (window.location.href.indexOf('iframe=1') !== -1) {
                    window.location.replace(window.location.href.replace(/[?&]iframe=1(&|$)/, '$1').replace(/[?&]$/, ''));
                    return;
                }
            }
        }
    })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; min-height: 100%; overflow: auto; background: #f2f2f2; color: #333; }
        .content-header { margin-bottom: 15px; }
        .content { background: #fff; padding: 15px; border-radius: 4px; min-height: 200px; overflow-x: auto; }
        .content .card-body, .content .table-responsive { overflow-x: auto; }
    </style>
</head>
<body class="iframe-body">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6"><h1>{$title|default=''}</h1></div>
                <div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item active">{$title|default=''}</li></ol></div>
            </div>
        </div>
    </section>
    <section class="content">
        <div class="container-fluid">
            {$__CONTENT__|default=''|raw}
        </div>
    </section>
    {include file="common/script-iframe" /}
</body>
</html>
