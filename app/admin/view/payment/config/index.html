<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>{$title|default='支付网关'}</em> 配置并管理该渠道下的支付网关</div>
    </div>
    <div class="card-body">
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fas fa-sync-alt"></i> 刷新</a>
            <a href="javascript:;" id="btn-add" class="btn btn-success btn-add" title="添加网关"><i class="fas fa-plus"></i> 添加网关</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
<script>
(function(){
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    var codeFilter = '{$code_filter|default=""}';
    var indexUrl = base + '/payment/config/index' + (codeFilter ? '?code=' + encodeURIComponent(codeFilter) : '');
    var addUrl = base + '/payment/config/add' + (codeFilter ? '?code=' + encodeURIComponent(codeFilter) : '');
    var editUrl = base + '/payment/config/edit';
    var delUrl = base + '/payment/config/del';
    var $table = $('#table');
    if (!$table.length || typeof $table.bootstrapTable !== 'function') return;
    $table.bootstrapTable({
        url: indexUrl,
        method: 'get',
        pagination: true,
        sidePagination: 'server',
        pageSize: 20,
        pageList: [10, 20, 50],
        responseHandler: function(res) {
            var d = res && res.data ? res.data : {};
            return { total: d.total || 0, rows: d.list || [] };
        },
        columns: [
            { field: 'id', title: 'ID', width: 70 },
            { field: 'code_name', title: '网关类型', width: 140 },
            { field: 'name', title: '显示名称' },
            { field: 'enabled', title: '状态', width: 80, formatter: function(v) {
                return v == 1 ? '<span class="badge badge-success">启用</span>' : '<span class="badge badge-secondary">关闭</span>';
            }},
            { field: 'sort', title: '排序', width: 70 },
            { field: 'operate', title: '操作', width: 140, align: 'center', formatter: function(v, r) {
                return '<a href="' + editUrl + '?id=' + r.id + '" class="btn btn-xs btn-success">编辑</a> ' +
                    '<a href="javascript:;" class="btn btn-xs btn-danger btn-del-one" data-id="' + r.id + '">删除</a>';
            }}
        ]
    });
    $(document).off('click', '.btn-refresh').on('click', '.btn-refresh', function() { $table.bootstrapTable('refresh'); });
    $('#btn-add').add('.btn-add').off('click').on('click', function() { window.location.href = addUrl; });
    $(document).off('click', '.btn-del-one').on('click', '.btn-del-one', function() {
        var id = $(this).data('id');
        if (!confirm('确定删除该网关？')) return;
        $.post(delUrl, { id: id }, function(r) {
            alert(r.msg || '');
            if (r.code == 1) $table.bootstrapTable('refresh');
        }, 'json');
    });
})();
</script>
