<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>支付订单</em> 支付通道产生的订单记录</div>
    </div>
    <div class="card-body">
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fas fa-sync-alt"></i> 刷新</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
<script>
(function(){
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    var indexUrl = base + '/payment/order/index';
    var $table = $('#table');
    if (!$table.length || typeof $table.bootstrapTable !== 'function') return;
    $table.bootstrapTable({
        url: indexUrl,
        method: 'get',
        pagination: true,
        sidePagination: 'server',
        pageSize: 20,
        pageList: [10, 20, 50],
        responseHandler: function(res) {
            var d = res && res.data ? res.data : {};
            return { total: d.total || 0, rows: d.list || [] };
        },
        columns: [
            { field: 'id', title: 'ID', width: 70 },
            { field: 'order_no', title: '订单号', width: 180 },
            { field: 'title', title: '标题' },
            { field: 'amount', title: '金额', width: 100 },
            { field: 'gateway_name', title: '网关', width: 120 },
            { field: 'status_text', title: '状态', width: 90 },
            { field: 'third_order_id', title: '第三方单号', width: 140 },
            { field: 'pay_time_text', title: '支付时间', width: 160 },
            { field: 'create_time_text', title: '创建时间', width: 160 }
        ]
    });
    $(document).off('click', '.btn-refresh').on('click', '.btn-refresh', function() { $table.bootstrapTable('refresh'); });
})();
</script>
