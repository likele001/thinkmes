<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">编辑回复模板</h3></div>
    <div class="card-body">
        <form id="form-edit" method="post" class="form-horizontal" data-id="{$row.id}" data-url="restaurant/review_template/edit" data-back="restaurant/review_template">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">平台</label>
                <div class="col-sm-6"><input type="text" name="row[platform]" class="form-control" value="{$row.platform|default=''}" placeholder="可留空=全平台"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">场景</label>
                <div class="col-sm-6">
                    <select name="row[scene]" class="form-control">
                        <option value="good" {if $row.scene=='good'}selected{/if}>好评</option>
                        <option value="bad" {if $row.scene=='bad'}selected{/if}>差评</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">评分范围</label>
                <div class="col-sm-3"><input type="number" name="row[rating_min]" class="form-control" value="{$row.rating_min|default=0}"></div>
                <div class="col-sm-3"><input type="number" name="row[rating_max]" class="form-control" value="{$row.rating_max|default=5}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">模板</label>
                <div class="col-sm-8"><textarea name="row[template]" class="form-control" rows="5" required>{$row.template|default=''}</textarea></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1" {if $row.status==1}selected{/if}>启用</option>
                        <option value="0" {if $row.status==0}selected{/if}>禁用</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-edit" class="btn btn-primary">保存</button>
        <a href="{$config.moduleurl}/restaurant/review_template/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
