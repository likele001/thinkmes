<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加回复模板</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="restaurant/review_template/add" data-back="restaurant/review_template">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">平台</label>
                <div class="col-sm-6"><input type="text" name="row[platform]" class="form-control" placeholder="可留空=全平台"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">场景</label>
                <div class="col-sm-6">
                    <select name="row[scene]" class="form-control">
                        <option value="good">好评</option>
                        <option value="bad">差评</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">评分范围</label>
                <div class="col-sm-3"><input type="number" name="row[rating_min]" class="form-control" value="0"></div>
                <div class="col-sm-3"><input type="number" name="row[rating_max]" class="form-control" value="5"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">模板</label>
                <div class="col-sm-8"><textarea name="row[template]" class="form-control" rows="5" required></textarea></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/restaurant/review_template/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
