<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加选项</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="restaurant/option/add" data-back="restaurant/option">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">分组</label>
                <div class="col-sm-6">
                    <select name="row[group_id]" class="form-control" required>
                        <option value="">请选择</option>
                        {volist name="groupList" id="g"}
                        <option value="{$g.id}">{$g.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">选项名称</label>
                <div class="col-sm-6"><input type="text" name="row[name]" class="form-control" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">加价</label>
                <div class="col-sm-6"><input type="number" name="row[price_delta]" class="form-control" step="0.01" value="0"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">排序</label>
                <div class="col-sm-6"><input type="number" name="row[sort]" class="form-control" value="0"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/restaurant/option/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
