<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加门店</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="restaurant/store/add" data-back="restaurant/store">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">门店名称</label>
                <div class="col-sm-6"><input type="text" name="row[name]" class="form-control" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">联系电话</label>
                <div class="col-sm-6"><input type="text" name="row[contact_phone]" class="form-control"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">地址</label>
                <div class="col-sm-6"><input type="text" name="row[address]" class="form-control"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/restaurant/store/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
