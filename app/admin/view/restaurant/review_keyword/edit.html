<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">编辑关键词</h3></div>
    <div class="card-body">
        <form id="form-edit" method="post" class="form-horizontal" data-id="{$row.id}" data-url="restaurant/review_keyword/edit" data-back="restaurant/review_keyword">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">关键词</label>
                <div class="col-sm-6"><input type="text" name="row[keyword]" class="form-control" required value="{$row.keyword|default=''}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">分类</label>
                <div class="col-sm-6"><input type="text" name="row[category]" class="form-control" value="{$row.category|default=''}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">权重</label>
                <div class="col-sm-6"><input type="number" name="row[weight]" class="form-control" value="{$row.weight|default=1}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1" {if $row.status==1}selected{/if}>启用</option>
                        <option value="0" {if $row.status==0}selected{/if}>禁用</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-edit" class="btn btn-primary">保存</button>
        <a href="{$config.moduleurl}/restaurant/review_keyword/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
