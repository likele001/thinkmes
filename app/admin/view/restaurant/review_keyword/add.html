<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加关键词</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="restaurant/review_keyword/add" data-back="restaurant/review_keyword">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">关键词</label>
                <div class="col-sm-6"><input type="text" name="row[keyword]" class="form-control" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">分类</label>
                <div class="col-sm-6"><input type="text" name="row[category]" class="form-control" placeholder="如 出餐/口味/服务/卫生"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">权重</label>
                <div class="col-sm-6"><input type="number" name="row[weight]" class="form-control" value="1"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/restaurant/review_keyword/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
