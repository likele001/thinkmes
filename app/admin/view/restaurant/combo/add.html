<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加套餐</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="restaurant/combo/add" data-back="restaurant/combo">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">门店</label>
                <div class="col-sm-6">
                    <select name="row[store_id]" class="form-control">
                        <option value="0">通用（全部门店）</option>
                        {volist name="storeList" id="s"}
                        <option value="{$s.id}">{$s.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">分类</label>
                <div class="col-sm-6">
                    <select name="row[category_id]" class="form-control">
                        <option value="0">未分类</option>
                        {volist name="categoryList" id="c"}
                        <option value="{$c.id}">{$c.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">套餐名称</label>
                <div class="col-sm-6"><input type="text" name="row[name]" class="form-control" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">价格</label>
                <div class="col-sm-6"><input type="number" name="row[price]" class="form-control" step="0.01" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">包含菜品</label>
                <div class="col-sm-6">
                    <textarea name="row[items_spec]" class="form-control" rows="3" placeholder="格式：菜品ID:数量,菜品ID:数量"></textarea>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">排序</label>
                <div class="col-sm-6"><input type="number" name="row[sort]" class="form-control" value="0"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">售罄</label>
                <div class="col-sm-6">
                    <select name="row[sold_out]" class="form-control">
                        <option value="0">否</option>
                        <option value="1">是</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1">上架</option>
                        <option value="0">下架</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/restaurant/combo/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
