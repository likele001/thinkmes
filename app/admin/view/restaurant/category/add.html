<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加分类</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="restaurant/category/add" data-back="restaurant/category">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">门店</label>
                <div class="col-sm-6">
                    <select name="row[store_id]" class="form-control">
                        <option value="0">通用（全部门店）</option>
                        {volist name="storeList" id="s"}
                        <option value="{$s.id}">{$s.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">分类名称</label>
                <div class="col-sm-6"><input type="text" name="row[name]" class="form-control" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">排序</label>
                <div class="col-sm-6"><input type="number" name="row[sort]" class="form-control" value="0"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/restaurant/category/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
