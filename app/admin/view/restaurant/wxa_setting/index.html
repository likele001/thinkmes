<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">餐饮小程序配置</h3></div>
    <div class="card-body">
        <form id="form-wxa" method="post" class="form-horizontal" action="{$config.moduleurl}/restaurant/wxa_setting/index">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">AppID</label>
                <div class="col-sm-6"><input type="text" name="appid" class="form-control" value="{$appid|default=''}" placeholder="wx开头的小程序AppID"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">Secret</label>
                <div class="col-sm-6"><input type="text" name="secret" class="form-control" value="{$secret|default=''}" placeholder="小程序Secret"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">页面路径</label>
                <div class="col-sm-6"><input type="text" name="page" class="form-control" value="{$page|default='pages/menu/index'}" placeholder="如 pages/menu/index"></div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-wxa" class="btn btn-primary">保存</button>
        <a href="{$config.moduleurl}/restaurant/wxa_setting/index" class="btn btn-default ml-2">刷新</a>
    </div>
</div>
