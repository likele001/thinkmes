<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加桌台</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="restaurant/table/add" data-back="restaurant/table">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">门店</label>
                <div class="col-sm-6">
                    <select name="row[store_id]" class="form-control" required>
                        <option value="">请选择</option>
                        {volist name="storeList" id="s"}
                        <option value="{$s.id}">{$s.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">区域</label>
                <div class="col-sm-6">
                    <select name="row[area_id]" class="form-control" required>
                        <option value="">请选择</option>
                        {volist name="areaList" id="a"}
                        <option value="{$a.id}">{$a.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">桌台名称</label>
                <div class="col-sm-6"><input type="text" name="row[name]" class="form-control" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">桌号/编码</label>
                <div class="col-sm-6"><input type="text" name="row[code]" class="form-control"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">座位数</label>
                <div class="col-sm-6"><input type="number" name="row[seats]" class="form-control" value="4"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">桌台状态</label>
                <div class="col-sm-6">
                    <select name="row[state]" class="form-control">
                        <option value="0">空闲</option>
                        <option value="1">占用</option>
                        <option value="2">清台中</option>
                        <option value="3">预定</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">启用</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/restaurant/table/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
