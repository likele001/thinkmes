<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">编辑桌台</h3></div>
    <div class="card-body">
        <form id="form-edit" method="post" class="form-horizontal" data-id="{$row.id}" data-url="restaurant/table/edit" data-back="restaurant/table">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">门店</label>
                <div class="col-sm-6">
                    <select name="row[store_id]" class="form-control" required>
                        <option value="">请选择</option>
                        {volist name="storeList" id="s"}
                        <option value="{$s.id}" {if $row.store_id==$s.id}selected{/if}>{$s.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">区域</label>
                <div class="col-sm-6">
                    <select name="row[area_id]" class="form-control" required>
                        <option value="">请选择</option>
                        {volist name="areaList" id="a"}
                        <option value="{$a.id}" {if $row.area_id==$a.id}selected{/if}>{$a.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">桌台名称</label>
                <div class="col-sm-6"><input type="text" name="row[name]" class="form-control" required value="{$row.name|default=''}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">桌号/编码</label>
                <div class="col-sm-6"><input type="text" name="row[code]" class="form-control" value="{$row.code|default=''}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">座位数</label>
                <div class="col-sm-6"><input type="number" name="row[seats]" class="form-control" value="{$row.seats|default='0'}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">桌台状态</label>
                <div class="col-sm-6">
                    <select name="row[state]" class="form-control">
                        <option value="0" {if $row.state==0}selected{/if}>空闲</option>
                        <option value="1" {if $row.state==1}selected{/if}>占用</option>
                        <option value="2" {if $row.state==2}selected{/if}>清台中</option>
                        <option value="3" {if $row.state==3}selected{/if}>预定</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">启用</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1" {if $row.status==1}selected{/if}>启用</option>
                        <option value="0" {if $row.status==0}selected{/if}>禁用</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">桌码 Token</label>
                <div class="col-sm-6">
                    <input type="text" class="form-control" readonly value="{$row.qr_token|default=''}">
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-edit" class="btn btn-primary">保存</button>
        <a href="{$config.moduleurl}/restaurant/table/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
