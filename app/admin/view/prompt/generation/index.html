<div class="panel panel-default">
  <div class="panel-heading">
    <div class="pull-right" style="display:flex;gap:8px">
      <select class="form-control" id="filter-status" style="width:110px">
        <option value="">全部状态</option>
        <option value="1">成功</option>
        <option value="0">失败</option>
      </select>
      <div class="input-group" style="width:200px">
        <input type="text" class="form-control" id="search-keyword" placeholder="搜索模板/内容...">
        <span class="input-group-btn"><button class="btn btn-default" id="btn-search"><i class="fas fa-search"></i></button></span>
      </div>
    </div>
  </div>
  <div class="panel-body">
    <table id="table-list" class="table table-striped table-hover"></table>
  </div>
</div>
