<form id="form-add" class="form-horizontal" style="padding:20px">
  <div class="form-group">
    <label class="col-sm-3 control-label">配置名称 <span class="text-danger">*</span></label>
    <div class="col-sm-6"><input type="text" name="name" class="form-control" required placeholder="例如：OpenAI主账号"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">服务商</label>
    <div class="col-sm-5">
      <select name="provider" class="form-control" id="sel-provider">
        <option value="openai">OpenAI (ChatGPT)</option>
        <option value="zhipu">智谱AI (GLM)</option>
        <option value="qwen">通义千问</option>
        <option value="deepseek">DeepSeek</option>
        <option value="moonshot">月之暗面 (Kimi)</option>
        <option value="other">其他（兼容OpenAI接口）</option>
      </select>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">API 地址</label>
    <div class="col-sm-7">
      <input type="text" name="api_base" class="form-control" id="input-api-base" placeholder="https://api.openai.com">
      <p class="help-block">默认使用 OpenAI 格式。国内代理或第三方中转服务填写对应地址</p>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">API Key <span class="text-danger">*</span></label>
    <div class="col-sm-7"><input type="password" name="api_key" class="form-control" required placeholder="sk-..."></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">模型名称 <span class="text-danger">*</span></label>
    <div class="col-sm-5">
      <input type="text" name="model" class="form-control" required placeholder="gpt-3.5-turbo" id="input-model">
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">图片模型</label>
    <div class="col-sm-5">
      <input type="text" name="image_model" class="form-control" placeholder="cogview-3-flash" id="input-image-model">
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">视频模型</label>
    <div class="col-sm-5">
      <input type="text" name="video_model" class="form-control" placeholder="cogvideox-flash" id="input-video-model">
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">最大Token数</label>
    <div class="col-sm-3"><input type="number" name="max_tokens" class="form-control" value="2048"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">Temperature</label>
    <div class="col-sm-3"><input type="number" name="temperature" class="form-control" value="0.70" min="0" max="2" step="0.05"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">排序</label>
    <div class="col-sm-3"><input type="number" name="sort" class="form-control" value="0"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">状态</label>
    <div class="col-sm-6">
      <label class="radio-inline"><input type="radio" name="status" value="1" checked> 启用</label>
      <label class="radio-inline"><input type="radio" name="status" value="0"> 禁用</label>
    </div>
  </div>
  <div class="form-group">
    <div class="col-sm-offset-3 col-sm-8">
      <button type="submit" class="btn btn-primary">保 存</button>
      <button type="button" class="btn btn-default" id="btn-test" style="margin-left:10px">测试连接</button>
    </div>
  </div>
</form>
<script>
$(function () {
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '/admin';
    var providerDefaults = {
        openai: {base: 'https://api.openai.com', model: 'gpt-3.5-turbo', image_model: '', video_model: ''},
        zhipu: {base: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4-flash', image_model: 'cogview-3-flash', video_model: 'cogvideox-flash'},
        qwen: {base: 'https://dashscope.aliyuncs.com/compatible-mode', model: 'qwen-plus'},
        deepseek: {base: 'https://api.deepseek.com', model: 'deepseek-chat'},
        moonshot: {base: 'https://api.moonshot.cn', model: 'moonshot-v1-8k'},
        other: {base: '', model: ''}
    };
    $('#sel-provider').on('change', function () {
        var d = providerDefaults[this.value] || {};
        if (d.base) $('#input-api-base').val(d.base);
        if (d.model) $('#input-model').val(d.model);
        if (d.image_model !== undefined) $('#input-image-model').val(d.image_model);
        if (d.video_model !== undefined) $('#input-video-model').val(d.video_model);
    });
    $('#form-add').attr('action', base + '/prompt/ai_config/add');
    $('#form-add').on('submit', function (e) {
        e.preventDefault();
        $.post($(this).attr('action'), $(this).serialize(), function (r) {
            if (r.code == 1) { parent.layer.msg('添加成功', {icon: 1}); parent.layer.closeAll(); }
            else { parent.layer.msg(r.msg || '添加失败', {icon: 2}); }
        }, 'json');
    });
    $('#btn-test').on('click', function () {
        var data = $('#form-add').serialize();
        $(this).text('测试中...').prop('disabled', true);
        var $btn = $(this);
        $.post(base + '/prompt/ai_config/test', data, function (r) {
            $btn.text('测试连接').prop('disabled', false);
            alert(r.msg || (r.code == 1 ? '连接成功' : '连接失败'));
        }, 'json');
    });
});
</script>
