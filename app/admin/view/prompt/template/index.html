<div class="panel panel-default">
  <div class="panel-heading">
    <button class="btn btn-success btn-sm" id="btn-add"><i class="fas fa-plus"></i> 添加模板</button>
    <div class="pull-right" style="display:flex;gap:8px">
      <select class="form-control" id="filter-category" style="width:140px">
        <option value="">全部分类</option>
        {foreach $categories as $cat}<option value="{$cat.id}">{$cat.name}</option>{/foreach}
      </select>
      <div class="input-group" style="width:220px">
        <input type="text" class="form-control" id="search-keyword" placeholder="搜索标题/简介...">
        <span class="input-group-btn"><button class="btn btn-default" id="btn-search"><i class="fas fa-search"></i></button></span>
      </div>
    </div>
  </div>
  <div class="panel-body">
    <table id="table-list" class="table table-striped table-hover"></table>
  </div>
</div>
