<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">编辑员工</h3></div>
    <div class="card-body">
        <form id="form-edit" method="post" class="form-horizontal">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">工号</label>
                <div class="col-sm-6"><input type="text" name="row[no]" class="form-control" value="{$row.no}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">姓名</label>
                <div class="col-sm-6"><input type="text" name="row[name]" class="form-control" required value="{$row.name}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">部门</label>
                <div class="col-sm-6">
                    <select name="row[department_id]" class="form-control">
                        <option value="0">请选择</option>
                        {volist name="departmentList" id="d"}
                        <option value="{$d.id}" {$d.id == $row.department_id ? 'selected' : ''}>{$d.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">岗位</label>
                <div class="col-sm-6">
                    <select name="row[position_id]" class="form-control">
                        <option value="0">请选择</option>
                        {volist name="positionList" id="p"}
                        <option value="{$p.id}" {$p.id == $row.position_id ? 'selected' : ''}>{$p.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">手机</label>
                <div class="col-sm-6"><input type="text" name="row[mobile]" class="form-control" value="{$row.mobile}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1" {$row.status == 1 ? 'selected' : ''}>在职</option>
                        <option value="2" {$row.status == 2 ? 'selected' : ''}>离职</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-edit" class="btn btn-primary">保存</button>
        <a href="{$config.moduleurl}/hr/employee/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
<script>
(function() {
    if (typeof jQuery === 'undefined') { setTimeout(arguments.callee, 50); return; }
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    $('#form-edit').on('submit', function(e) {
        e.preventDefault();
        $.post(base + '/hr/employee/edit?ids=' + '{$row.id}', $(this).serialize(), function(r) {
            if (r.code == 1) { alert(r.msg || '保存成功'); location.href = base + '/hr/employee/index'; }
            else alert(r.msg || '保存失败');
        }, 'json');
    });
})();
</script>
