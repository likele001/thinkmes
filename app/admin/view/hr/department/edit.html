<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">编辑部门</h3></div>
    <div class="card-body">
        <form id="form-edit" method="post" class="form-horizontal" data-id="{$row.id}">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">部门名称</label>
                <div class="col-sm-6"><input type="text" name="row[name]" class="form-control" required value="{$row.name}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">上级部门</label>
                <div class="col-sm-6">
                    <select name="row[pid]" class="form-control">
                        <option value="0">无（顶级）</option>
                        {volist name="parentList" id="p"}
                        <option value="{$p.id}" {$p.id == $row.pid ? 'selected' : ''}>{$p.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">排序</label>
                <div class="col-sm-6"><input type="number" name="row[sort]" class="form-control" value="{$row.sort}"></div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-edit" class="btn btn-primary">保存</button>
        <a href="{$config.moduleurl}/hr/department/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
