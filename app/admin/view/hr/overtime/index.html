<div class="card panel-intro">
    <div class="card-header"><div class="panel-lead"><em>加班管理</em></div></div>
    <div class="card-body">
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary btn-refresh"><i class="fas fa-sync-alt"></i> 刷新</a>
            <a href="{$config.moduleurl}/hr/overtime/add" class="btn btn-success"><i class="fas fa-plus"></i> 添加</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled"><i class="fas fa-edit"></i> 编辑</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled"><i class="fas fa-trash-alt"></i> 删除</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
<script>
(function init() {
    if (typeof window.jQuery === 'undefined' || !window.jQuery.fn.bootstrapTable) { setTimeout(init, 50); return; }
    var $ = window.jQuery, base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '', $table = $('#table');
    if ($table.data('bootstrap.table')) return;
    $table.bootstrapTable({
        url: base + '/hr/overtime/index', pk: 'id', sortName: 'id', sortOrder: 'desc',
        pagination: true, sidePagination: 'server', pageSize: 20, pageList: [10, 20, 50],
        responseHandler: function (res) { var d = res.data || {}; return { total: d.total || 0, rows: d.list || [] }; },
        columns: [
            {field: 'id', title: 'ID', width: 70},
            {field: 'employee_name', title: '员工', width: 100},
            {field: 'work_date', title: '加班日期', width: 110},
            {field: 'hours', title: '时长(h)', width: 90},
            {field: 'reason', title: '原因', align: 'left'},
            {field: 'status_text', title: '状态', width: 80, formatter: function(v, row) {
                var cls = {0: 'warning', 1: 'success', 2: 'danger'};
                return '<span class="badge badge-' + (cls[row.status] || 'secondary') + '">' + (v || '') + '</span>';
            }},
            {field: 'operate', title: '操作', width: 160, formatter: function(v, row) {
                var s = '';
                if (row.status == 0) {
                    s = '<a href="javascript:;" class="btn btn-xs btn-success btn-approve" data-id="' + row.id + '" data-status="1">通过</a> ';
                    s += '<a href="javascript:;" class="btn btn-xs btn-danger btn-approve" data-id="' + row.id + '" data-status="2">拒绝</a> ';
                }
                return s + '<a href="' + base + '/hr/overtime/edit?id=' + row.id + '" class="btn btn-xs btn-primary">编辑</a> <a href="javascript:;" class="btn btn-xs btn-danger btn-del-one">删除</a>';
            }, events: {
                'click .btn-approve': function(e, v, row) {
                    var id = $(e.currentTarget).data('id'), status = $(e.currentTarget).data('status');
                    $.post(base + '/hr/overtime/approve', {id: id, status: status}, function(r) {
                        if (r.code == 1) { $table.bootstrapTable('refresh'); alert(r.msg); } else alert(r.msg || '操作失败');
                    }, 'json');
                },
                'click .btn-del-one': function(e, v, row) {
                    if (confirm('确定删除？')) $.post(base + '/hr/overtime/del', {ids: row.id}, function(r) {
                        if (r.code == 1) { $table.bootstrapTable('refresh'); alert(r.msg || '删除成功'); } else alert(r.msg || '删除失败');
                    }, 'json');
                }
            }}
        ]
    });
    $('#toolbar .btn-refresh').on('click', function() { $table.bootstrapTable('refresh'); });
    $('#toolbar .btn-edit').on('click', function() {
        var rows = $table.bootstrapTable('getSelections');
        if (rows.length !== 1) { alert('请选择一条记录'); return; }
        location.href = base + '/hr/overtime/edit?id=' + rows[0].id;
    });
    $('#toolbar .btn-del').on('click', function() {
        var rows = $table.bootstrapTable('getSelections');
        if (rows.length === 0) { alert('请选择记录'); return; }
        if (!confirm('确定删除选中的 ' + rows.length + ' 条？')) return;
        $.post(base + '/hr/overtime/del', {ids: rows.map(function(r){return r.id;})}, function(r) {
            if (r.code == 1) { $table.bootstrapTable('refresh'); alert(r.msg || '删除成功'); } else alert(r.msg || '删除失败');
        }, 'json');
    });
})();
</script>
