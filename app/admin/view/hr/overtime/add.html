<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加加班</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="hr/overtime/add" data-back="hr/overtime">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">员工</label>
                <div class="col-sm-6">
                    <select name="row[employee_id]" class="form-control" required>
                        <option value="">请选择</option>
                        {volist name="employeeList" id="e"}
                        <option value="{$e.id}">{$e.no|default='-'} - {$e.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">加班日期</label>
                <div class="col-sm-6"><input type="date" name="row[work_date]" class="form-control" required value="{:date('Y-m-d')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">时长(小时)</label>
                <div class="col-sm-6"><input type="number" name="row[hours]" class="form-control" step="0.5" required placeholder="小时"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">原因</label>
                <div class="col-sm-6"><textarea name="row[reason]" class="form-control" rows="2" placeholder="加班原因"></textarea></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="0">待审</option>
                        <option value="1">通过</option>
                        <option value="2">拒绝</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/hr/overtime/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
