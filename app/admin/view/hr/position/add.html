<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加岗位</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="hr/position/add" data-back="hr/position">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">岗位名称</label>
                <div class="col-sm-6"><input type="text" name="row[name]" class="form-control" required placeholder="岗位名称"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">排序</label>
                <div class="col-sm-6"><input type="number" name="row[sort]" class="form-control" value="0"></div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/hr/position/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
