<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加请假</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="hr/leave/add" data-back="hr/leave">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">员工</label>
                <div class="col-sm-6">
                    <select name="row[employee_id]" class="form-control" required>
                        <option value="">请选择</option>
                        {volist name="employeeList" id="e"}
                        <option value="{$e.id}">{$e.no|default='-'} - {$e.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">类型</label>
                <div class="col-sm-6">
                    <select name="row[type]" class="form-control">
                        <option value="1">事假</option>
                        <option value="2">病假</option>
                        <option value="3">年假</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">开始日期</label>
                <div class="col-sm-6"><input type="date" name="row[start_date]" class="form-control" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">结束日期</label>
                <div class="col-sm-6"><input type="date" name="row[end_date]" class="form-control" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">原因</label>
                <div class="col-sm-6"><textarea name="row[reason]" class="form-control" rows="2" placeholder="请假原因"></textarea></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="0">待审</option>
                        <option value="1">通过</option>
                        <option value="2">拒绝</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/hr/leave/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
