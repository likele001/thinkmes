<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">编辑请假</h3></div>
    <div class="card-body">
        <form id="form-edit" method="post" class="form-horizontal">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">员工</label>
                <div class="col-sm-6">
                    <select name="row[employee_id]" class="form-control" required>
                        <option value="">请选择</option>
                        {volist name="employeeList" id="e"}
                        <option value="{$e.id}" {$e.id == $row.employee_id ? 'selected' : ''}>{$e.no|default='-'} - {$e.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">类型</label>
                <div class="col-sm-6">
                    <select name="row[type]" class="form-control">
                        <option value="1" {$row.type == 1 ? 'selected' : ''}>事假</option>
                        <option value="2" {$row.type == 2 ? 'selected' : ''}>病假</option>
                        <option value="3" {$row.type == 3 ? 'selected' : ''}>年假</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">开始日期</label>
                <div class="col-sm-6"><input type="date" name="row[start_date]" class="form-control" required value="{$row.start_date}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">结束日期</label>
                <div class="col-sm-6"><input type="date" name="row[end_date]" class="form-control" required value="{$row.end_date}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">原因</label>
                <div class="col-sm-6"><textarea name="row[reason]" class="form-control" rows="2">{$row.reason}</textarea></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="0" {$row.status == 0 ? 'selected' : ''}>待审</option>
                        <option value="1" {$row.status == 1 ? 'selected' : ''}>通过</option>
                        <option value="2" {$row.status == 2 ? 'selected' : ''}>拒绝</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-edit" class="btn btn-primary">保存</button>
        <a href="{$config.moduleurl}/hr/leave/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
<script>
(function() {
    if (typeof jQuery === 'undefined') { setTimeout(arguments.callee, 50); return; }
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    $('#form-edit').on('submit', function(e) {
        e.preventDefault();
        $.post(base + '/hr/leave/edit?ids=' + '{$row.id}', $(this).serialize(), function(r) {
            if (r.code == 1) { alert(r.msg || '保存成功'); location.href = base + '/hr/leave/index'; }
            else alert(r.msg || '保存失败');
        }, 'json');
    });
})();
</script>
