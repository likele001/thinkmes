<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">{:__('add_title')}</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('tenant_name')}</label>
                <div class="col-sm-6"><input type="text" name="name" class="form-control" required placeholder="{:__('required_placeholder')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('domain')}</label>
                <div class="col-sm-6"><input type="text" name="domain" class="form-control" placeholder="{:__('placeholder_domain')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('package')}</label>
                <div class="col-sm-6">
                    <select name="package_id" class="form-control">
                        <option value="0">{:__('please_select')}</option>
                        {volist name="packages" id="p"}
                        <option value="{$p.id}">{$p.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('expire_time')}</label>
                <div class="col-sm-6"><input type="date" name="expire_time" class="form-control" placeholder="{:__('placeholder_expire')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('status')}</label>
                <div class="col-sm-6">
                    <select name="status" class="form-control">
                        <option value="1">{:__('status_normal')}</option>
                        <option value="0">{:__('status_disabled')}</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-sm-6 offset-sm-2">
                    <button type="submit" class="btn btn-primary">{:__('submit')}</button>
                    <a href="{:url('tenant/index')}" class="btn btn-default ml-2">{:__('back')}</a>
                </div>
            </div>
        </form>
    </div>
</div>
<script>
$(function () {
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    $('#form-add').attr('action', base + '/tenant/add');
    $('#form-add').on('submit', function (e) {
        e.preventDefault();
        $.post($(this).attr('action'), $(this).serialize(), function (r) {
            alert(r.msg);
            if (r.code === 1) location.href = base + '/tenant/index';
        }, 'json');
    });
});
</script>
