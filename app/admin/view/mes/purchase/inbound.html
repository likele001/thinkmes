{include file='common/meta' /}
<div class="panel panel-default">
    <div class="panel-heading">
        <h4>采购入库</h4>
    </div>
    <div class="panel-body">
        <div class="mb-2">
            <a href="javascript:;" class="btn btn-primary btn-sm btn-refresh">刷新</a>
            <a href="{:url('/admin/mes/purchase/generateFromRequest')}" class="btn btn-success btn-sm">从采购申请生成入库单</a>
            <button type="button" class="btn btn-warning btn-sm btn-confirm-batch">批量确认入库</button>
        </div>
        <form id="form-search" class="form-inline mb-2">
            <select id="c-status" class="form-control form-control-sm" name="status">
                <option value="">全部状态</option>
                <option value="1">待入库</option>
                <option value="2">已入库</option>
            </select>
            <button type="submit" class="btn btn-sm btn-primary">查询</button>
        </form>
        <table id="table" class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th width="40"><input type="checkbox" id="checkall" /></th>
                    <th>入库单号</th>
                    <th>供应商</th>
                    <th>明细数</th>
                    <th>总金额</th>
                    <th>入库时间</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <nav><ul id="pagination" class="pagination pagination-sm mb-0"></ul></nav>
    </div>
</div>
{include file='common/script-iframe' /}
