{include file='common/meta' /}
<div class="panel panel-default">
    <div class="panel-heading">
        <h4>采购入库</h4>
    </div>
    <div class="panel-body">
        <div class="mb-2">
            <a href="javascript:;" class="btn btn-primary btn-sm btn-refresh">刷新</a>
            <a href="{:url('/admin/mes/purchase/generateFromRequest')}" class="btn btn-success btn-sm">从采购申请生成入库单</a>
            <button type="button" class="btn btn-warning btn-sm btn-confirm-batch">批量确认入库</button>
        </div>
        <form id="form-search" class="form-inline mb-2">
            <select id="c-status" class="form-control form-control-sm" name="status">
                <option value="">全部状态</option>
                <option value="1">待入库</option>
                <option value="2">已入库</option>
            </select>
            <button type="submit" class="btn btn-sm btn-primary">查询</button>
        </form>
        <table id="table" class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th width="40"><input type="checkbox" id="checkall" /></th>
                    <th>入库单号</th>
                    <th>供应商</th>
                    <th>明细数</th>
                    <th>总金额</th>
                    <th>入库时间</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <nav><ul id="pagination" class="pagination pagination-sm mb-0"></ul></nav>
    </div>
</div>
<script>
$(function() {
    var base = (typeof Config !== 'undefined' && Config.moduleurl ? Config.moduleurl : '');
    function loadData(page) {
        var status = $('#c-status').val();
        $.get(base + '/mes/purchase/inbound', { page: page, limit: 20, status: status }, function(res) {
            if (res.code === 1) {
                var list = res.data.list || [];
                var html = '';
                for (var i = 0; i < list.length; i++) {
                    var item = list[i];
                    var st = parseInt(item.status, 10);
                    var statusCls = st === 1 ? 'label-warning' : (st === 2 ? 'label-success' : 'label-default');
                    var op = '';
                    if (st === 1) {
                        op = '<a href="javascript:;" class="btn btn-xs btn-success btn-confirm" data-id="' + item.id + '">确认入库</a> ';
                    }
                    op += '<a href="' + base + '/mes/purchase/viewInboundItems?id=' + item.id + '" class="btn btn-xs btn-info">查看明细</a>';
                    var inboundTime = '-';
                    var ts = item.inbound_date != null ? item.inbound_date : item.create_time;
                    if (ts != null && ts !== '') {
                        var dt = null;
                        if (typeof ts === 'number' && ts > 0) {
                            dt = new Date(ts > 1e12 ? ts : ts * 1000);
                        } else if (typeof ts === 'string') {
                            var n = parseInt(ts, 10);
                            if (!isNaN(n) && n > 1000000000) {
                                dt = new Date(n * 1000);
                            } else {
                                dt = new Date(ts.replace(/-/g, '/'));
                            }
                        }
                        if (dt && !isNaN(dt.getTime())) {
                            var pad = function(x) { return (x < 10) ? '0' + x : '' + x; };
                            inboundTime = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()) + ' ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
                        }
                    }
                    html += '<tr>' +
                        '<td><input type="checkbox" name="ids" value="' + item.id + '" data-status="' + st + '" /></td>' +
                        '<td>' + (item.inbound_no || '-') + '</td>' +
                        '<td>' + (item.supplier && item.supplier.name ? item.supplier.name : '-') + '</td>' +
                        '<td>' + (item.item_count || 0) + '</td>' +
                        '<td>' + (item.total_amount != null ? parseFloat(item.total_amount).toFixed(2) : '0.00') + '</td>' +
                        '<td>' + inboundTime + '</td>' +
                        '<td><span class="label ' + statusCls + '">' + (item.status_text || '') + '</span></td>' +
                        '<td>' + op + '</td></tr>';
                }
                $('#table tbody').html(html || '<tr><td colspan="8" class="text-center text-muted">暂无数据</td></tr>');
                var total = res.data.total || 0;
                renderPagination(page, Math.max(1, Math.ceil(total / 20)));
            }
        }, 'json');
    }
    function renderPagination(current, total) {
        var $ul = $('#pagination');
        $ul.empty();
        if (total <= 0) return;
        if (current > 1) {
            $ul.append('<li class="page-item"><a class="page-link" href="javascript:;" data-page="' + (current - 1) + '">上一页</a></li>');
        }
        var from = Math.max(1, current - 2);
        var to = Math.min(total, current + 2);
        if (from > 1) {
            $ul.append('<li class="page-item"><a class="page-link" href="javascript:;" data-page="1">1</a></li>');
            if (from > 2) $ul.append('<li class="page-item disabled"><span class="page-link">…</span></li>');
        }
        for (var i = from; i <= to; i++) {
            if (i === current) {
                $ul.append('<li class="page-item active"><span class="page-link">' + i + '</span></li>');
            } else {
                $ul.append('<li class="page-item"><a class="page-link" href="javascript:;" data-page="' + i + '">' + i + '</a></li>');
            }
        }
        if (to < total) {
            if (to < total - 1) $ul.append('<li class="page-item disabled"><span class="page-link">…</span></li>');
            $ul.append('<li class="page-item"><a class="page-link" href="javascript:;" data-page="' + total + '">' + total + '</a></li>');
        }
        if (current < total) {
            $ul.append('<li class="page-item"><a class="page-link" href="javascript:;" data-page="' + (current + 1) + '">下一页</a></li>');
        }
        $ul.off('click', '.page-link[data-page]').on('click', '.page-link[data-page]', function(e) {
            e.preventDefault();
            var p = $(this).data('page');
            if (p) loadData(p);
        });
    }
    window.loadData = loadData;
    $('#checkall').on('click', function() {
        $('input[name="ids"]').prop('checked', $(this).prop('checked'));
    });
    $(document).on('click', '.btn-confirm', function() {
        var id = $(this).data('id');
        if (!confirm('确认对该入库单执行入库（增加库存）？')) return;
        $.post(base + '/mes/purchase/confirmInbound', { ids: id }, function(r) {
            alert(r.msg || (r.code == 1 ? '成功' : '失败'));
            if (r.code == 1) loadData(1);
        }, 'json');
    });
    $('.btn-refresh').on('click', function() { loadData(1); });
    $('#form-search').on('submit', function(e) { e.preventDefault(); loadData(1); });
    $('.btn-confirm-batch').on('click', function() {
        var ids = $('input[name="ids"]:checked').filter(function() { return $(this).data('status') == 1; }).map(function() { return this.value; }).get();
        if (!ids.length) { alert('请勾选待入库的单据'); return; }
        if (!confirm('确认对选中的 ' + ids.length + ' 张入库单执行入库？')) return;
        $.post(base + '/mes/purchase/confirmInbound', { ids: ids.join(',') }, function(r) {
            alert(r.msg || (r.code == 1 ? '成功' : '失败'));
            if (r.code == 1) loadData(1);
        }, 'json');
    });
    loadData(1);
});
</script>
