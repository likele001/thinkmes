{include file='common/meta' /}
<style>
/* 简单表单样式 */
.form-group {
    margin-bottom: 15px;
}
.form-control {
    max-width: 300px;
}
</style>
<div class="panel panel-default">
    <div class="panel-heading">
        <h4>采购申请管理</h4>
    </div>
    <div class="panel-body">
        <div class="mb-2">
            <a href="javascript:;" id="btn-generate-inbound" class="btn btn-success btn-sm"><i class="fas fa-plus"></i> 生成入库单</a>
            <span class="text-muted small ml-2">审核通过后，到此处选择申请生成入库单，再在「采购入库」中确认入库</span>
        </div>
        <form id="form-search" class="form-horizontal" role="form">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">状态</label>
                <div class="col-xs-12 col-sm-3">
                    <select id="c-status" class="form-control" name="status">
                        <option value="">全部</option>
                        <option value="0">待审核</option>
                        <option value="1">已审核</option>
                        <option value="2">已采购</option>
                        <option value="3">已取消</option>
                    </select>
                </div>
                <div class="col-xs-12 col-sm-2">
                    <button type="submit" class="btn btn-primary">查询</button>
                    <button type="reset" class="btn btn-default">重置</button>
                </div>
            </div>
        </form>

        <table id="table" class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th><input type="checkbox" name="ids" value="" id="checkall" /></th>
                    <th>申请编号</th>
                    <th>物料名称</th>
                    <th>供应商</th>
                    <th>申请数量</th>
                    <th>申请日期</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <nav><ul id="pagination" class="pagination pagination-sm mb-0"></ul></nav>
    </div>
</div>
<script>
$(function() {
    // 加载数据
    function loadData(page) {
        var status = $('#c-status').val();
        $.ajax({
            url: '{:url("/admin/mes/purchase/request")}',
            type: 'GET',
            data: {
                page: page,
                limit: 20,
                status: status
            },
            dataType: 'json',
            success: function(res) {
                if (res.code === 1) {
                    var html = '';
                    $.each(res.data.list, function(i, item) {
                        var statusText = '';
                        var st = parseInt(item.status, 10);
                        switch (st) {
                            case 0:
                                statusText = '<span class="label label-warning">待审核</span>';
                                break;
                            case 1:
                                statusText = '<span class="label label-info">已审核</span>';
                                break;
                            case 2:
                                statusText = '<span class="label label-success">已采购</span>';
                                break;
                            case 3:
                                statusText = '<span class="label label-danger">已取消</span>';
                                break;
                        }
                        var ts = item.create_time;
                        var dateStr = '-';
                        if (ts != null && ts !== '') {
                            var d = null;
                            if (typeof ts === 'number' && ts > 0) {
                                d = new Date(ts * 1000);
                            } else if (typeof ts === 'string') {
                                var n = parseInt(ts, 10);
                                if (!isNaN(n) && n > 0) {
                                    d = new Date(n * 1000);
                                } else {
                                    d = new Date(ts.replace(/-/g, '/'));
                                }
                            }
                            if (d && !isNaN(d.getTime()) && d.getFullYear() >= 2000) {
                                var pad = function(x) { return (x < 10) ? '0' + x : '' + x; };
                                dateStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                            }
                        }
                        var opHtml = '';
                        if (st === 0) {
                            opHtml = '<a href="javascript:;" class="btn btn-xs btn-primary" onclick="audit(' + item.id + ', 1)">通过</a> ' +
                                '<a href="javascript:;" class="btn btn-xs btn-danger" onclick="audit(' + item.id + ', 2)">驳回</a>';
                        } else if (st === 1) {
                            opHtml = '<span class="text-muted">请到上方「生成入库单」勾选</span>';
                        } else {
                            opHtml = '-';
                        }
                        html += '<tr>' +
                            '<td><input type="checkbox" name="id" value="' + item.id + '" /></td>' +
                            '<td>' + (item.request_no || '') + '</td>' +
                            '<td>' + (item.material ? item.material.name : '') + '</td>' +
                            '<td>' + (item.supplier && item.supplier.name ? item.supplier.name : '未指定') + '</td>' +
                            '<td>' + (item.required_quantity != null ? item.required_quantity : (item.quantity || 0)) + '</td>' +
                            '<td>' + dateStr + '</td>' +
                            '<td>' + statusText + '</td>' +
                            '<td>' + opHtml + '</td>' +
                            '</tr>';
                    });
                    $('#table tbody').html(html || '<tr><td colspan="8" class="text-center text-muted">暂无数据</td></tr>');
                    // 渲染分页
                    var total = res.data.total || 0;
                    renderPagination(page, Math.max(1, Math.ceil(total / 20)));
                } else {
                    alert(res.msg);
                }
            }
        });
    }
    window.loadData = loadData;

    // 渲染分页（与 Bootstrap / Pear Admin 一致：page-item + page-link）
    function renderPagination(current, total) {
        var $ul = $('#pagination');
        $ul.empty();
        if (total <= 0) return;
        if (current > 1) {
            $ul.append('<li class="page-item"><a class="page-link" href="javascript:;" data-page="' + (current - 1) + '">上一页</a></li>');
        }
        var from = Math.max(1, current - 2);
        var to = Math.min(total, current + 2);
        if (from > 1) {
            $ul.append('<li class="page-item"><a class="page-link" href="javascript:;" data-page="1">1</a></li>');
            if (from > 2) $ul.append('<li class="page-item disabled"><span class="page-link">…</span></li>');
        }
        for (var i = from; i <= to; i++) {
            if (i === current) {
                $ul.append('<li class="page-item active"><span class="page-link">' + i + '</span></li>');
            } else {
                $ul.append('<li class="page-item"><a class="page-link" href="javascript:;" data-page="' + i + '">' + i + '</a></li>');
            }
        }
        if (to < total) {
            if (to < total - 1) $ul.append('<li class="page-item disabled"><span class="page-link">…</span></li>');
            $ul.append('<li class="page-item"><a class="page-link" href="javascript:;" data-page="' + total + '">' + total + '</a></li>');
        }
        if (current < total) {
            $ul.append('<li class="page-item"><a class="page-link" href="javascript:;" data-page="' + (current + 1) + '">下一页</a></li>');
        }
        $ul.off('click', '.page-link[data-page]').on('click', '.page-link[data-page]', function(e) {
            e.preventDefault();
            var p = $(this).data('page');
            if (p) loadData(p);
        });
    }

    // 审核
    window.audit = function(id, status) {
        if (confirm('确定要' + (status == 1 ? '通过' : '驳回') + '该申请吗？')) {
            $.ajax({
                url: (typeof Config !== 'undefined' && Config.moduleurl ? Config.moduleurl : '') + '/mes/purchase/auditRequest',
                type: 'POST',
                data: {
                    ids: id,
                    status: status
                },
                dataType: 'json',
                success: function(res) {
                    if (res.code === 1) {
                        alert(res.msg);
                        loadData(1);
                    } else {
                        alert(res.msg);
                    }
                }
            });
        }
    };

    // 查询按钮
    $('#form-search').on('submit', function(e) {
        e.preventDefault();
        loadData(1);
    });

    // 重置按钮
    $('button[type="reset"]').on('click', function() {
        $('#form-search')[0].reset();
    });

    // 全选
    $('#checkall').on('click', function() {
        $('input[name="id"]').prop('checked', $(this).prop('checked'));
    });

    // 生成入库单：跳转到生成页
    $('#btn-generate-inbound').on('click', function() {
        var base = (typeof Config !== 'undefined' && Config.moduleurl ? Config.moduleurl : '');
        window.location.href = base + '/mes/purchase/generateFromRequest';
    });

    // 初始加载数据
    loadData(1);
});
</script>
