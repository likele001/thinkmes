{include file='common/meta' /}
<div class="panel panel-default">
    <div class="panel-heading"><h4>添加入库单</h4></div>
    <div class="panel-body">
        <form id="form-add" class="form-horizontal" role="form" method="post"
              data-url="mes/purchase/addInbound" data-back="mes/purchase/inbound">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">关联采购申请</label>
                <div class="col-xs-12 col-sm-8">
                    <select id="c-purchase_request_id" class="form-control" name="row[purchase_request_id]">
                        <option value="">不关联（手动选择物料）</option>
                        {volist name="requestList" id="req"}
                        <option value="{$req.id}" data-material-id="{$req.material_id}" {if isset($preselect_request_id) && $preselect_request_id == $req.id}selected{/if}>{$req.id} - {$req.material.name|default=''}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">物料<span class="text-danger">*</span></label>
                <div class="col-xs-12 col-sm-8">
                    <select id="c-material_id" class="form-control" name="row[material_id]" data-rule="required">
                        <option value="">请选择物料</option>
                        {volist name="materialList" id="name" key="mid"}
                        <option value="{$mid}">{$name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">入库数量<span class="text-danger">*</span></label>
                <div class="col-xs-12 col-sm-8">
                    <input type="number" step="0.01" min="0.01" id="c-in_quantity" class="form-control" name="row[in_quantity]" value="{:isset($preselect_quantity) ? $preselect_quantity : 1}" data-rule="required" placeholder="入库数量">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">入库时间</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="datetime-local" class="form-control" name="row[in_time]" value="{:date('Y-m-d\TH:i', time())}" placeholder="入库时间">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">备注</label>
                <div class="col-xs-12 col-sm-8">
                    <textarea class="form-control" name="row[remark]" rows="2" placeholder="备注"></textarea>
                </div>
            </div>
            <div class="form-group layer-footer">
                <label class="control-label col-xs-12 col-sm-2"></label>
                <div class="col-xs-12 col-sm-8">
                    <button type="submit" class="btn btn-success btn-embossed">确定</button>
                    <button type="reset" class="btn btn-default btn-embossed">重置</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script type="application/json" id="add-inbound-meta">{"preselectMaterialId":{:isset($preselect_material_id) ? (int)$preselect_material_id : 0}}</script>
{include file='common/script-iframe' /}
