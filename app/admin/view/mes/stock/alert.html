<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>库存预警</em> 对物料做库存检查，低于安全库存的物料可批量或单条创建采购申请</div>
    </div>
    <div class="card-body">
        <div class="alert alert-warning mb-3" role="alert">
            <strong><i class="fas fa-exclamation-triangle"></i> 缺货物料提醒</strong><br>
            <span class="small">以下物料库存不足，建议及时采购补充：</span>
        </div>
        <div id="toolbar" class="toolbar mb-2">
            <a href="{:url('/admin/mes/purchase/request')}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> 返回采购申请列表</a>
            <a href="javascript:;" class="btn btn-primary btn-refresh"><i class="fas fa-sync-alt"></i> 刷新</a>
            <button type="button" class="btn btn-success" id="btn-create-request"><i class="fas fa-plus"></i> 创建采购申请</button>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
<script>
(function init() {
    if (typeof window.jQuery === 'undefined' || !window.jQuery.fn.bootstrapTable) { setTimeout(init, 50); return; }
    var $ = window.jQuery, base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '/admin', $table = $('#table');
    if ($table.data('bootstrap.table')) return;
    $table.bootstrapTable({
        url: base + '/mes/stock/alert',
        pk: 'id',
        pagination: true,
        sidePagination: 'server',
        pageList: [20, 50, 100],
        pageSize: 20,
        queryParams: function (p) {
            return {
                limit: p.limit || 20,
                offset: p.offset !== undefined ? p.offset : ((p.page || 1) - 1) * (p.limit || 20),
                page: (p.offset !== undefined && p.limit) ? Math.floor(p.offset / p.limit) + 1 : (p.page || 1)
            };
        },
        clickToSelect: true,
        checkboxHeader: true,
        responseHandler: function (res) {
            var d = res.data || {};
            return { total: d.total || 0, rows: d.list || [] };
        },
        columns: [
            {checkbox: true, width: 36},
            {field: 'id', title: 'Id', width: 70},
            {field: 'code', title: '物料编码', width: 120},
            {field: 'name', title: '物料名称', align: 'left'},
            {field: 'stock', title: '当前库存', width: 100, formatter: function(v, row) {
                var u = row.unit || '';
                return '<span class="text-danger">' + (v != null ? v : 0) + ' ' + u + '</span>';
            }},
            {field: 'min_stock', title: '最小库存', width: 100, formatter: function(v, row) {
                var u = row.unit || '';
                return (v != null ? v : 0) + ' ' + u;
            }},
            {field: 'current_price', title: '参考价格', width: 100, formatter: function(v) {
                return v != null && v !== '' ? '¥' + parseFloat(v).toFixed(2) : '-';
            }},
            {field: 'shortage', title: '缺货量', width: 90, formatter: function(v, row) {
                var u = row.unit || '';
                return '<span class="text-danger">' + (v != null ? v : 0) + ' ' + u + '</span>';
            }},
            {field: 'operate', title: '操作', width: 110, formatter: function(v, row) {
                return '<a href="javascript:;" class="btn btn-xs btn-success btn-apply-one" data-id="' + row.id + '">+ 申请采购</a>';
            }}
        ]
    });
    $('#toolbar .btn-refresh').on('click', function() { $table.bootstrapTable('refresh'); });
    $('#btn-create-request').on('click', function() {
        var rows = $table.bootstrapTable('getSelections');
        if (!rows || rows.length === 0) {
            if (typeof layui !== 'undefined' && layui.msg) layui.msg('请先勾选要采购的物料'); else alert('请先勾选要采购的物料');
            return;
        }
        var ids = rows.map(function(r) { return r.id; });
        $.post(base + '/mes/purchase/createRequestFromStockAlert', { material_ids: ids }, function(r) {
            var msg = (r && r.msg) ? r.msg : (r && r.code === 1 ? '已创建采购申请' : '操作失败');
            if (typeof layui !== 'undefined' && layui.msg) layui.msg(msg); else alert(msg);
            if (r && r.code === 1) { $table.bootstrapTable('refresh'); $table.bootstrapTable('uncheckAll'); }
        }, 'json');
    });
    $(document).off('click', '.btn-apply-one').on('click', '.btn-apply-one', function() {
        var id = $(this).data('id');
        if (!id) return;
        $.post(base + '/mes/purchase/createRequestFromStockAlert', { material_ids: [id] }, function(r) {
            var msg = (r && r.msg) ? r.msg : (r && r.code === 1 ? '已创建采购申请' : '操作失败');
            if (typeof layui !== 'undefined' && layui.msg) layui.msg(msg); else alert(msg);
            if (r && r.code === 1) $table.bootstrapTable('refresh');
        }, 'json');
    });
})();
</script>
