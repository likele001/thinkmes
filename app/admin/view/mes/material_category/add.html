<form id="form-add" class="form-horizontal" role="form" action="" method="post">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">分类名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" class="form-control" name="row[name]" value="" data-rule="required" placeholder="请输入分类名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">分类编码</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-code" class="form-control" name="row[code]" value="" placeholder="留空则自动生成">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">描述</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-description" class="form-control" name="row[description]" rows="3" placeholder="选填"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" id="c-sort" class="form-control" name="row[sort]" value="0" placeholder="数值越小越靠前">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" class="form-control" name="row[status]">
                <option value="1">启用</option>
                <option value="0">禁用</option>
            </select>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
<script>
(function() {
    var form = $('#form-add')[0];
    var submitBtn = $(form).find('button[type="submit"]');

    $(form).on('submit', function(e) {
        e.preventDefault();
        var name = $(form).find('[name="row[name]"]').val();
        if (!name || !name.trim()) {
            alert('请输入分类名称');
            return false;
        }
        submitBtn.prop('disabled', true);
        $.ajax({
            url: $(form).attr('action') || window.location.href,
            type: 'POST',
            data: $(form).serialize(),
            dataType: 'json',
            success: function(r) {
                if (r.msg) alert(r.msg);
                if (r.code === 1) window.location.href = (typeof Config !== 'undefined' && Config.moduleurl ? Config.moduleurl : '') + '/mes/material_category';
            },
            error: function() { alert('网络错误，请重试'); },
            complete: function() { submitBtn.prop('disabled', false); }
        });
    });
})();
</script>
