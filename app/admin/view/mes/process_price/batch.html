<div class="card card-outline card-primary">
    <div class="card-header">
        <h3 class="card-title">批量设置工序工价</h3>
    </div>
    <div class="card-body">
        <form id="form-batch" method="post" class="form-horizontal">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">产品型号 <span class="text-danger">*</span></label>
                <div class="col-sm-8">
                    <select name="model_ids[]" class="form-control select2" multiple="multiple" id="model_ids" required style="width: 100%;">
                        {volist name="modelList" id="vo"}
                        <option value="{$key}">{$vo}</option>
                        {/volist}
                    </select>
                    <small class="form-text text-muted">可多选，选择要设置工价的产品型号</small>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-sm-2 col-form-label">批量填充</label>
                <div class="col-sm-8">
                    <div class="form-row">
                        <div class="col-md-4 mb-2">
                            <input type="number" id="fill_price" class="form-control" step="0.01" min="0" placeholder="计件(元/件)">
                        </div>
                        <div class="col-md-4 mb-2">
                            <input type="number" id="fill_time_price" class="form-control" step="0.01" min="0" placeholder="计时(元/小时)">
                        </div>
                        <div class="col-md-4 mb-2">
                            <button type="button" class="btn btn-outline-primary btn-block" id="btn-fill-all">填充到已勾选工序</button>
                        </div>
                    </div>
                    <small class="form-text text-muted">先勾选要设置的工序，再用此处一键填充；也可以逐行填写不同工价</small>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-sm-2 col-form-label">工序工价 <span class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <div class="mb-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-check-all">全选</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-uncheck-all">全不选</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover table-sm" id="process-price-table">
                            <thead>
                            <tr>
                                <th style="width:60px;">选择</th>
                                <th>工序</th>
                                <th style="width:180px;">计件(元/件)</th>
                                <th style="width:180px;">计时(元/小时)</th>
                            </tr>
                            </thead>
                            <tbody>
                            {volist name="processList" id="vo"}
                            <tr>
                                <td class="text-center">
                                    <input type="checkbox" name="prices[{$key}][enabled]" value="1" class="pp-enabled" data-process-id="{$key}">
                                </td>
                                <td>{$vo}</td>
                                <td>
                                    <input type="number" name="prices[{$key}][price]" class="form-control form-control-sm pp-price" step="0.01" min="0" placeholder="0.00">
                                </td>
                                <td>
                                    <input type="number" name="prices[{$key}][time_price]" class="form-control form-control-sm pp-time-price" step="0.01" min="0" placeholder="0.00">
                                </td>
                            </tr>
                            {/volist}
                            </tbody>
                        </table>
                    </div>
                    <small class="form-text text-muted">按工序逐行设置工价；未勾选的工序不会提交</small>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-sm-10 offset-sm-2">
                    <div class="alert alert-info mb-0">
                        <i class="fas fa-info-circle"></i> 将为勾选的工序逐个设置工价，并对选中的所有型号生效：存在则更新，不存在则新增。
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-sm-8 offset-sm-2">
                    <button type="submit" class="btn btn-primary">批量设置</button>
                    <a href="{$config.moduleurl}/mes/process_price/index" class="btn btn-default">返回</a>
                </div>
            </div>
        </form>
    </div>
</div>
