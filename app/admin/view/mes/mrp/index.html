<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>缺料计算(MRP)</em> 按进行中订单汇总物料需求，减去当前库存</div>
    </div>
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-6">
                <label>指定订单ID（可选，逗号分隔；不填则按全部待生产/生产中订单）</label>
                <input type="text" id="order_ids" class="form-control" placeholder="如 1,2,3">
            </div>
            <div class="col-auto d-flex align-items-end">
                <button type="button" id="btn-query" class="btn btn-primary">计算缺料</button>
            </div>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
