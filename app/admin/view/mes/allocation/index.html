<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>分工分配管理</em> 管理生产任务的分工分配</div>
    </div>
    <div class="card-body">
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fas fa-sync-alt"></i> 刷新</a>
            <a href="{$config.moduleurl}/mes/allocation/add" class="btn btn-success btn-add" title="添加"><i class="fas fa-plus"></i> 添加分配</a>
            <a href="{$config.moduleurl}/mes/allocation/batch" class="btn btn-info btn-add" title="批量分配"><i class="fas fa-cogs"></i> 批量分配</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled" title="编辑"><i class="fas fa-edit"></i> 编辑</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled" title="删除"><i class="fas fa-trash-alt"></i> 删除</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
<!-- 查看二维码弹窗 -->
<div class="modal fade" id="qrcodeModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">任务二维码</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="关闭"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body text-center">
                <p class="text-muted small mb-2">员工扫码后可进入报工页面</p>
                <div id="qrcode-modal-img-wrap" class="mb-3"></div>
                <div class="input-group input-group-sm">
                    <input type="text" class="form-control" id="qrcode-modal-url" readonly>
                    <div class="input-group-append">
                        <button class="btn btn-outline-secondary" type="button" id="qrcode-modal-copy">复制链接</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-info" id="qrcode-modal-regenerate">重新生成</button>
            </div>
        </div>
    </div>
</div>
