<div class="card card-outline card-primary">
    <div class="card-header">
        <h3 class="card-title">批量分工分配</h3>
    </div>
    <div class="card-body">
        <form id="form-batch" method="post" class="form-horizontal" data-url="mes/allocation/batch" data-back="mes/allocation">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">订单 <span class="text-danger">*</span></label>
                <div class="col-sm-6">
                    <select name="order_id" class="form-control" id="order_id" required>
                        <option value="">请选择订单</option>
                        {volist name="orderList" id="vo"}
                        <option value="{$key}"{if isset($order_id) && $order_id == $key} selected{/if}>{$vo}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <input type="hidden" name="plan_id" id="plan_id" value="{$plan_id|default=''}">
            <script type="application/json" id="batch-process-list">{:json_encode($processList)}</script>
            <script type="application/json" id="batch-user-list">{:json_encode($userList)}</script>
            <div id="allocation-container" style="display: none;">
                <div class="form-group row">
                    <div class="col-sm-12">
                        <h5>分配列表</h5>
                        <table class="table table-bordered" id="allocation-table">
                            <thead>
                                <tr>
                                    <th width="30%">产品型号</th>
                                    <th width="20%">工序</th>
                                    <th width="20%">员工</th>
                                    <th width="15%">数量</th>
                                    <th width="15%">操作</th>
                                </tr>
                            </thead>
                            <tbody id="allocation-tbody">
                            </tbody>
                        </table>
                        <button type="button" class="btn btn-sm btn-success" id="btn-add-allocation">
                            <i class="fas fa-plus"></i> 添加分配
                        </button>
                    </div>
                </div>
            </div>
            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i> 提示：选择订单后，可以批量添加多个分工分配。每个分配需要指定型号、工序、员工和数量。
            </div>
            <div class="form-group row">
                <div class="col-sm-8 offset-sm-2">
                    <button type="button" id="btn-submit-batch" class="btn btn-primary">批量分配</button>
                    <a href="{$config.moduleurl}/mes/allocation/index" class="btn btn-default">返回</a>
                </div>
            </div>
        </form>
    </div>
</div>
