<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>工资统计</em> 按报工数据统计汇总与趋势（参考 scanwork）</div>
        <div class="card-tools">
            <a href="{:url('mes/wage/index')}" class="btn btn-sm btn-default"><i class="fas fa-list"></i> 工资明细</a>
        </div>
    </div>
    <div class="card-body">
        <!-- 筛选条件 -->
        <div class="card card-outline card-secondary mb-3">
            <div class="card-header py-2">
                <h5 class="card-title mb-0">筛选条件</h5>
            </div>
            <div class="card-body py-2">
                <form class="form-inline" id="search-form" action="javascript:;" onsubmit="return false;">
                    <label class="mr-2">开始日期</label>
                    <input type="date" class="form-control form-control-sm mr-3" id="start_date" name="start_date" value="{:date('Y-m-01')}">
                    <label class="mr-2">结束日期</label>
                    <input type="date" class="form-control form-control-sm mr-3" id="end_date" name="end_date" value="{:date('Y-m-d')}">
                    <label class="mr-2">员工</label>
                    <select class="form-control form-control-sm mr-3" id="user_id" name="user_id" style="min-width:120px;">
                        <option value="">全部员工</option>
                    </select>
                    <button type="button" class="btn btn-primary btn-sm mr-2" id="search-btn"><i class="fas fa-search"></i> 查询</button>
                    <button type="button" class="btn btn-success btn-sm" id="export-btn"><i class="fas fa-download"></i> 导出汇总</button>
                </form>
            </div>
        </div>

        <!-- 统计汇总卡片 -->
        <div class="row mb-3" id="summary-stats">
            <div class="col-md-3 col-6">
                <div class="info-box bg-primary">
                    <span class="info-box-icon"><i class="fas fa-users"></i></span>
                    <div class="info-box-content">
                        <span class="info-box-text">员工总数</span>
                        <span class="info-box-number" id="total-users">0</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="info-box bg-success">
                    <span class="info-box-icon"><i class="fas fa-cubes"></i></span>
                    <div class="info-box-content">
                        <span class="info-box-text">总报工数量</span>
                        <span class="info-box-number" id="total-quantity">0</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="info-box bg-warning">
                    <span class="info-box-icon"><i class="fas fa-yen-sign"></i></span>
                    <div class="info-box-content">
                        <span class="info-box-text">总工资金额</span>
                        <span class="info-box-number" id="total-wage">¥0.00</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="info-box bg-danger">
                    <span class="info-box-icon"><i class="fas fa-file-alt"></i></span>
                    <div class="info-box-content">
                        <span class="info-box-text">报工次数</span>
                        <span class="info-box-number" id="total-count">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 员工工资汇总表 -->
        <div class="card mb-3">
            <div class="card-header py-2">
                <h5 class="card-title mb-0">员工工资汇总</h5>
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-striped table-bordered table-hover mb-0">
                    <thead>
                        <tr>
                            <th>员工姓名</th>
                            <th>总报工数量</th>
                            <th>总工资金额</th>
                            <th>报工次数</th>
                            <th>平均工价</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="summary-table">
                        <tr><td colspan="6" class="text-center text-muted">请点击「查询」获取数据</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 图表区域：2x2 -->
        <div class="row mb-3">
            <div class="col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-header py-2">
                        <h5 class="card-title mb-0">工资趋势图</h5>
                    </div>
                    <div class="card-body">
                        <div id="chart-wage-trend" style="height: 320px;"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-header py-2">
                        <h5 class="card-title mb-0">报工数量趋势图</h5>
                    </div>
                    <div class="card-body">
                        <div id="chart-quantity-trend" style="height: 320px;"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-header py-2">
                        <h5 class="card-title mb-0">员工工资对比图</h5>
                    </div>
                    <div class="card-body">
                        <div id="chart-user-pie" style="height: 320px;"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-header py-2">
                        <h5 class="card-title mb-0">工序工资分布图</h5>
                    </div>
                    <div class="card-body">
                        <div id="chart-process-bar" style="height: 320px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.info-box { border-radius: 4px; }
.info-box-icon { width: 60px; text-align: center; font-size: 1.8rem; }
.info-box-content { padding: 5px 10px; }
.info-box-text { font-size: 0.9rem; }
.info-box-number { font-size: 1.4rem; font-weight: bold; }
</style>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
(function() {
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    function loadUsers() {
        $.get(base + '/mes/wage/getReportUsers', function(res) {
            if (res.code === 1 && res.data && res.data.list) {
                var html = '<option value="">全部员工</option>';
                res.data.list.forEach(function(u) {
                    html += '<option value="' + u.id + '">' + (u.nickname || '-') + '</option>';
                });
                $('#user_id').html(html);
            }
        }, 'json');
    }
    function loadSummary() {
        var params = $('#search-form').serialize();
        $.ajax({
            url: base + '/mes/wage/getSummary',
            type: 'POST',
            data: params,
            dataType: 'json',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        }).done(function(res) {
            if (res && res.code === 1 && res.data) {
                var t = res.data.total || {};
                $('#total-users').text(t.user_count || 0);
                $('#total-quantity').text(t.quantity || 0);
                $('#total-wage').text('¥' + parseFloat(t.wage || 0).toFixed(2));
                $('#total-count').text(t.count || 0);
                var summary = res.data.summary || [];
                var html = '';
                if (summary.length) {
                    summary.forEach(function(item) {
                        var q = parseFloat(item.total_quantity) || 0;
                        var w = parseFloat(item.total_wage) || 0;
                        var avg = q > 0 ? (w / q).toFixed(2) : '0.00';
                        var name = (item.user && item.user.nickname) ? item.user.nickname : '未知';
                        html += '<tr>';
                        html += '<td>' + name + '</td>';
                        html += '<td>' + item.total_quantity + '</td>';
                        html += '<td>¥' + parseFloat(item.total_wage).toFixed(2) + '</td>';
                        html += '<td>' + item.report_count + '</td>';
                        html += '<td>¥' + avg + '</td>';
                        html += '<td><a href="' + base + '/mes/wage/index?user_id=' + item.user_id + '" class="btn btn-xs btn-info">查看明细</a></td>';
                        html += '</tr>';
                    });
                } else {
                    html = '<tr><td colspan="6" class="text-center text-muted">暂无数据</td></tr>';
                }
                $('#summary-table').html(html);
            }
        }).fail(function(xhr) {
            if (xhr.responseText && xhr.responseText.indexOf('<!DOCTYPE') === 0) {
                console.error('getSummary 返回了 HTML 而非 JSON，请检查路由或权限');
            }
        });
    }
    function loadChart() {
        var params = $('#search-form').serialize();
        $.ajax({
            url: base + '/mes/wage/getChart',
            type: 'POST',
            data: params,
            dataType: 'json',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        }).done(function(res) {
            if (!res || res.code !== 1 || !res.data || typeof echarts === 'undefined') return;
            var d = res.data;
            var dates = d.dates || [];
            var wages = d.wages || [];
            var quantities = d.quantities || [];
            var byUser = d.by_user || [];
            var processNames = d.by_process_names || [];
            var processWages = d.by_process_wages || [];

            // 1. 工资趋势图（折线，工资金额）
            var el1 = document.getElementById('chart-wage-trend');
            if (el1) {
                var ch1 = echarts.init(el1);
                ch1.setOption({
                    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                    xAxis: { type: 'category', data: dates },
                    yAxis: { type: 'value', name: '工资金额(元)' },
                    series: [{ name: '工资金额', type: 'line', data: wages, smooth: true, itemStyle: { color: '#5470c6' } }]
                });
            }
            // 2. 报工数量趋势图（柱状）
            var el2 = document.getElementById('chart-quantity-trend');
            if (el2) {
                var ch2 = echarts.init(el2);
                ch2.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: dates },
                    yAxis: { type: 'value', name: '报工数量' },
                    series: [{ name: '报工数量', type: 'bar', data: quantities, itemStyle: { color: '#91cc75' } }]
                });
            }
            // 3. 员工工资对比图（饼图）
            var el3 = document.getElementById('chart-user-pie');
            if (el3) {
                var ch3 = echarts.init(el3);
                ch3.setOption({
                    tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
                    legend: { orient: 'vertical', left: 'left', top: 'middle' },
                    series: [{ name: '工资金额', type: 'pie', radius: ['40%', '70%'], data: byUser, emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0,0,0,0.2)' } } }]
                });
            }
            // 4. 工序工资分布图（柱状）
            var el4 = document.getElementById('chart-process-bar');
            if (el4) {
                var ch4 = echarts.init(el4);
                ch4.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: processNames, axisLabel: { rotate: processNames.length > 6 ? 30 : 0 } },
                    yAxis: { type: 'value', name: '工资金额(元)' },
                    series: [{ name: '工资金额', type: 'bar', data: processWages, itemStyle: { color: '#fac858' } }]
                });
            }
        }).fail(function(xhr) {
            if (xhr.responseText && xhr.responseText.indexOf('<!DOCTYPE') === 0) {
                console.error('getChart 返回了 HTML 而非 JSON');
            }
        });
    }
    loadUsers();
    $('#search-btn').on('click', function() {
        loadSummary();
        loadChart();
    });
    $('#export-btn').on('click', function() {
        var params = $('#search-form').serialize();
        window.open(base + '/mes/wage/export?' + params, '_blank');
    });
    loadSummary();
    loadChart();
})();
</script>
