{include file='common/meta' /}
<form id="form-add" class="form-horizontal" role="form" data-url="mes/material/add" data-back="mes/material">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">物料名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="" data-rule="required" placeholder="物料名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">物料编码</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[code]" value="" placeholder="留空自动生成">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">物料分类</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[category_id]">
                <option value="0">请选择分类</option>
                {volist name="categoryList" id="catName" key="catId"}
                <option value="{$catId}">{$catName}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">单位</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[unit]" value="pcs" placeholder="如 pcs、kg">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">当前价格</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" step="0.01" min="0" class="form-control" name="row[current_price]" value="0" placeholder="当前价格">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">最低库存</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" step="0.01" min="0" class="form-control" name="row[min_stock]" value="0" placeholder="最低库存预警">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]">
                <option value="active">启用</option>
                <option value="inactive">禁用</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[remark]" rows="2" placeholder="备注"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
{include file='common/script-iframe' /}
