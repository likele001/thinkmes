{include file='common/meta' /}
<form id="form-edit" class="form-horizontal" role="form" action="" method="post">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">物料名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="{$row.name|default=''}" data-rule="required" placeholder="物料名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">物料编码</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[code]" value="{$row.code|default=''}" placeholder="物料编码">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">单位</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[unit]" value="{$row.unit|default='pcs'}" placeholder="如 pcs、kg">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">当前价格</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" step="0.01" min="0" class="form-control" name="row[current_price]" value="{$row.current_price|default='0'}" placeholder="当前价格">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">最低库存</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" step="0.01" min="0" class="form-control" name="row[min_stock]" value="{$row.min_stock|default='0'}" placeholder="最低库存预警">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]">
                <option value="active" {if isset($row.status) && $row.status == 'active'}selected{/if}>启用</option>
                <option value="inactive" {if isset($row.status) && $row.status == 'inactive'}selected{/if}>禁用</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[remark]" rows="2" placeholder="备注">{$row.remark|default=''}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">保存</button>
            <button type="button" class="btn btn-default btn-embossed" onclick="window.parent.layer.closeAll();">取消</button>
        </div>
    </div>
</form>
<script>
$(function() {
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    var ids = '{$ids|default=""}';
    $('#form-edit').on('submit', function(e) {
        e.preventDefault();
        var data = $(this).serialize() + '&ids=' + encodeURIComponent(ids);
        $.post(base + '/mes/material/edit', data, function(r) {
            if (r.code == 1) {
                if (typeof Fast !== 'undefined' && Fast.api) Fast.api.close(); else alert(r.msg);
            } else {
                alert(r.msg || '保存失败');
            }
        }, 'json');
    });
});
</script>
{include file='common/script-iframe' /}
