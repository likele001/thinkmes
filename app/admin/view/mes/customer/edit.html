<form id="form-edit" class="form-horizontal" role="form" data-id="{$row.id|default=''}" data-module="mes/customer">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-customer_name" class="form-control" name="row[customer_name]" value="{$row.customer_name|default=''}" placeholder="请输入客户名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">登录账号<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-login_account" class="form-control" name="row[login_account]" value="{$row.login_account|default=''}" placeholder="用于客户前端登录的账号">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">登录密码</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-login_password" type="password" class="form-control" name="row[login_password]" value="" placeholder="留空则不修改">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">联系人</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contact_person" class="form-control" name="row[contact_person]" value="{$row.contact_person|default=''}" placeholder="请输入联系人">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">联系电话</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contact_phone" class="form-control" name="row[contact_phone]" value="{$row.contact_phone|default=''}" placeholder="请输入联系电话">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">地址</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address" class="form-control" name="row[address]" value="{$row.address|default=''}" placeholder="请输入地址">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" class="form-control" name="row[status]">
                <option value="1" {if isset($row.status) && $row.status==1}selected{/if}>正常</option>
                <option value="0" {if isset($row.status) && $row.status==0}selected{/if}>禁用</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">默认语言</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-default_lang" class="form-control" name="row[default_lang]">
                <option value="zh-cn" {if isset($row.default_lang) && $row.default_lang=='zh-cn'}selected{/if}>简体中文</option>
                <option value="en-us" {if isset($row.default_lang) && $row.default_lang=='en-us'}selected{/if}>English</option>
            </select>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
