<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>工艺路线管理</em> 按产品型号配置工序流程</div>
    </div>
    <div class="card-body">
        <div class="mb-2">
            <form class="form-inline" id="route-search-form">
                <div class="form-group mr-2 mb-2">
                    <label class="mr-1">产品型号：</label>
                    <select name="model_id" class="form-control" style="min-width:220px;">
                        <option value="">全部型号</option>
                        {foreach $modelList as $id => $name}
                        <option value="{$id}">{$name}</option>
                        {/foreach}
                    </select>
                </div>
                <div class="form-group mr-2 mb-2">
                    <label class="mr-1">状态：</label>
                    <select name="status" class="form-control">
                        <option value="">全部</option>
                        {foreach $statusList as $k => $v}
                        <option value="{$k}">{$v}</option>
                        {/foreach}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary mb-2">筛选</button>
            </form>
        </div>
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fas fa-sync-alt"></i> 刷新</a>
            <a href="{$config.moduleurl}/mes/process_route/add" class="btn btn-success btn-add" title="添加"><i class="fas fa-plus"></i> 添加路线</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled" title="编辑"><i class="fas fa-edit"></i> 编辑</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled" title="删除"><i class="fas fa-trash-alt"></i> 删除</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
