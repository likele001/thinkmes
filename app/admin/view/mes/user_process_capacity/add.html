<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加员工产能</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="mes/user_process_capacity/add" data-back="mes/user_process_capacity">
            <input type="hidden" name="tenant_id" value="{$tenant_id|default=0}">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">员工</label>
                <div class="col-sm-6">
                    <select name="row[user_id]" class="form-control" required>
                        <option value="">请选择员工</option>
                        {foreach $users as $id => $name}
                        <option value="{$id}">{$name} (#{$id})</option>
                        {/foreach}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">工序</label>
                <div class="col-sm-6">
                    <select name="row[process_id]" class="form-control" required>
                        <option value="">请选择工序</option>
                        {foreach $processes as $id => $name}
                        <option value="{$id}">{$name} (#{$id})</option>
                        {/foreach}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">日产能(件)</label>
                <div class="col-sm-6"><input type="number" name="row[capacity_per_day]" class="form-control" value="100" min="1" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/mes/user_process_capacity/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
