<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>订单管理</em> 管理工厂生产订单信息</div>
    </div>
    <div class="card-body">
        <div id="toolbar" class="toolbar mb-2 d-flex flex-wrap align-items-center gap-2">
            <div class="d-flex align-items-center">
                <label for="workflowStatusFilter" class="form-label mb-0 me-2">流程状态</label>
                <select id="workflowStatusFilter" class="form-select form-select-sm" style="width:150px;">
                    <option value="">全部流程</option>
                    <option value="not_started">未启动</option>
                    <option value="in_progress">进行中</option>
                    <option value="completed">已完成</option>
                </select>
            </div>
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fas fa-sync-alt"></i> 刷新</a>
            <a href="{$config.moduleurl}/mes/order/add" class="btn btn-success btn-add" title="添加"><i class="fas fa-plus"></i> 添加订单</a>
            <a href="{$config.moduleurl}/mes/order/import" class="btn btn-info" title="Excel批量导入"><i class="fas fa-file-excel"></i> Excel导入</a>
            <a href="{$config.moduleurl}/mes/order/downloadTemplate" class="btn btn-outline-secondary" title="下载模板"><i class="fas fa-download"></i> 下载模板</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled" title="编辑"><i class="fas fa-edit"></i> 编辑</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled" title="删除"><i class="fas fa-trash-alt"></i> 删除</a>
        </div>
        <div class="alert alert-info mb-3 py-2" style="font-size:0.95rem;">
            当前订单列表已支持工作流状态展示。
            <strong>“流程详情”</strong>按钮在工作流实例已启动时显示，若未启动请先点击“工序进度”查看订单详情并启动流程。
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>
