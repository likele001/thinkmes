<div class="card card-outline card-primary">
    <div class="card-header">
        <h3 class="card-title">编辑BOM</h3>
    </div>
    <div class="card-body">
        <form id="form-edit" method="post" class="form-horizontal" data-id="{$row.id|default=''}" data-module="mes/bom">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">BOM编号</label>
                <div class="col-sm-6">
                    <input type="text" name="row[bom_no]" class="form-control" value="{$row.bom_no|default=''}" placeholder="可留空自动生成">
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">BOM名称</label>
                <div class="col-sm-6">
                    <input type="text" name="row[bom_name]" class="form-control" value="{$row.bom_name|default=''}" placeholder="例如：电机A1型标准用料BOM">
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">BOM类型</label>
                <div class="col-sm-6">
                    <select name="row[bom_type]" class="form-control" id="bom_type">
                        {volist name="bomTypeList" id="t"}
                        <option value="{$key}" {if isset($row.bom_type) && $row.bom_type==$key}selected{/if}>{$t}</option>
                        {/volist}
                    </select>
                    <small class="form-text text-muted">「通用模板」用于跨产品复用物料清单，建议不绑定产品/型号。</small>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">产品</label>
                <div class="col-sm-6">
                    <select name="row[product_id]" class="form-control">
                        <option value="">请选择产品</option>
                        {volist name="productList" id="vo"}
                        <option value="{$key}" {if isset($row.product_id) && $row.product_id==$key}selected{/if}>{$vo}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">产品型号<span class="text-danger">*</span></label>
                <div class="col-sm-6">
                    <select name="row[model_id]" class="form-control" required>
                        <option value="">请选择产品型号</option>
                        {volist name="modelList" id="vo"}
                        <option value="{$key}" {if isset($row.model_id) && $row.model_id==$key}selected{/if}>{$vo}</option>
                        {/volist}
                    </select>
                    <small class="form-text text-muted">「通用（默认）」表示该 BOM 适用于该产品下所有型号。</small>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">版本号</label>
                <div class="col-sm-6">
                    <input type="text" name="row[version]" class="form-control" value="{$row.version|default='1.0'}" placeholder="例如：V1.0">
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">基准数量</label>
                <div class="col-sm-6">
                    <input type="number" name="row[base_quantity]" class="form-control" min="1" value="{$row.base_quantity|default='1'}" placeholder="一般填 1，表示做 1 件成品的用料">
                    <small class="form-text text-muted">基准数量指这张BOM对应的成品数量，一般填 1，表示“做 1 件成品需要的标准用料”，系统会按订单数量和这个基数自动放大物料用量。</small>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="0" {if isset($row.status) && $row.status==0}selected{/if}>草稿</option>
                        <option value="1" {if isset($row.status) && $row.status==1}selected{/if}>审核中</option>
                        <option value="2" {if isset($row.status) && $row.status==2}selected{/if}>已发布</option>
                        <option value="3" {if isset($row.status) && $row.status==3}selected{/if}>已废弃</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-sm-8 offset-sm-2">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="{$config.moduleurl}/mes/bom/index" class="btn btn-default">返回</a>
                </div>
            </div>
        </form>
    </div>
</div>
