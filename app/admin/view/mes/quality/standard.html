<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">质检标准管理</h3>
                <div class="card-tools">
                    <a href="{:url('/admin/mes/quality/addStandard')}" class="btn btn-sm btn-success"><i class="fas fa-plus"></i> 添加标准</a>
                    <form id="form-search" class="form-inline ml-2" action="{:url('mes/quality/standard')}" method="get">
                        <div class="input-group input-group-sm" style="width: 250px;">
                            <input type="text" name="search" class="form-control float-right" placeholder="搜索">
                            <div class="input-group-append">
                                <button type="submit" class="btn btn-default"><i class="fas fa-search"></i></button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="card-body table-responsive p-0">
                <table id="table" class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th><input type="checkbox" name="ids" value="" id="checkall" /></th>
                            <th>标准编号</th>
                            <th>标准名称</th>
                            <th>适用工序</th>
                            <th>适用型号</th>
                            <th>检查项数量</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="card-footer">
                <div id="pagination" class="float-right"></div>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-header">
                <h3 class="card-title">行业质检标准模板</h3>
                <span class="text-muted small">选择下方模板点击「复制」可生成到我的标准，再编辑名称、工序、检查项等</span>
            </div>
            <div class="card-body table-responsive p-0">
                <table id="table-templates" class="table table-bordered table-hover table-sm">
                    <thead>
                        <tr>
                            <th>模板名称</th>
                            <th>检查项数量</th>
                            <th>合格率</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
