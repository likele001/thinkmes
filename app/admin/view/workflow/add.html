{include file='common/meta' /}
<div class="card card-primary card-outline">
    <div class="card-header">
        <h3 class="card-title">添加工作流</h3>
        <div class="card-tools">
            <a href="{:url('workflow/index')}" class="btn btn-default btn-sm">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
        </div>
    </div>
    <div class="card-body">
        <form id="form-add" class="form-horizontal" role="form" data-url="workflow/add" data-back="workflow">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">流程名称<span class="text-danger">*</span></label>
                <div class="col-xs-12 col-sm-8">
                    <input class="form-control" name="name" value="" data-rule="required" placeholder="如：订单审批流程">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">流程代码<span class="text-danger">*</span></label>
                <div class="col-xs-12 col-sm-8">
                    <input class="form-control" name="code" value="" data-rule="required" placeholder="如：order_approval">
                    <small class="text-muted">唯一标识，只能包含字母、数字和下划线</small>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">所属模块<span class="text-danger">*</span></label>
                <div class="col-xs-12 col-sm-8">
                    <select class="form-control" name="module_code" data-rule="required">
                        <option value="">请选择模块</option>
                        {foreach name="modules" key="k" item="v"}
                        <option value="{$k}">{$v}</option>
                        {/foreach}
                    </select>
                    <small class="text-muted">选择此流程所属的业务模块</small>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">流程描述</label>
                <div class="col-xs-12 col-sm-8">
                    <textarea class="form-control" name="description" rows="3" placeholder="请输入流程描述"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">状态</label>
                <div class="col-xs-12 col-sm-8">
                    <select class="form-control" name="status">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>

            <div class="form-group layer-footer">
                <label class="control-label col-xs-12 col-sm-2"></label>
                <div class="col-xs-12 col-sm-8">
                    <button type="submit" class="btn btn-success btn-embossed">
                        <i class="fas fa-save"></i> 保存
                    </button>
                    <button type="reset" class="btn btn-default btn-embossed">
                        <i class="fas fa-redo"></i> 重置
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="card card-info card-outline mt-3">
    <div class="card-header">
        <h4 class="card-title"><i class="fas fa-info-circle"></i> 使用说明</h4>
    </div>
    <div class="card-body">
        <ol>
            <li>填写流程基本信息（名称、代码、模块）</li>
            <li>保存后点击"设计流程"按钮进入流程设计器</li>
            <li>拖拽节点（开始、审批、结束）到画布</li>
            <li>配置节点属性（审批人、审批类型等）</li>
            <li>连接节点形成完整的流程</li>
            <li>保存流程设计</li>
            <li>在模块配置中设置为默认流程</li>
        </ol>
    </div>
</div>
{include file='common/script' /}
