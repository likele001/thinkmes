{include file='common/meta' /}
<form id="form-add" class="form-horizontal" role="form" data-url="workflow/add" data-back="workflow">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">工作流名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="" data-rule="required" placeholder="如：订单审批流程">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">工作流标识<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[code]" value="" data-rule="required;alphaNum" placeholder="如：order_approval">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联表名<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[table_name]" value="" data-rule="required" placeholder="如：mes_order">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">初始状态<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[initial_state]" value="" data-rule="required" placeholder="如：pending">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">描述</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[description]" rows="3" placeholder="工作流说明"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]">
                <option value="active">启用</option>
                <option value="inactive">禁用</option>
            </select>
        </div>
    </div>
    
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">流程状态</label>
        <div class="col-xs-12 col-sm-10">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <button type="button" class="btn btn-sm btn-success add-state"><i class="fas fa-plus"></i> 添加状态</button>
                </div>
                <div class="panel-body states-container">
                    <div class="template-state" style="display:none;">
                        <div class="form-inline state-item mb-2" style="background:#f5f5f5;padding:10px;border-radius:4px;">
                            <input type="hidden" name="states[id][]" value="">
                            <div class="form-group mb-0 mr-2">
                                <label>状态标识：</label>
                                <input type="text" class="form-control input-sm" name="states[code][]" placeholder="如：approved" required>
                            </div>
                            <div class="form-group mb-0 mr-2">
                                <label>状态名称：</label>
                                <input type="text" class="form-control input-sm" name="states[name][]" placeholder="如：已审批" required>
                            </div>
                            <div class="form-group mb-0 mr-2">
                                <label>排序：</label>
                                <input type="number" class="form-control input-sm" name="states[sort][]" value="0" style="width:60px;">
                            </div>
                            <div class="form-group mb-0 mr-2">
                                <label>类型：</label>
                                <select class="form-control input-sm" name="states[type][]">
                                    <option value="normal">普通</option>
                                    <option value="start">开始</option>
                                    <option value="end">结束</option>
                                </select>
                            </div>
                            <button type="button" class="btn btn-sm btn-danger remove-state"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">流转规则</label>
        <div class="col-xs-12 col-sm-10">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <button type="button" class="btn btn-sm btn-success add-transition"><i class="fas fa-plus"></i> 添加流转规则</button>
                </div>
                <div class="panel-body transitions-container">
                    <div class="template-transition" style="display:none;">
                        <div class="form-inline transition-item mb-2" style="background:#f5f5f5;padding:10px;border-radius:4px;">
                            <input type="hidden" name="transitions[id][]" value="">
                            <div class="form-group mb-0 mr-2">
                                <label>源状态：</label>
                                <select class="form-control input-sm transition-from" name="transitions[from_state][]"></select>
                            </div>
                            <i class="fas fa-arrow-right mr-2"></i>
                            <div class="form-group mb-0 mr-2">
                                <label>目标状态：</label>
                                <select class="form-control input-sm transition-to" name="transitions[to_state][]"></select>
                            </div>
                            <div class="form-group mb-0 mr-2">
                                <label>操作名称：</label>
                                <input type="text" class="form-control input-sm" name="transitions[name][]" placeholder="如：提交审批" required>
                            </div>
                            <button type="button" class="btn btn-sm btn-danger remove-transition"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
<script>
$(function() {
    $('.add-state').on('click', function() {
        var html = $('.template-state').html();
        $(html).appendTo('.states-container').show();
    });
    $(document).on('click', '.remove-state', function() {
        $(this).closest('.state-item').remove();
    });
    
    $('.add-transition').on('click', function() {
        var html = $('.template-transition').html();
        var item = $(html).appendTo('.transitions-container').show();
        updateStateSelects();
    });
    $(document).on('click', '.remove-transition', function() {
        $(this).closest('.transition-item').remove();
    });
    
    function updateStateSelects() {
        var states = [];
        $('.state-item input[name="states[code][]"]').each(function() {
            states.push($(this).val());
        });
        var options = '<option value="">请选择</option>';
        states.forEach(function(code) {
            options += '<option value="' + code + '">' + code + '</option>';
        });
        $('.transition-from, .transition-to').each(function() {
            $(this).html(options);
        });
    }
});
</script>
