{include file='common/meta' /}
<form id="form-edit" class="form-horizontal" role="form" data-url="workflow/edit" data-back="workflow">
    <input type="hidden" name="row[id]" value="{$row.id}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">工作流名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="{$row.name}" data-rule="required" placeholder="如：订单审批流程">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">工作流标识<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[code]" value="{$row.code}" data-rule="required;alphaNum" placeholder="如：order_approval">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联表名<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[table_name]" value="{$row.table_name}" data-rule="required" placeholder="如：mes_order">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">初始状态<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[initial_state]" value="{$row.initial_state}" data-rule="required" placeholder="如：pending">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">描述</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[description]" rows="3" placeholder="工作流说明">{$row.description}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]">
                <option value="active" {$row.status == 'active' ? 'selected' : ''}>启用</option>
                <option value="inactive" {$row.status == 'inactive' ? 'selected' : ''}>禁用</option>
            </select>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
{include file='common/script-iframe' /}
