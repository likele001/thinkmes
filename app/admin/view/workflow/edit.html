{include file='common/meta' /}
<form id="form-edit" class="form-horizontal" role="form" data-url="workflow/edit" data-back="workflow">
    <input type="hidden" name="row[id]" value="{$row.id}">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">工作流名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="{$row.name}" data-rule="required" placeholder="如：订单审批流程">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">工作流标识<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[code]" value="{$row.code}" data-rule="required;alphaNum" placeholder="如：order_approval">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联表名<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[table_name]" id="workflow-table-name" data-rule="required">
                <option value="">请选择关联表</option>
                <option value="mes_order" {$row.table_name == 'mes_order' ? 'selected' : ''}>mes_order</option>
                <option value="mes_purchase" {$row.table_name == 'mes_purchase' ? 'selected' : ''}>mes_purchase</option>
                <option value="mes_production" {$row.table_name == 'mes_production' ? 'selected' : ''}>mes_production</option>
                <option value="mes_inventory" {$row.table_name == 'mes_inventory' ? 'selected' : ''}>mes_inventory</option>
                <option value="mes_material" {$row.table_name == 'mes_material' ? 'selected' : ''}>mes_material</option>
            </select>
            <small class="form-text text-muted">请选择该工作流对应的业务表名，系统会自动根据表名提供标题字段选择，避免写错。</small>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">标题字段<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[title_field]" id="workflow-title-field" data-rule="required" disabled>
                <option value="">请选择标题字段</option>
            </select>
            <small class="form-text text-muted">先选择关联表名，再从下拉列表选择标题字段。该字段用作流程实例标题，不能随意填写。</small>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">初始状态<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[initial_state]" id="workflow-initial-state" data-rule="required" disabled>
                <option value="">请先加载已定义状态</option>
            </select>
            <small class="form-text text-muted">系统会自动加载当前工作流已定义的状态标识，选择其中一个作为初始状态。</small>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">描述</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[description]" rows="3" placeholder="工作流说明">{$row.description}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]">
                <option value="active" {$row.status == 'active' ? 'selected' : ''}>启用</option>
                <option value="inactive" {$row.status == 'inactive' ? 'selected' : ''}>禁用</option>
            </select>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
<script>
$(function() {
    var workflowTableFields = {
        mes_order: ['order_no', 'order_name', 'name'],
        mes_purchase: ['purchase_no', 'name'],
        mes_production: ['production_no', 'name'],
        mes_inventory: ['inventory_no', 'name'],
        mes_material: ['material_no', 'name']
    };

    function updateTitleFieldOptions() {
        var tableName = $('#workflow-table-name').val();
        var fields = workflowTableFields[tableName] || [];
        var html = '<option value="">请选择标题字段</option>';
        fields.forEach(function(field) {
            html += '<option value="' + field + '"' + (field === '{$row.title_field}' ? ' selected' : '') + '>' + field + '</option>';
        });
        $('#workflow-title-field').html(html).prop('disabled', fields.length === 0);
    }

    function updateInitialStateOptions(states) {
        var selected = '{$row.initial_state}';
        if (!states || states.length === 0) {
            $('#workflow-initial-state').html('<option value="">请先在工作流定义中添加状态</option>').prop('disabled', true);
            return;
        }
        var html = '<option value="">请选择初始状态</option>';
        states.forEach(function(code) {
            html += '<option value="' + code + '"' + (code === selected ? ' selected' : '') + '>' + code + '</option>';
        });
        $('#workflow-initial-state').html(html).prop('disabled', false);
    }

    function loadWorkflowStates() {
        var workflowId = '{$row.id}';
        if (!workflowId) {
            return;
        }
        $.getJSON('workflow/getStates', {workflow_id: workflowId}, function(res) {
            if (res.code === 0 && Array.isArray(res.data)) {
                var states = res.data.map(function(item) {
                    return item.code;
                }).filter(function(code) {
                    return code;
                });
                updateInitialStateOptions(states);
            }
        });
    }

    $('#workflow-table-name').on('change', function() {
        updateTitleFieldOptions();
    });

    updateTitleFieldOptions();
    loadWorkflowStates();
});
</script>
{include file='common/script-iframe' /}
