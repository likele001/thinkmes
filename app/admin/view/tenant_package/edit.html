<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">{:__('edit_package')}</h3></div>
    <div class="card-body">
        <form id="form-edit" method="post" class="form-horizontal">
            <input type="hidden" name="id" value="{$data.id}">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('package_name')}</label>
                <div class="col-sm-6"><input type="text" name="name" class="form-control" value="{$data.name}" required placeholder="{:__('required_placeholder')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('max_admin')}</label>
                <div class="col-sm-6"><input type="number" name="max_admin" class="form-control" value="{$data.max_admin}" min="0" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('max_user')}</label>
                <div class="col-sm-6"><input type="number" name="max_user" class="form-control" value="{$data.max_user}" min="0" required></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('default_validity_days')}</label>
                <div class="col-sm-6"><input type="number" name="expire_days" class="form-control" value="{$data.expire_days}" placeholder="{:__('placeholder_permanent')}" min="1"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">套餐价格</label>
                <div class="col-sm-6">
                    <div class="input-group">
                        <input type="number" name="price" class="form-control" value="{$data.price}" min="0" step="0.01" required>
                        <div class="input-group-append"><span class="input-group-text">元</span></div>
                    </div>
                    <small class="text-muted">用于租户购买时显示，0表示免费</small>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('sort')}</label>
                <div class="col-sm-6"><input type="number" name="sort" class="form-control" value="{$data.sort}"></div>
            </div>
            <div class="form-group row">
                <div class="col-sm-6 offset-sm-2">
                    <button type="submit" class="btn btn-primary">{:__('save')}</button>
                    <a href="{:url('tenant_package/index')}" class="btn btn-default ml-2">{:__('back')}</a>
                </div>
            </div>
        </form>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    var L = (typeof Config !== 'undefined' && Config.lang) ? Config.lang : {};
    var form = document.getElementById('form-edit');
    form.setAttribute('action', base + '/tenant_package/edit');
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var action = form.getAttribute('action');
        var fd = new FormData(form);
        fetch(action, {
            method: 'POST',
            body: fd,
        }).then(function (res) { return res.json(); }).then(function (r) {
            alert(r.msg || (r.code === 1 ? (L.save_success || '保存成功') : (L.save_fail || '保存失败')));
            if (r.code === 1) location.href = base + '/tenant_package/index';
        }).catch(function () {
            alert(L.request_failed || '请求失败，请检查网络连接');
        });
    });
});
</script>
