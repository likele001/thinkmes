<div class="card panel-intro">

    </div>
    <div class="card-body">
        <div class="mb-3">
            <textarea id="question" class="form-control" rows="2" placeholder="输入问题，如：今天完成了多少订单？"></textarea>
            <button type="button" id="btn-ask" class="btn btn-primary mt-2"><i class="fas fa-paper-plane"></i> 提问</button>

        <div id="answer-area" class="alert alert-info" style="display:none;"></div>

    </div>
