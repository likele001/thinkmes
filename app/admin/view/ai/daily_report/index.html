<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>AI 生产日报</em> 自动生成日报/周报总结</div>
    </div>
    <div class="card-body">
        <div id="toolbar" class="mb-3">
            <span class="mr-2">日期：</span>
            <input type="date" id="report-date" class="form-control form-control-sm d-inline-block" style="width:140px;">
            <button type="button" id="btn-gen-daily" class="btn btn-primary btn-sm ml-2"><i class="fas fa-calendar-day"></i> 生成日报</button>
            <button type="button" id="btn-gen-weekly" class="btn btn-outline-primary btn-sm ml-2"><i class="fas fa-calendar-week"></i> 生成周报</button>
            <span class="text-muted small ml-2">根据当日/当周报工与订单数据由 AI 生成总结</span>
        </div>
        <table id="table" class="table table-striped table-bordered"></table>
        <!-- 关闭按钮用 id + JS 显式绑定，避免在 iframe 内 data-dismiss 失效 -->
        <div class="modal fade" id="content-modal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">报告全文</h5>
                        <button type="button" class="close" id="content-modal-btn-close-x" aria-label="关闭"><span>&times;</span></button>
                    </div>
                    <div class="modal-body" id="content-modal-body" style="white-space:pre-wrap;"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="content-modal-btn-close">关闭</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
