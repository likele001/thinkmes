<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>语音报工</em> 语音→文字→自动填充报工</div>
    </div>
    <div class="card-body">
        <div class="alert alert-info mb-3">

        </ul>
        <a href="{:url('/admin/ai/config/index')}?ref=addtabs" class="btn btn-primary">
            <i class="fa fa-cog"></i> 前往配置 AI 与语音识别

    </div>
</div>
