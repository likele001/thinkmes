<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加点检记录</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">设备</label>
                <div class="col-sm-6">
                    <select name="row[equipment_id]" class="form-control" required>
                        <option value="">请选择</option>
                        {volist name="equipmentList" id="eq"}
                        <option value="{$eq.id}">{$eq.code} - {$eq.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">点检日期</label>
                <div class="col-sm-6"><input type="date" name="row[check_date]" class="form-control" required value="{:date('Y-m-d')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">检查人</label>
                <div class="col-sm-6"><input type="text" name="row[checker]" class="form-control" placeholder="检查人"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">结果</label>
                <div class="col-sm-6">
                    <select name="row[result]" class="form-control">
                        <option value="1">合格</option>
                        <option value="0">不合格</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">点检内容</label>
                <div class="col-sm-6"><textarea name="row[content]" class="form-control" rows="4" placeholder="点检内容"></textarea></div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/equipment/check/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
<script>
(function() {
    if (typeof jQuery === 'undefined') { setTimeout(arguments.callee, 50); return; }
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    $('#form-add').on('submit', function(e) {
        e.preventDefault();
        $.post(base + '/equipment/check/add', $(this).serialize(), function(r) {
            if (r.code == 1) { alert(r.msg || '添加成功'); location.href = base + '/equipment/check/index'; }
            else alert(r.msg || '添加失败');
        }, 'json');
    });
})();
</script>
