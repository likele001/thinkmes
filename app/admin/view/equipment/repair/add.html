<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">添加维修记录</h3></div>
    <div class="card-body">
        <form id="form-add" method="post" class="form-horizontal" data-url="equipment/repair/add" data-back="equipment/repair">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">设备</label>
                <div class="col-sm-6">
                    <select name="row[equipment_id]" class="form-control" required>
                        <option value="">请选择</option>
                        {volist name="equipmentList" id="eq"}
                        <option value="{$eq.id}">{$eq.code} - {$eq.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">故障描述</label>
                <div class="col-sm-6"><textarea name="row[fault_desc]" class="form-control" rows="3" placeholder="故障描述"></textarea></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">维修日期</label>
                <div class="col-sm-6"><input type="date" name="row[repair_date]" class="form-control" value="{:date('Y-m-d')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">维修结果</label>
                <div class="col-sm-6"><input type="text" name="row[repair_result]" class="form-control" placeholder="维修结果"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">费用(元)</label>
                <div class="col-sm-6"><input type="number" name="row[cost]" class="form-control" step="0.01" placeholder="0"></div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button type="submit" form="form-add" class="btn btn-primary">确定添加</button>
        <a href="{$config.moduleurl}/equipment/repair/index" class="btn btn-default ml-2">返回</a>
    </div>
</div>
