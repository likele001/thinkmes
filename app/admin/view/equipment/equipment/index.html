<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>设备档案</em> 管理设备基础信息</div>
    </div>
    <div class="card-body">
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fas fa-sync-alt"></i> 刷新</a>
            <a href="{$config.moduleurl}/equipment/equipment/add" class="btn btn-success btn-add" title="添加"><i class="fas fa-plus"></i> 添加设备</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled" title="编辑"><i class="fas fa-edit"></i> 编辑</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled" title="删除"><i class="fas fa-trash-alt"></i> 删除</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>

<script>
(function init() {
    if (typeof window.jQuery === 'undefined' || !window.jQuery.fn || typeof window.jQuery.fn.bootstrapTable !== 'function') {
        setTimeout(init, 50);
        return;
    }
    var $ = window.jQuery;
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    var $table = $('#table');
    function fmtTime(v) {
        if (v === null || v === undefined || v === '') return '';
        var n = Number(v);
        if (!isNaN(n) && isFinite(n)) {
            return new Date((n > 1e12 ? n : n * 1000)).toLocaleString('zh-CN');
        }
        return String(v);
    }
    if (typeof $table.bootstrapTable !== 'function' || $table.data('bootstrap.table')) {
        return;
    }
    $table.bootstrapTable({
        url: base + '/equipment/equipment/index',
        pk: 'id',
        sortName: 'id',
        sortOrder: 'desc',
        pagination: true,
        sidePagination: 'server',
        pageSize: 20,
        pageList: [10, 20, 50],
        responseHandler: function (res) {
            var data = res.data || {};
            return {
                total: data.total || 0,
                rows: data.list || []
            };
        },
        columns: [
            {field: 'id', title: 'ID', width: 80, sortable: true},
            {field: 'code', title: '设备编号', align: 'left'},
            {field: 'name', title: '设备名称', align: 'left'},
            {field: 'category', title: '分类', width: 100},
            {field: 'model', title: '型号规格', width: 120},
            {field: 'status', title: '状态', width: 90, formatter: function(value) {
                var map = {1: '正常', 0: '停用', 2: '维修中'};
                var cls = {1: 'success', 0: 'secondary', 2: 'warning'};
                return '<span class="badge badge-' + (cls[value] || 'secondary') + '">' + (map[value] ?? '未知') + '</span>';
            }},
            {field: 'install_date', title: '安装日期', width: 120},
            {field: 'create_time', title: '创建时间', width: 160, formatter: fmtTime},
            {field: 'operate', title: '操作', width: 120, events: {
                'click .btn-edit': function(e, value, row) {
                    location.href = base + '/equipment/equipment/edit?id=' + row.id;
                },
                'click .btn-del': function(e, value, row) {
                    if (confirm('确定要删除吗？')) {
                        $.post(base + '/equipment/equipment/del', {ids: row.id}, function(r) {
                            if (r.code == 1) {
                                $table.bootstrapTable('refresh');
                                alert(r.msg || '删除成功');
                            } else {
                                alert(r.msg || '删除失败');
                            }
                        }, 'json');
                    }
                }
            }, formatter: function(value, row) {
                return '<a href="' + base + '/equipment/equipment/edit?id=' + row.id + '" class="btn btn-xs btn-success btn-edit">编辑</a> ' +
                       '<a href="javascript:;" class="btn btn-xs btn-danger btn-del">删除</a>';
            }}
        ]
    });
    $(document).off('click', '#toolbar .btn-refresh').on('click', '#toolbar .btn-refresh', function() {
        $table.bootstrapTable('refresh');
    });
    $(document).off('click', '#toolbar .btn-edit').on('click', '#toolbar .btn-edit', function() {
        var rows = $table.bootstrapTable('getSelections');
        if (rows.length != 1) {
            alert('请选择一条记录');
            return;
        }
        location.href = base + '/equipment/equipment/edit?id=' + rows[0].id;
    });
    $(document).off('click', '#toolbar .btn-del').on('click', '#toolbar .btn-del', function() {
        var rows = $table.bootstrapTable('getSelections');
        if (rows.length === 0) {
            alert('请选择要删除的记录');
            return;
        }
        if (!confirm('确定要删除选中的 ' + rows.length + ' 条记录吗？')) return;
        var ids = rows.map(function(r) { return r.id; });
        $.post(base + '/equipment/equipment/del', {ids: ids}, function(r) {
            if (r.code == 1) {
                $table.bootstrapTable('refresh');
                alert(r.msg || '删除成功');
            } else {
                alert(r.msg || '删除失败');
            }
        }, 'json');
    });
})();
</script>
