<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">编辑设备</h3></div>
    <div class="card-body">
        <form id="form-edit" method="post" class="form-horizontal">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">设备编号</label>
                <div class="col-sm-6"><input type="text" name="row[code]" class="form-control" required value="{$row.code|default=''}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">设备名称</label>
                <div class="col-sm-6"><input type="text" name="row[name]" class="form-control" required value="{$row.name|default=''}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">分类</label>
                <div class="col-sm-6"><input type="text" name="row[category]" class="form-control" value="{$row.category|default=''}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">型号规格</label>
                <div class="col-sm-6"><input type="text" name="row[model]" class="form-control" value="{$row.model|default=''}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-6">
                    <select name="row[status]" class="form-control">
                        <option value="1" {eq name="row.status" value="1"}selected{/eq}>正常</option>
                        <option value="0" {eq name="row.status" value="0"}selected{/eq}>停用</option>
                        <option value="2" {eq name="row.status" value="2"}selected{/eq}>维修中</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">安装日期</label>
                <div class="col-sm-6"><input type="date" name="row[install_date]" class="form-control" value="{$row.install_date|default=''}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">备注</label>
                <div class="col-sm-6"><textarea name="row[remark]" class="form-control" rows="3">{$row.remark|default=''}</textarea></div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <div class="row">
            <div class="col-sm-6 offset-sm-2">
                <button type="submit" form="form-edit" class="btn btn-primary">保存</button>
                <a href="{$config.moduleurl}/equipment/equipment/index" class="btn btn-default ml-2">返回列表</a>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    if (typeof jQuery === 'undefined') { setTimeout(arguments.callee, 50); return; }
    var $ = jQuery;
    var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
    $('#form-edit').on('submit', function(e) {
        e.preventDefault();
        $.post(base + '/equipment/equipment/edit?ids=' + '{$row.id|default=0}', $(this).serialize(), function(r) {
            if (r.code == 1) {
                alert(r.msg || '保存成功');
                location.href = base + '/equipment/equipment/index';
            } else {
                alert(r.msg || '保存失败');
            }
        }, 'json');
    });
})();
</script>
