<div class="card card-outline card-primary">
    <div class="card-header"><h3 class="card-title">{:__('edit_title')}</h3></div>
    <div class="card-body">
        <form id="form-edit" method="post" class="form-horizontal">
            <input type="hidden" name="id" value="{$data.id|default=0}">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('username')}</label>
                <div class="col-sm-6"><input type="text" name="username" class="form-control" value="{$data.username|default=''}" readonly></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('password')}</label>
                <div class="col-sm-6"><input type="password" name="password" class="form-control" placeholder="{:__('placeholder_password_leave')}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('nickname')}</label>
                <div class="col-sm-6"><input type="text" name="nickname" class="form-control" value="{$data.nickname|default=''}"></div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('parent_admin')}</label>
                <div class="col-sm-6">
                    <select name="pid" class="form-control">
                        <option value="0">{:__('none_top')}</option>
                        {volist name="parents" id="p"}
                        <option value="{$p.id}" {if condition="$data.pid == $p.id"}selected{/if}>{$p.username}（{$p.nickname|default='-'}）</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('data_scope')}</label>
                <div class="col-sm-6">
                    <select name="data_scope" class="form-control">
                        <option value="1" {if condition="$data.data_scope == 1"}selected{/if}>{:__('scope_self')}</option>
                        <option value="2" {if condition="$data.data_scope == 2"}selected{/if}>{:__('scope_sub')}</option>
                        <option value="3" {if condition="$data.data_scope == 3"}selected{/if}>{:__('scope_all')}</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('role')}</label>
                <div class="col-sm-6">
                    <select name="role_ids[]" class="form-control" multiple>
                        {volist name="roles" id="r"}
                        <option value="{$r.id}" {if condition="in_array($r.id, $roleIdsArr)"}selected{/if}>{$r.name}</option>
                        {/volist}
                    </select>
                    <small class="text-muted">{:__('role_hint')}</small>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">{:__('status')}</label>
                <div class="col-sm-6">
                    <select name="status" class="form-control">
                        <option value="1" {if condition="$data.status == 1"}selected{/if}>{:__('status_normal')}</option>
                        <option value="0" {if condition="$data.status == 0"}selected{/if}>{:__('status_disabled')}</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-sm-6 offset-sm-2">
                    <button type="submit" class="btn btn-primary">{:__('save')}</button>
                    <a href="{:url('admin/index')}" class="btn btn-default ml-2">{:__('back')}</a>
                </div>
            </div>
        </form>
    </div>
</div>
<script>
(function() {
    function initForm() {
        if (typeof jQuery === 'undefined') {
            setTimeout(initForm, 50);
            return;
        }
        var $ = jQuery;
        var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
        $('#form-edit').attr('action', base + '/admin/edit');
        $('#form-edit').on('submit', function (e) {
            e.preventDefault();
            $.post($(this).attr('action'), $(this).serialize(), function (r) {
                if (r && r.msg) {
                    alert(r.msg);
                }
                if (r && r.code === 1) {
                    var redirectUrl = (typeof Config !== 'undefined' && Config.table_index_url) ? Config.table_index_url : (base + '/admin/index');
                    location.href = redirectUrl;
                }
            }, 'json').fail(function(xhr) {
                try {
                    var r = JSON.parse(xhr.responseText);
                    alert(r.msg || (typeof Config !== 'undefined' && Config.lang && Config.lang.op_failed ? Config.lang.op_failed : '操作失败'));
                } catch(e) {
                    alert(typeof Config !== 'undefined' && Config.lang && Config.lang.op_failed ? Config.lang.op_failed : '操作失败');
                }
            });
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initForm);
    } else {
        initForm();
    }
})();
</script>
