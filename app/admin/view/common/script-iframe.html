<script src="/assets/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/lib/bootstrap-table/js/bootstrap-table.min.js"></script>
<script src="/assets/lib/fontawesome/js/all.min.js"></script>
<script src="/assets/lib/layui/layui.js?v={:time()}"></script>
<script src="/assets/js/backend-loader.js"></script>
<script src="/assets/lib/fastadmin-addtabs/jquery.addtabs.js"></script>
<script>
(function() {
    if (typeof layui === 'undefined') return;
    layui.use('layer', function() {
        var layer = layui.layer;
        window.__nativeAlert = window.__nativeAlert || window.alert;
        window.__nativeConfirm = window.__nativeConfirm || window.confirm;

        window.alert = function(msg) {
            var s = String(msg || '');
            var icon = -1, time = 2000;
            if (/成功|完成|已保存|已删除|已更新|已取消|已支付|已安装|已卸载/.test(s)) icon = 1;
            else if (/失败|错误|异常|不能|无法|禁止|超出|不存在|格式/.test(s)) { icon = 2; time = 3000; }
            else if (/请选择|请输入|请填写|请先|请至少|确认|注意|警告/.test(s)) { icon = 0; time = 2500; }
            layer.msg(s, {icon: icon, time: time, anim: 0});
        };

        window.$confirm = function(msg, yesFn, noFn) {
            layer.confirm(String(msg || ''), {icon: 3, title: '提示', btn: ['确定', '取消']}, function(idx) {
                layer.close(idx);
                if (typeof yesFn === 'function') yesFn();
            }, function(idx) {
                layer.close(idx);
                if (typeof noFn === 'function') noFn();
            });
        };
    });
})();
</script>
