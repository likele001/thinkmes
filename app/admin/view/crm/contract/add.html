<form id="form-add" class="form-horizontal" role="form" action="" method="post">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-customer_id" class="form-control" name="row[customer_id]">
                <option value="">请选择客户</option>
                {volist name="customers" id="c"}
                <option value="{$c.id}">{$c.name}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联商机</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-opportunity_id" class="form-control" name="row[opportunity_id]">
                <option value="">请选择商机（可选）</option>
                {volist name="opportunities" id="o"}
                <option value="{$o.id}">{$o.name}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同编号<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contract_no" class="form-control" name="row[contract_no]" value="" placeholder="请输入合同编号">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同金额</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" type="number" step="0.01" class="form-control" name="row[amount]" value="" placeholder="请输入合同金额">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">签约日期</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sign_date" type="date" class="form-control" name="row[sign_date]" value="" placeholder="签约日期">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" class="form-control" name="row[status]">
                <option value="draft" selected>草稿</option>
                <option value="performing">执行中</option>
                <option value="completed">已完成</option>
                <option value="terminated">已终止</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-remark" class="form-control" name="row[remark]" rows="3" placeholder="备注信息"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('form-add');
    if (!form) return;

    var submitBtn = form.querySelector('button[type="submit"]');
    var customerSelect = form.querySelector('[name="row[customer_id]"]');
    var opportunitySelect = form.querySelector('[name="row[opportunity_id]"]');

    // 客户选择变化时，更新商机列表
    if (customerSelect) {
        customerSelect.addEventListener('change', function() {
            var customerId = this.value;
            if (customerId) {
                var base = (window.Config && Config.moduleurl) ? Config.moduleurl : '/admin';
                var xhr = new XMLHttpRequest();
                xhr.open('GET', base + '/crm/opportunity/getByCustomer?customer_id=' + customerId, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        try {
                            var r = JSON.parse(xhr.responseText);
                            if (r.code === 1 && r.data) {
                                opportunitySelect.innerHTML = '<option value="">请选择商机（可选）</option>';
                                r.data.forEach(function(op) {
                                    var option = document.createElement('option');
                                    option.value = op.id;
                                    option.textContent = op.name;
                                    opportunitySelect.appendChild(option);
                                });
                            }
                        } catch(e) {}
                    }
                };
                xhr.send();
            } else {
                opportunitySelect.innerHTML = '<option value="">请选择商机（可选）</option>';
            }
        });
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        var customerId = form.querySelector('[name="row[customer_id]"]').value || '';
        var contractNo = form.querySelector('[name="row[contract_no]"]').value || '';

        if (!customerId) {
            alert('请选择客户');
            return;
        }
        if (!contractNo.trim()) {
            alert('请输入合同编号');
            return;
        }

        if (submitBtn) {
            submitBtn.disabled = true;
        }

        var xhr = new XMLHttpRequest();
        xhr.open('POST', form.getAttribute('action') || window.location.href, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (submitBtn) {
                    submitBtn.disabled = false;
                }
                if (xhr.status >= 200 && xhr.status < 300) {
                    var r;
                    try {
                        r = JSON.parse(xhr.responseText);
                    } catch (e) {
                        alert('返回数据格式错误');
                        return;
                    }
                    if (r.msg) {
                        alert(r.msg);
                    }
                    if (r.code === 1) {
                        var base = (window.Config && Config.moduleurl) ? Config.moduleurl : '/admin';
                        window.location.href = base + '/crm/contract/index';
                    }
                } else {
                    alert('网络错误，请重试');
                }
            }
        };
        xhr.send(new URLSearchParams(new FormData(form)).toString());
    });
});
</script>
