<form id="form-edit" class="form-horizontal" role="form" action="" method="post" data-id="{$row.id}" data-module="crm/contract">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-customer_id" class="form-control" name="row[customer_id]">
                <option value="">请选择客户</option>
                {volist name="customers" id="c"}
                <option value="{$c.id}" {if condition="$row.customer_id==$c.id"}selected{/if}>{$c.name}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联商机</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-opportunity_id" class="form-control" name="row[opportunity_id]">
                <option value="">请选择商机（可选）</option>
                {volist name="opportunities" id="o"}
                <option value="{$o.id}" {if condition="$row.opportunity_id==$o.id"}selected{/if}>{$o.name}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同编号<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contract_no" class="form-control" name="row[contract_no]" value="{$row.contract_no|default=''}" placeholder="请输入合同编号">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同金额</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" type="number" step="0.01" class="form-control" name="row[amount]" value="{$row.amount|default=''}" placeholder="请输入合同金额">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">签约日期</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sign_date" type="date" class="form-control" name="row[sign_date]" value="{if condition='$row.sign_date'}{$row.sign_date|date='Y-m-d',###}{/if}" placeholder="签约日期">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" class="form-control" name="row[status]">
                <option value="draft" {if condition="$row.status=='draft'"}selected{/if}>草稿</option>
                <option value="performing" {if condition="$row.status=='performing'"}selected{/if}>执行中</option>
                <option value="completed" {if condition="$row.status=='completed'"}selected{/if}>已完成</option>
                <option value="terminated" {if condition="$row.status=='terminated'"}selected{/if}>已终止</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-remark" class="form-control" name="row[remark]" rows="3" placeholder="备注信息">{$row.remark|default=''}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
