<form id="form-edit" class="form-horizontal" role="form" action="" method="post" data-id="{$row.id}" data-module="crm/customer_tag">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">标签名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="{$row.name|default=''}" placeholder="请输入标签名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">颜色</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[color]" value="{$row.color|default='#007bff'}" placeholder="如 #007bff">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="row[sort]" value="{$row.sort|default=0}" placeholder="数字越小越靠前">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
