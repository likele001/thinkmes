<form id="form-add" class="form-horizontal" role="form" action="" method="post">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">标签名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="" placeholder="请输入标签名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">颜色</label>
        <div class="col-xs-12 col-sm-8">
            <input type="text" class="form-control" name="row[color]" value="#007bff" placeholder="如 #007bff">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">排序</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" class="form-control" name="row[sort]" value="0" placeholder="数字越小越靠前">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('form-add');
    if (!form) return;
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = form.querySelector('[name="row[name]"]').value || '';
        if (!name.trim()) { alert('请输入标签名称'); return; }
        var btn = form.querySelector('button[type="submit"]');
        if (btn) btn.disabled = true;
        var xhr = new XMLHttpRequest();
        xhr.open('POST', form.getAttribute('action') || window.location.href, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (btn) btn.disabled = false;
                if (xhr.status >= 200 && xhr.status < 300) {
                    var r; try { r = JSON.parse(xhr.responseText); } catch (e) { alert('返回数据格式错误'); return; }
                    if (r.msg) alert(r.msg);
                    if (r.code === 1) { var base = (window.Config && Config.moduleurl) ? Config.moduleurl : '/admin'; window.location.href = base + '/crm/customer_tag/index'; }
                } else alert('网络错误，请重试');
            }
        };
        xhr.send(new URLSearchParams(new FormData(form)).toString());
    });
});
</script>
