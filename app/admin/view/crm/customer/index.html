<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>客户管理</em> 管理客户信息</div>
    </div>
    <div class="card-body">
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fas fa-sync-alt"></i> 刷新</a>
            <a href="{$config.moduleurl}/crm/customer/add" class="btn btn-success btn-add" title="添加"><i class="fas fa-plus"></i> 添加客户</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled" title="编辑"><i class="fas fa-edit"></i> 编辑</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled" title="删除"><i class="fas fa-trash-alt"></i> 删除</a>
        </div>
        <div class="form-inline mb-2">
            <input type="text" id="filter-name" class="form-control form-control-sm mr-2" placeholder="客户名称" style="width:120px">
            <select id="filter-level" class="form-control form-control-sm mr-2" style="width:100px">
                <option value="">全部级别</option>
                <option value="0">普通</option>
                <option value="1">重要</option>
                <option value="2">战略</option>
            </select>
            <select id="filter-tag_id" class="form-control form-control-sm mr-2" style="width:120px">
                <option value="">全部标签</option>
                {volist name="tagList" id="t"}
                <option value="{$t.id}">{$t.name}</option>
                {/volist}
            </select>
            <select id="filter-status" class="form-control form-control-sm mr-2" style="width:90px">
                <option value="">全部状态</option>
                <option value="1">正常</option>
                <option value="0">停用</option>
            </select>
            <button type="button" class="btn btn-sm btn-primary" id="btn-search">搜索</button>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>

<script>
(function() {
    function init() {
        if (typeof jQuery === 'undefined' || typeof jQuery.fn.bootstrapTable !== 'function') {
            return false;
        }

        var $ = jQuery;
        var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
        var table = $('#table');

        if (table.data('bootstrap.table')) {
            return true;
        }

        table.bootstrapTable({
            url: base + '/crm/customer/index',
            method: 'get',
            sidePagination: 'server',
            pagination: true,
            pageSize: 20,
            pageList: [10, 20, 50],
            sortName: 'id',
            sortOrder: 'desc',
            queryParams: function(params) {
                params.name = $('#filter-name').val() || '';
                params.level = $('#filter-level').val() || '';
                params.tag_id = $('#filter-tag_id').val() || '';
                params.status = $('#filter-status').val() || '';
                return params;
            },
            responseHandler: function(res) {
                var data = res && res.data ? res.data : {};
                return {
                    total: data.total || 0,
                    rows: data.list || []
                };
            },
            columns: [
                {checkbox: true},
                {field: 'id', title: 'ID', width: 80, sortable: true},
                {field: 'name', title: '客户名称', align: 'left'},
                {field: 'short_name', title: '简称', align: 'left'},
                {field: 'level', title: '级别', width: 100, formatter: function(value) {
                    if (value == 0) return '<span class="badge badge-secondary">普通</span>';
                    if (value == 1) return '<span class="badge badge-info">重要</span>';
                    if (value == 2) return '<span class="badge badge-warning">战略</span>';
                    return value;
                }},
                {field: 'tag_names', title: '标签', width: 120},
                {field: 'source', title: '来源', align: 'left'},
                {field: 'industry', title: '行业', align: 'left'},
                {field: 'status', title: '状态', width: 100, formatter: function(value) {
                    return value == 1 ? '<span class="badge badge-success">正常</span>' : '<span class="badge badge-danger">停用</span>';
                }},
                {field: 'create_time', title: '创建时间', width: 180, formatter: function(value) {
                    return value ? new Date(value * 1000).toLocaleString('zh-CN') : '';
                }},
                {field: 'operate', title: '操作', width: 120, events: {
                    'click .btn-edit': function(e, value, row) {
                        location.href = base + '/crm/customer/edit?id=' + row.id;
                    },
                    'click .btn-del': function(e, value, row) {
                        if (confirm('确定要删除吗？')) {
                            $.post(base + '/crm/customer/del', {ids: row.id}, function(r) {
                                if (r.code == 1) {
                                    table.bootstrapTable('refresh');
                                    alert(r.msg || '删除成功');
                                } else {
                                    alert(r.msg || '删除失败');
                                }
                            }, 'json');
                        }
                    }
                }, formatter: function(value, row) {
                    return '<a href="' + base + '/crm/customer/edit?id=' + row.id + '" class="btn btn-xs btn-success btn-edit">编辑</a> ' +
                           '<a href="javascript:;" class="btn btn-xs btn-danger btn-del">删除</a>';
                }}
            ]
        });

        $(document).off('click', '#toolbar .btn-refresh').on('click', '#toolbar .btn-refresh', function() {
            table.bootstrapTable('refresh');
        });
        $(document).off('click', '#btn-search').on('click', '#btn-search', function() {
            table.bootstrapTable('refresh');
        });

        $(document).off('click', '#toolbar .btn-edit').on('click', '#toolbar .btn-edit', function() {
            var rows = table.bootstrapTable('getSelections');
            if (rows.length != 1) {
                alert('请选择一条记录');
                return;
            }
            location.href = base + '/crm/customer/edit?id=' + rows[0].id;
        });

        $(document).off('click', '#toolbar .btn-del').on('click', '#toolbar .btn-del', function() {
            var rows = table.bootstrapTable('getSelections');
            if (rows.length == 0) {
                alert('请选择要删除的记录');
                return;
            }
            if (!confirm('确定要删除选中的 ' + rows.length + ' 条记录吗？')) {
                return;
            }
            var ids = rows.map(function(r) { return r.id; });
            $.post(base + '/crm/customer/del', {ids: ids.join(',')}, function(r) {
                if (r.code == 1) {
                    table.bootstrapTable('refresh');
                    alert(r.msg || '删除成功');
                } else {
                    alert(r.msg || '删除失败');
                }
            }, 'json');
        });

        table.on('check.bs.table uncheck.bs.table check-all.bs.table uncheck-all.bs.table', function() {
            var rows = table.bootstrapTable('getSelections');
            $('#toolbar .btn-edit').toggleClass('disabled btn-disabled', rows.length !== 1);
            $('#toolbar .btn-del').toggleClass('disabled btn-disabled', rows.length === 0);
        });

        return true;
    }

    function wait() {
        if (!init()) {
            setTimeout(wait, 50);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', wait);
    } else {
        wait();
    }
})();
</script>
