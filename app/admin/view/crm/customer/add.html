<form id="form-add" class="form-horizontal" role="form" action="" method="post">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" class="form-control" name="row[name]" value="" placeholder="请输入客户名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">简称</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-short_name" class="form-control" name="row[short_name]" value="" placeholder="客户简称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户级别</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-level" class="form-control" name="row[level]">
                <option value="0" selected>普通</option>
                <option value="1">重要</option>
                <option value="2">战略</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户标签</label>
        <div class="col-xs-12 col-sm-8">
            {volist name="tagList" id="tag"}
            <label class="mr-3"><input type="checkbox" name="tag_ids[]" value="{$tag.id}"> {$tag.name}</label>
            {/volist}
            {empty name="tagList"}<span class="text-muted">暂无标签，请先在<a href="{$config.moduleurl}/crm/customer_tag/index">客户标签</a>中添加</span>{/empty}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户来源</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-source" class="form-control" name="row[source]" value="" placeholder="如：网络推广、朋友介绍等">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">所属行业</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-industry" class="form-control" name="row[industry]" value="" placeholder="如：制造业、服务业等">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">地址</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address" class="form-control" name="row[address]" value="" placeholder="请输入地址">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" class="form-control" name="row[status]">
                <option value="1" selected>正常</option>
                <option value="0">停用</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-remark" class="form-control" name="row[remark]" rows="3" placeholder="备注信息"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('form-add');
    if (!form) return;

    var submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        var name = form.querySelector('[name="row[name]"]').value || '';

        if (!name.trim()) {
            alert('请输入客户名称');
            return;
        }

        if (submitBtn) {
            submitBtn.disabled = true;
        }

        var xhr = new XMLHttpRequest();
        xhr.open('POST', form.getAttribute('action') || window.location.href, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (submitBtn) {
                    submitBtn.disabled = false;
                }
                if (xhr.status >= 200 && xhr.status < 300) {
                    var r;
                    try {
                        r = JSON.parse(xhr.responseText);
                    } catch (e) {
                        alert('返回数据格式错误');
                        return;
                    }
                    if (r.msg) {
                        alert(r.msg);
                    }
                    if (r.code === 1) {
                        var base = (window.Config && Config.moduleurl) ? Config.moduleurl : '/admin';
                        window.location.href = base + '/crm/customer/index';
                    }
                } else {
                    alert('网络错误，请重试');
                }
            }
        };
        xhr.send(new URLSearchParams(new FormData(form)).toString());
    });
});
</script>
