<form id="form-edit" class="form-horizontal" role="form" action="" method="post" data-id="{$row.id}" data-module="crm/product">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">产品名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="{$row.name|default=''}" placeholder="请输入产品名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">产品编码</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[code]" value="{$row.code|default=''}" placeholder="产品编码">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">单位</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[unit]" value="{$row.unit|default='个'}" placeholder="如：个、件、套">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">参考单价</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" step="0.01" class="form-control" name="row[price]" value="{$row.price|default='0'}" placeholder="参考单价">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]">
                <option value="1" {if condition="$row.status==1"}selected{/if}>正常</option>
                <option value="0" {if condition="$row.status==0"}selected{/if}>停用</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[remark]" rows="2" placeholder="备注">{$row.remark|default=''}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
