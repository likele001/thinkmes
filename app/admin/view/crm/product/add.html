<form id="form-add" class="form-horizontal" role="form" action="" method="post">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">产品名称<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[name]" value="" placeholder="请输入产品名称">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">产品编码</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[code]" value="" placeholder="产品编码">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">单位</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" name="row[unit]" value="个" placeholder="如：个、件、套">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">参考单价</label>
        <div class="col-xs-12 col-sm-8">
            <input type="number" step="0.01" class="form-control" name="row[price]" value="0" placeholder="参考单价">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]">
                <option value="1" selected>正常</option>
                <option value="0">停用</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[remark]" rows="2" placeholder="备注"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('form-add');
    if (!form) return;
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = form.querySelector('[name="row[name]"]').value || '';
        if (!name.trim()) { alert('请输入产品名称'); return; }
        var btn = form.querySelector('button[type="submit"]');
        if (btn) btn.disabled = true;
        var xhr = new XMLHttpRequest();
        xhr.open('POST', form.getAttribute('action') || window.location.href, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (btn) btn.disabled = false;
                if (xhr.status >= 200 && xhr.status < 300) {
                    var r; try { r = JSON.parse(xhr.responseText); } catch (e) { alert('返回数据格式错误'); return; }
                    if (r.msg) alert(r.msg);
                    if (r.code === 1) { var base = (window.Config && Config.moduleurl) ? Config.moduleurl : '/admin'; window.location.href = base + '/crm/product/index'; }
                } else alert('网络错误，请重试');
            }
        };
        xhr.send(new URLSearchParams(new FormData(form)).toString());
    });
});
</script>
