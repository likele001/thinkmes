<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>产品管理</em> 管理 CRM 产品信息</div>
    </div>
    <div class="card-body">
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fas fa-sync-alt"></i> 刷新</a>
            <a href="{$config.moduleurl}/crm/product/add" class="btn btn-success btn-add" title="添加"><i class="fas fa-plus"></i> 添加产品</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled" title="编辑"><i class="fas fa-edit"></i> 编辑</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled" title="删除"><i class="fas fa-trash-alt"></i> 删除</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>

<script>
(function() {
    function init() {
        if (typeof jQuery === 'undefined' || typeof jQuery.fn.bootstrapTable !== 'function') return false;
        var $ = jQuery, base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '', table = $('#table');
        if (table.data('bootstrap.table')) return true;
        table.bootstrapTable({
            url: base + '/crm/product/index', method: 'get', sidePagination: 'server', pagination: true, pageSize: 20, pageList: [10, 20, 50], sortName: 'id', sortOrder: 'desc',
            responseHandler: function(res) { var d = res && res.data ? res.data : {}; return { total: d.total || 0, rows: d.list || [] }; },
            columns: [
                {field: 'id', title: 'ID', width: 80, sortable: true},
                {field: 'name', title: '产品名称', align: 'left'},
                {field: 'code', title: '产品编码', align: 'left'},
                {field: 'unit', title: '单位', width: 80},
                {field: 'price', title: '参考单价', width: 120, formatter: function(v) { return v ? parseFloat(v).toLocaleString('zh-CN', {minimumFractionDigits: 2}) : ''; }},
                {field: 'status', title: '状态', width: 100, formatter: function(v) { return v == 1 ? '<span class="badge badge-success">正常</span>' : '<span class="badge badge-danger">停用</span>'; }},
                {field: 'create_time', title: '创建时间', width: 180, formatter: function(v) { return v ? new Date(v * 1000).toLocaleString('zh-CN') : ''; }},
                {field: 'operate', title: '操作', width: 120, events: {
                    'click .btn-edit': function(e, v, row) { location.href = base + '/crm/product/edit?id=' + row.id; },
                    'click .btn-del': function(e, v, row) { if (confirm('确定要删除吗？')) { $.post(base + '/crm/product/del', {ids: row.id}, function(r) { if (r.code == 1) { table.bootstrapTable('refresh'); alert(r.msg || '删除成功'); } else alert(r.msg || '删除失败'); }, 'json'); } }
                }, formatter: function(v, row) {
                    return '<a href="' + base + '/crm/product/edit?id=' + row.id + '" class="btn btn-xs btn-success btn-edit">编辑</a> <a href="javascript:;" class="btn btn-xs btn-danger btn-del">删除</a>';
                }}
            ]
        });
        $(document).off('click', '#toolbar .btn-refresh').on('click', '#toolbar .btn-refresh', function() { table.bootstrapTable('refresh'); });
        $(document).off('click', '#toolbar .btn-edit').on('click', '#toolbar .btn-edit', function() {
            var rows = table.bootstrapTable('getSelections');
            if (rows.length != 1) { alert('请选择一条记录'); return; }
            location.href = base + '/crm/product/edit?id=' + rows[0].id;
        });
        $(document).off('click', '#toolbar .btn-del').on('click', '#toolbar .btn-del', function() {
            var rows = table.bootstrapTable('getSelections');
            if (rows.length == 0) { alert('请选择要删除的记录'); return; }
            if (!confirm('确定要删除选中的 ' + rows.length + ' 条记录吗？')) return;
            var ids = rows.map(function(r) { return r.id; });
            $.post(base + '/crm/product/del', {ids: ids.join(',')}, function(r) { if (r.code == 1) { table.bootstrapTable('refresh'); alert(r.msg || '删除成功'); } else alert(r.msg || '删除失败'); }, 'json');
        });
        table.on('check.bs.table uncheck.bs.table check-all.bs.table uncheck-all.bs.table', function() {
            var rows = table.bootstrapTable('getSelections');
            $('.btn-edit, .btn-del').toggleClass('disabled btn-disabled', rows.length === 0);
        });
        return true;
    }
    function wait() { if (!init()) setTimeout(wait, 50); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wait); else wait();
})();
</script>
