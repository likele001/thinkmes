<form id="form-edit" class="form-horizontal" role="form" action="" method="post" data-id="{$row.id}" data-module="crm/contact">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-customer_id" class="form-control" name="row[customer_id]">
                <option value="">请选择客户</option>
                {volist name="customers" id="c"}
                <option value="{$c.id}" {if condition="$row.customer_id==$c.id"}selected{/if}>{$c.name}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">姓名<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" class="form-control" name="row[name]" value="{$row.name|default=''}" placeholder="请输入联系人姓名">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">职位/角色</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-role" class="form-control" name="row[role]" value="{$row.role|default=''}" placeholder="如：总经理、采购经理等">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">电话</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-phone" class="form-control" name="row[phone]" value="{$row.phone|default=''}" placeholder="联系电话">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">邮箱</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-email" type="email" class="form-control" name="row[email]" value="{$row.email|default=''}" placeholder="邮箱地址">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">主联系人</label>
        <div class="col-xs-12 col-sm-8">
            <label class="radio-inline">
                <input type="radio" name="row[is_main]" value="1" {if condition="$row.is_main==1"}checked{/if}> 是
            </label>
            <label class="radio-inline">
                <input type="radio" name="row[is_main]" value="0" {if condition="$row.is_main==0"}checked{/if}> 否
            </label>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-remark" class="form-control" name="row[remark]" rows="2" placeholder="备注信息">{$row.remark|default=''}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
