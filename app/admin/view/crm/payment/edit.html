<form id="form-edit" class="form-horizontal" role="form" action="" method="post">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-contract_id" class="form-control" name="row[contract_id]">
                <option value="">请选择合同</option>
                {volist name="contracts" id="ct"}
                <option value="{$ct.id}" {if condition="$row.contract_id==$ct.id"}selected{/if}>{$ct.contract_no}{if condition="isset($ct.customer_name) && $ct.customer_name"} - {$ct.customer_name}{/if}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">回款金额<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" type="number" step="0.01" class="form-control" name="row[amount]" value="{$row.amount|default=''}" placeholder="请输入回款金额">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">回款日期</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-pay_date" type="date" class="form-control" name="row[pay_date]" value="{if condition='$row.pay_date'}{:date('Y-m-d', $row.pay_date)}{/if}" placeholder="回款日期">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发票号</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-invoice_no" class="form-control" name="row[invoice_no]" value="{$row.invoice_no|default=''}" placeholder="请输入发票号">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-remark" class="form-control" name="row[remark]" rows="3" placeholder="备注信息">{$row.remark|default=''}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('form-edit');
    if (!form) return;

    var submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        var contractId = form.querySelector('[name="row[contract_id]"]').value || '';
        var amount = form.querySelector('[name="row[amount]"]').value || '';

        if (!contractId) {
            alert('请选择合同');
            return;
        }
        if (!amount || parseFloat(amount) <= 0) {
            alert('请输入有效的回款金额');
            return;
        }

        if (submitBtn) {
            submitBtn.disabled = true;
        }

        var xhr = new XMLHttpRequest();
        xhr.open('POST', form.getAttribute('action') || window.location.href, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (submitBtn) {
                    submitBtn.disabled = false;
                }
                if (xhr.status >= 200 && xhr.status < 300) {
                    var r;
                    try {
                        r = JSON.parse(xhr.responseText);
                    } catch (e) {
                        alert('返回数据格式错误');
                        return;
                    }
                    if (r.msg) {
                        alert(r.msg);
                    }
                    if (r.code === 1) {
                        var base = (window.Config && Config.moduleurl) ? Config.moduleurl : '/admin';
                        window.location.href = base + '/crm/payment/index';
                    }
                } else {
                    alert('网络错误，请重试');
                }
            }
        };
        xhr.send(new URLSearchParams(new FormData(form)).toString());
    });
});
</script>
