<form id="form-add" class="form-horizontal" role="form" action="" method="post" data-url="crm/payment/add" data-back="crm/payment">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-contract_id" class="form-control" name="row[contract_id]">
                <option value="">请选择合同</option>
                {volist name="contracts" id="ct"}
                <option value="{$ct.id}">{$ct.contract_no} - {$ct.customer_name}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">回款金额<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" type="number" step="0.01" class="form-control" name="row[amount]" value="" placeholder="请输入回款金额">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">回款日期</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-pay_date" type="date" class="form-control" name="row[pay_date]" value="" placeholder="回款日期">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发票号</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-invoice_no" class="form-control" name="row[invoice_no]" value="" placeholder="请输入发票号">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-remark" class="form-control" name="row[remark]" rows="3" placeholder="备注信息"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
