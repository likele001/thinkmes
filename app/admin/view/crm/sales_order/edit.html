<form id="form-edit" class="form-horizontal" role="form" action="" method="post" data-id="{$row.id}" data-module="crm/sales_order">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">订单编号</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" value="{$row.order_no|default=''}" disabled>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select id="customer_id" class="form-control" name="row[customer_id]">
                {volist name="customers" id="c"}
                <option value="{$c.id}" {if condition="$row.customer_id==$c.id"}selected{/if}>{$c.name}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联合同</label>
        <div class="col-xs-12 col-sm-8">
            <select id="contract_id" class="form-control" name="row[contract_id]">
                <option value="">请选择合同（可选）</option>
                {volist name="contracts" id="ct"}
                <option value="{$ct.id}" {if condition="$row.contract_id==$ct.id"}selected{/if}>{$ct.contract_no}{if condition="isset($ct.customer_name) && $ct.customer_name"} - {$ct.customer_name}{/if}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态</label>
        <div class="col-xs-12 col-sm-8">
            <select class="form-control" name="row[status]">
                <option value="draft" {if condition="$row.status=='draft'"}selected{/if}>草稿</option>
                <option value="confirmed" {if condition="$row.status=='confirmed'"}selected{/if}>已确认</option>
                <option value="producing" {if condition="$row.status=='producing'"}selected{/if}>生产中</option>
                <option value="completed" {if condition="$row.status=='completed'"}selected{/if}>已完成</option>
                <option value="cancelled" {if condition="$row.status=='cancelled'"}selected{/if}>已取消</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">交货日期</label>
        <div class="col-xs-12 col-sm-8">
            <input type="date" class="form-control" name="row[delivery_date]" value="{if condition='$row.delivery_date'}{:date('Y-m-d', $row.delivery_date)}{/if}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">订单明细</label>
        <div class="col-xs-12 col-sm-10">
            <table class="table table-bordered" id="items-table">
                <thead><tr><th>产品</th><th>数量</th><th>单价</th><th>金额</th><th>操作</th></tr></thead>
                <tbody id="items-tbody"></tbody>
            </table>
            <button type="button" class="btn btn-sm btn-default" id="btn-add-item"><i class="fas fa-plus"></i> 添加明细</button>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="row[remark]" rows="2" placeholder="备注">{$row.remark|default=''}</textarea>
        </div>
    </div>
    {if condition="$row.mes_order_id > 0"}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <span class="badge badge-success">已转 MES 生产订单</span>
        </div>
    </div>
    {/if}
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
<script type="application/json" id="sales-order-products">{:json_encode($products)}</script>
<script type="application/json" id="sales-order-items">{:json_encode($items)}</script>
