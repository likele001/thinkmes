<form id="form-add" class="form-horizontal" role="form" action="" method="post" data-url="crm/follow/add" data-back="crm/follow">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-customer_id" class="form-control" name="row[customer_id]">
                <option value="">请选择客户</option>
                {volist name="customers" id="c"}
                <option value="{$c.id}">{$c.name}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联商机</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-opportunity_id" class="form-control" name="row[opportunity_id]">
                <option value="">请选择商机（可选）</option>
                {volist name="opportunities" id="o"}
                <option value="{$o.id}">{$o.name}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">跟进方式</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-type" class="form-control" name="row[type]">
                <option value="visit" selected>拜访</option>
                <option value="phone">电话</option>
                <option value="email">邮件</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">跟进内容<span class="text-danger">*</span></label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-content" class="form-control" name="row[content]" rows="5" placeholder="请输入跟进内容"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">下次跟进时间</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-next_follow_time" type="datetime-local" class="form-control" name="row[next_follow_time]" value="" placeholder="下次跟进时间">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-remark" class="form-control" name="row[remark]" rows="3" placeholder="备注信息"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
