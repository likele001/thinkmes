<div class="card panel-intro">
    <div class="card-header">
        <div class="panel-lead"><em>跟进记录管理</em> 管理客户跟进记录</div>
    </div>
    <div class="card-body">
        <div id="toolbar" class="toolbar mb-2">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新"><i class="fas fa-sync-alt"></i> 刷新</a>
            <a href="{$config.moduleurl}/crm/follow/add" class="btn btn-success btn-add" title="添加"><i class="fas fa-plus"></i> 添加跟进</a>
            <a href="javascript:;" id="btn-crm-suggest" class="btn btn-info" title="智能建议"><i class="fas fa-brain"></i> 智能建议</a>
            <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled" title="编辑"><i class="fas fa-edit"></i> 编辑</a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled" title="删除"><i class="fas fa-trash-alt"></i> 删除</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>

<script>
(function() {
    function init() {
        if (typeof jQuery === 'undefined' || typeof jQuery.fn.bootstrapTable !== 'function') {
            return false;
        }

        var $ = jQuery;
        var base = (typeof Config !== 'undefined' && Config.moduleurl) ? Config.moduleurl : '';
        var table = $('#table');

        if (table.data('bootstrap.table')) {
            return true;
        }

        table.bootstrapTable({
            url: base + '/crm/follow/index',
            method: 'get',
            sidePagination: 'server',
            pagination: true,
            pageSize: 20,
            pageList: [10, 20, 50],
            sortName: 'id',
            sortOrder: 'desc',
            responseHandler: function(res) {
                var data = res && res.data ? res.data : {};
                return {
                    total: data.total || 0,
                    rows: data.list || []
                };
            },
            columns: [
                {field: 'id', title: 'ID', width: 80, sortable: true},
                {field: 'customer_name', title: '客户名称', align: 'left'},
                {field: 'opportunity_name', title: '关联商机', align: 'left'},
                {field: 'type', title: '跟进方式', width: 120, formatter: function(value) {
                    if (value === 'visit') return '<span class="badge badge-info">拜访</span>';
                    if (value === 'phone') return '<span class="badge badge-primary">电话</span>';
                    if (value === 'email') return '<span class="badge badge-success">邮件</span>';
                    return value || '';
                }},
                {field: 'content', title: '跟进内容', align: 'left', formatter: function(value) {
                    if (!value) return '';
                    return value.length > 50 ? value.substring(0, 50) + '...' : value;
                }},
                {field: 'next_follow_time', title: '下次跟进时间', width: 180, formatter: function(value) {
                    return value ? new Date(value * 1000).toLocaleString('zh-CN') : '';
                }},
                {field: 'admin_id', title: '跟进人', width: 100},
                {field: 'create_time', title: '创建时间', width: 180, formatter: function(value) {
                    return value ? new Date(value * 1000).toLocaleString('zh-CN') : '';
                }},
                {field: 'operate', title: '操作', width: 120, events: {
                    'click .btn-edit': function(e, value, row) {
                        location.href = base + '/crm/follow/edit?id=' + row.id;
                    },
                    'click .btn-del': function(e, value, row) {
                        if (confirm('确定要删除吗？')) {
                            $.post(base + '/crm/follow/del', {ids: row.id}, function(r) {
                                if (r.code == 1) {
                                    table.bootstrapTable('refresh');
                                    alert(r.msg || '删除成功');
                                } else {
                                    alert(r.msg || '删除失败');
                                }
                            }, 'json');
                        }
                    }
                }, formatter: function(value, row) {
                    return '<a href="' + base + '/crm/follow/edit?id=' + row.id + '" class="btn btn-xs btn-success btn-edit">编辑</a> ' +
                           '<a href="javascript:;" class="btn btn-xs btn-danger btn-del">删除</a>';
                }}
            ]
        });

        $(document).off('click', '#toolbar .btn-refresh').on('click', '#toolbar .btn-refresh', function() {
            table.bootstrapTable('refresh');
        });

        $(document).off('click', '#toolbar .btn-edit').on('click', '#toolbar .btn-edit', function() {
            var rows = table.bootstrapTable('getSelections');
            if (rows.length != 1) {
                alert('请选择一条记录');
                return;
            }
            location.href = base + '/crm/follow/edit?id=' + rows[0].id;
        });

        // CRM AI: 智能跟单建议（选中一条跟进记录或指定客户/商机）
        $(document).off('click', '#btn-crm-suggest').on('click', '#btn-crm-suggest', function() {
            var rows = table.bootstrapTable('getSelections');
            if (rows.length != 1) {
                alert('请选择一条跟进记录以获取建议');
                return;
            }
            var r = rows[0];
            var customerId = r.customer_id || 0;
            var opportunityId = r.opportunity_id || 0;
            fetch(base + '/crm/follow/suggest', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({customer_id: customerId, opportunity_id: opportunityId})})
                .then(r=>r.json()).then(function(j){
                    if (!j) { alert('请求失败'); return; }
                    if (j.code != 0) { alert(j.msg || 'AI 生成失败'); return; }
                    var html = '跟进建议：\n' + (j.data.follow_advice || '') + '\n\n话术：\n' + (j.data.script || '') + '\n\n意向分：' + (j.data.intent_score || 0) + '\n理由：' + (j.data.intent_reason || '');
                    alert(html);
                    table.bootstrapTable('refresh');
                });
        });

        $(document).off('click', '#toolbar .btn-del').on('click', '#toolbar .btn-del', function() {
            var rows = table.bootstrapTable('getSelections');
            if (rows.length == 0) {
                alert('请选择要删除的记录');
                return;
            }
            if (!confirm('确定要删除选中的 ' + rows.length + ' 条记录吗？')) {
                return;
            }
            var ids = rows.map(function(r) { return r.id; });
            $.post(base + '/crm/follow/del', {ids: ids.join(',')}, function(r) {
                if (r.code == 1) {
                    table.bootstrapTable('refresh');
                    alert(r.msg || '删除成功');
                } else {
                    alert(r.msg || '删除失败');
                }
            }, 'json');
        });

        table.on('check.bs.table uncheck.bs.table check-all.bs.table uncheck-all.bs.table', function() {
            var rows = table.bootstrapTable('getSelections');
            if (rows.length > 0) {
                $('.btn-edit, .btn-del').removeClass('disabled btn-disabled');
            } else {
                $('.btn-edit, .btn-del').addClass('disabled btn-disabled');
            }
        });

        return true;
    }

    function wait() {
        if (!init()) {
            setTimeout(wait, 50);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', wait);
    } else {
        wait();
    }
})();
</script>
